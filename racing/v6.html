<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V6</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050812;color:#fff;font-family:system-ui}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:14px;font-weight:900}.pill{background:#07101dcc;border:1px solid #ffffff22;border-radius:12px;padding:7px 10px;margin:2px;font-size:12px}.ai{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:#071426dd;border:1px solid #55ddff55;padding:6px 10px;border-radius:99px;font-size:11px}.controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}.btn{width:68px;height:60px;border:1px solid #ffffff30;border-radius:18px;background:#07101ddd;color:#fff;font-size:25px;font-weight:900}.nitro{width:92px;font-size:12px}.menu{position:fixed;inset:0;display:grid;place-items:center;background:#020611df;z-index:5}.card{width:min(470px,88vw);text-align:center;padding:28px;border:1px solid #ffffff22;border-radius:26px;background:#091325f2;box-shadow:0 25px 90px #000}.card h1{font-size:58px;margin:0;background:linear-gradient(90deg,#fff,#5de0ff,#ce67ff);color:transparent;background-clip:text}.card p{opacity:.7}.start{padding:15px 25px;border:0;border-radius:14px;font-weight:900;background:#fff}.hidden{display:none}.result{font-size:22px;font-weight:900;margin:15px}.sub{font-size:12px;opacity:.6}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><span class="pill">LUMIRA // RACING V6</span><span><span class="pill">🏁 <b id="lap">1/3</b></span><span class="pill">⭐ <b id="score">0</b></span></span></div></div><div class="ai" id="ai">AI DRIVER: READY</div><div class="controls"><div><button class="btn" id="l">‹</button><button class="btn" id="r">›</button></div><button class="btn nitro" id="n">NITRO</button></div><div class="menu" id="m"><div class="card"><h1>LUMIRA</h1><h2 id="title">RACING V6</h2><p id="desc">3-lap arcade race • checkpoints • adaptive AI • traffic</p><div id="result" class="result hidden"></div><button class="start" id="s">START RACE</button><div class="sub">Touch controls or Arrow keys + Space for nitro</div></div></div><script>const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,d=1;function rs(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();const API='https://studious-octo-fishstick-6.onrender.com';let key={l:0,r:0,n:0},run=0,t=0,score=0,lap=1,progress=0,px,ai={action:'STEADY'},aiCar;let traffic=[];function rw(){return Math.min(W*.72,680)}function reset(){px=W/2;score=0;lap=1;progress=0;ai={action:'STEADY'};aiCar={x:W*.5,y:H*.42,s:.95};traffic=[];for(let i=0;i<7;i++)traffic.push({x:W/2+(Math.random()-.5)*rw()*.72,y:-120-i*180,s:.7+Math.random()*.55,col:`hsl(${Math.random()*360} 80% 58%)`})}function car(px,py,col,me=false){x.save();x.translate(px,py);x.shadowColor=me?'#42e8ff':'#000';x.shadowBlur=me?25:9;x.fillStyle='#101521';x.roundRect(-25,-44,50,88,12);x.fill();let g=x.createLinearGradient(-25,0,25,0);g.addColorStop(0,'#0b1019');g.addColorStop(.22,col);g.addColorStop(.5,'#fff');g.addColorStop(.58,col);g.addColorStop(1,'#0b1019');x.fillStyle=g;x.roundRect(-20,-39,40,78,10);x.fill();x.fillStyle='#061827';x.roundRect(-15,-23,30,24,6);x.fill();x.fillStyle=me?'#5ff6ff':'#ff304d';x.fillRect(-15,-37,30,4);x.fillRect(-15,33,30,4);x.restore()}function draw(){let h=H*.23;x.fillStyle='#061020';x.fillRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#081126');g.addColorStop(1,'#1c5774');x.fillStyle=g;x.fillRect(0,0,W,h);for(let z=0;z<4;z++){x.fillStyle=['#102735','#0d202a','#0a1a23','#07131d'][z];for(let i=-1;i<11;i++){let xx=i*110-(t*(20+z*13)%110),bh=50+(i*37+z*19)%90;x.fillRect(xx,h+z*32-bh,75,bh)}}x.fillStyle='#183b2c';x.fillRect(0,h,W,H-h);let r=rw();x.fillStyle='#242a32';x.beginPath();x.moveTo(W/2-r*.52,h);x.lineTo(W/2+r*.52,h);x.lineTo(W/2+r*.42,H);x.lineTo(W/2-r*.42,H);x.closePath();x.fill();x.strokeStyle='#f4d86a';x.lineWidth=5;x.beginPath();x.moveTo(W/2-r*.52,h);x.lineTo(W/2-r*.42,H);x.moveTo(W/2+r*.52,h);x.lineTo(W/2+r*.42,H);x.stroke();x.strokeStyle='#eee';x.lineWidth=3;x.setLineDash([32,28]);x.lineDashOffset=-(t*2%60);for(let q=1;q<3;q++){let xx=W/2-r*.42+r*.28*q;x.beginPath();x.moveTo(xx,h);x.lineTo(xx,H);x.stroke()}x.setLineDash([]);traffic.forEach(q=>car(q.x,q.y,q.col));car(aiCar.x,aiCar.y,'#ff3d61');car(px,H*.78,'#4d82ff',true)}function update(dt){if(!run)return;t+=dt;let sp=dt*(410*(key.n?1.65:1));px+=((key.r?1:0)-(key.l?1:0))*dt*360;let r=rw();px=Math.max(W/2-r*.39,Math.min(W/2+r*.39,px));traffic.forEach(q=>{q.y+=sp*q.s;if(q.y>H+100){q.y=-100-Math.random()*450;q.x=W/2+(Math.random()-.5)*r*.72;score+=100}if(Math.abs(q.x-px)<42&&Math.abs(q.y-H*.78)<75){score=Math.max(0,score-150);q.y=-300}});let ais=ai.action==='NITRO'?1.45:ai.action==='ACCELERATE'?1.22:ai.action==='SAVE'?1.02:.94;aiCar.s=ais;aiCar.x+=Math.sign(px-aiCar.x)*dt*(150+ais*90);aiCar.x=Math.max(W/2-r*.36,Math.min(W/2+r*.36,aiCar.x));aiCar.y+=dt*260*ais;if(aiCar.y>H+80)aiCar.y=-80;progress+=sp;if(progress>=2800){progress-=2800;lap++;if(lap>3)finish()}}function finish(){run=0;document.querySelector('#m').classList.remove('hidden');document.querySelector('#title').textContent='RACE COMPLETE';document.querySelector('#desc').textContent='Checkpoint finish reached';document.querySelector('#result').classList.remove('hidden');document.querySelector('#result').textContent='⭐ SCORE '+Math.floor(score)+' • 🏁 3/3 LAPS';document.querySelector('#s').textContent='RACE AGAIN'}async function getAI(){if(!run)return;try{let r=await fetch(API+'/api/race-advice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({speed:key.n?170:105,nitro:key.n?20:75,position:aiCar.y<H*.78?1:2,lap})});if(r.ok){ai=await r.json();document.querySelector('#ai').textContent='AI DRIVER: '+String(ai.action||'STEADY')}}catch(e){document.querySelector('#ai').textContent='AI DRIVER: OFFLINE'}}setInterval(getAI,3000);function loop(now){let dt=Math.min(.033,(now-(loop.last||now))/1000);loop.last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);document.querySelector('#s').onclick=()=>{document.querySelector('#m').classList.add('hidden');document.querySelector('#result').classList.add('hidden');document.querySelector('#title').textContent='RACING V6';document.querySelector('#desc').textContent='3-lap arcade race • checkpoints • adaptive AI • traffic';reset();run=1;getAI()};function bind(id,k){let e=document.querySelector(id);e.onpointerdown=()=>key[k]=1;e.onpointerup=e.onpointercancel=e.onpointerleave=()=>key[k]=0}bind('#l','l');bind('#r','r');bind('#n','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')key.l=1;if(e.key==='ArrowRight')key.r=1;if(e.code==='Space')key.n=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')key.l=0;if(e.key==='ArrowRight')key.r=0;if(e.code==='Space')key.n=0});</script></body></html>
