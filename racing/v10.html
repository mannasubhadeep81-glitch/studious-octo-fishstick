<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V10</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050812;color:#fff;font-family:system-ui}canvas{display:block;width:100%;height:100%}.panel{position:fixed;inset:0;display:grid;place-items:center;background:#020611e8;z-index:5}.card{width:min(520px,90vw);padding:25px;border-radius:24px;background:#091325f7;text-align:center;border:1px solid #ffffff20}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.btn{background:#07101ddd;border:1px solid #ffffff25;border-radius:12px;color:#fff;padding:11px;font-weight:800}.big{margin:5px;padding:13px 20px}.hidden{display:none}.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px;z-index:2;pointer-events:none}.pill{background:#07101ddd;border:1px solid #ffffff22;border-radius:12px;padding:7px 10px;font-size:12px;font-weight:900}.controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}.drive{width:68px;height:58px;font-size:24px}.nitro{width:92px}.ai{position:fixed;top:55px;left:50%;transform:translateX(-50%);font-size:11px;background:#071426dd;padding:6px 10px;border-radius:99px;z-index:2}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);padding:8px 12px;border-radius:10px;background:#07101dee;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.stat{opacity:.75;font-size:13px}</style></head><body><canvas id="c"></canvas><div class="top"><span class="pill">LUMIRA RACING V10</span><span class="pill">🪙 <b id="coins">0</b> · 🏆 <b id="best">0</b></span></div><div id="ai" class="ai">AI DRIVER: READY</div><div class="controls"><div><button class="btn drive" id="l">‹</button><button class="btn drive" id="r">›</button></div><button class="btn nitro" id="n">NITRO</button></div><div id="menu" class="panel"><div class="card"><h1>🏎️ LUMIRA</h1><h2 id="heading">RACING V10</h2><p class="stat">Garage • Upgrades • Tracks • Records • Settings</p><div id="garage" class="grid"></div><div class="row"><button class="btn big" id="upgrade">UPGRADE</button><button class="btn big" id="track">TRACK</button><button class="btn big" id="race">START RACE</button></div><p id="msg" class="stat"></p></div></div><div id="toast" class="toast"></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,d=1;function resize(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();const API='https://studious-octo-fishstick-6.onrender.com';const cars=[['Azure','#4d82ff',0],['Crimson','#ff3d61',300],['Violet','#a66cff',650],['Gold','#ffc44d',1200]];const tracks=['Neon City','Sunset Coast','Midnight Circuit','Rain District'];let coins=+(localStorage.lumiraCoins||0),best=+(localStorage.lumiraBest||0),selected=+(localStorage.lumiraCar||0),level=+(localStorage.lumiraLevel||1),track=+(localStorage.lumiraTrack||0),run=false,t=0,px=0,lap=1,prog=0,score=0,key={l:0,r:0,n:0},ai={action:'STEADY'},opp={x:0,y:0};let traffic=[];function save(){Object.assign(localStorage,{lumiraCoins:coins,lumiraBest:best,lumiraCar:selected,lumiraLevel:level,lumiraTrack:track})}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}function garage(){document.getElementById('coins').textContent=coins;document.getElementById('best').textContent=best;document.getElementById('garage').innerHTML=cars.map((a,i)=>`<button class="btn" data-i="${i}">${a[0]}<br>${i===selected?'SELECTED':'🪙 '+a[2]}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(i===selected)return;if(coins>=cars[i][2]){coins-=cars[i][2];selected=i;level=1;save();garage();toast('Car selected')}})}garage();function road(){return Math.min(W*.72,680)}function reset(){px=W/2;lap=1;prog=0;score=0;opp={x:W*.5,y:H*.42};traffic=[];for(let i=0;i<8;i++)traffic.push({x:W/2+(Math.random()-.5)*road()*.72,y:-100-i*190,s:.7+Math.random()*.6})}function car(a,b,col,me){x.save();x.translate(a,b);x.shadowBlur=me?24:8;x.shadowColor=me?'#42e8ff':'#000';x.fillStyle='#111722';x.roundRect(-25,-44,50,88,12);x.fill();x.fillStyle=col;x.roundRect(-20,-39,40,78,10);x.fill();x.fillStyle='#061827';x.roundRect(-15,-23,30,24,6);x.fill();x.fillStyle=me?'#5ff6ff':'#ff304d';x.fillRect(-15,-37,30,4);x.restore()}function draw(){let h=H*.23;x.fillStyle=['#071426','#503326','#09091b','#142126'][track];x.fillRect(0,0,W,H);x.fillStyle=track===1?'#9a6c42':track===3?'#29434a':'#183b2c';x.fillRect(0,h,W,H-h);let r=road();x.fillStyle='#252a31';x.beginPath();x.moveTo(W/2-r*.52,h);x.lineTo(W/2+r*.52,h);x.lineTo(W/2+r*.42,H);x.lineTo(W/2-r*.42,H);x.closePath();x.fill();x.strokeStyle='#f4d86a';x.lineWidth=5;x.stroke();x.strokeStyle='#fff';x.lineWidth=3;x.setLineDash([30,28]);x.lineDashOffset=-t*2;for(let q=1;q<3;q++){let xx=W/2-r*.42+r*.28*q;x.beginPath();x.moveTo(xx,h);x.lineTo(xx,H);x.stroke()}x.setLineDash([]);traffic.forEach(q=>car(q.x,q.y,'#55aaff'));car(opp.x,opp.y,'#ff3d61');car(px,H*.78,cars[selected][1],true)}function update(dt){if(!run)return;t+=dt;let r=road(),sp=410*dt*(1+(level-1)*.07)*(key.n?1.65:1);px+=((key.r?1:0)-(key.l?1:0))*dt*360;px=Math.max(W/2-r*.39,Math.min(W/2+r*.39,px));traffic.forEach(q=>{q.y+=sp*q.s;if(q.y>H+100){q.y=-100-Math.random()*450;q.x=W/2+(Math.random()-.5)*r*.72;score+=100}if(Math.abs(q.x-px)<42&&Math.abs(q.y-H*.78)<75){score=Math.max(0,score-150);q.y=-300}});let s=ai.action==='NITRO'?1.45:ai.action==='ACCELERATE'?1.22:ai.action==='SAVE'?1.02:.94;opp.x+=Math.sign(px-opp.x)*dt*(150+s*90);opp.x=Math.max(W/2-r*.36,Math.min(W/2+r*.36,opp.x));opp.y+=dt*260*s;if(opp.y>H+80)opp.y=-80;prog+=sp;if(prog>=2800){prog-=2800;lap++;if(lap>3)finish()}}function finish(){run=false;let pos=opp.y<H*.78?2:1;score+=pos===1?500:200;coins+=100+level*25;best=Math.max(best,score);save();document.getElementById('menu').classList.remove('hidden');document.getElementById('heading').textContent='RACE COMPLETE';document.getElementById('msg').textContent=`${pos===1?'🥇 1st PLACE':'🥈 2nd PLACE'} · Score ${score} · +${100+level*25} coins`;garage()}async function getAI(){if(!run)return;try{let r=await fetch(API+'/api/race-advice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({speed:key.n?170:105,nitro:key.n?20:75,position:opp.y<H*.78?1:2,lap})});if(r.ok){ai=await r.json();document.getElementById('ai').textContent='AI DRIVER: '+(ai.action||'STEADY')}}catch(e){document.getElementById('ai').textContent='AI DRIVER: OFFLINE'}}setInterval(getAI,3000);document.getElementById('upgrade').onclick=()=>{let cost=200*level;if(coins>=cost){coins-=cost;level++;save();garage();toast('Upgrade Lv.'+level)}else toast('Need '+cost+' coins')};document.getElementById('track').onclick=()=>{track=(track+1)%tracks.length;save();toast('Track: '+tracks[track])};document.getElementById('race').onclick=()=>{document.getElementById('menu').classList.add('hidden');reset();run=true;getAI()};function bind(id,k){let e=document.getElementById(id);e.onpointerdown=()=>key[k]=1;e.onpointerup=e.onpointercancel=e.onpointerleave=()=>key[k]=0}bind('l','l');bind('r','r');bind('n','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')key.l=1;if(e.key==='ArrowRight')key.r=1;if(e.code==='Space')key.n=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')key.l=0;if(e.key==='ArrowRight')key.r=0;if(e.code==='Space')key.n=0});function loop(n){let dt=Math.min(.033,(n-(loop.last||n))/1000);loop.last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
