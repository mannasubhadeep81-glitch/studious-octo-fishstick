<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V12</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050812;color:#fff;font-family:system-ui}canvas{display:block;width:100%;height:100%}.panel{position:fixed;inset:0;background:#020611e9;display:grid;place-items:center;z-index:5}.card{width:min(560px,92vw);max-height:90vh;overflow:auto;padding:24px;border-radius:24px;background:#091325f7;border:1px solid #ffffff22;text-align:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.btn,.pill,input{background:#07101ddd;border:1px solid #ffffff25;border-radius:12px;color:#fff;padding:10px;font-weight:800}.btn{cursor:pointer;margin:4px}.selected{outline:2px solid #fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:10px 0}.stat{padding:8px;background:#ffffff09;border-radius:10px;font-size:12px}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px}.ai{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:#071426dd;padding:6px 10px;border-radius:99px;font-size:11px}.controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}.drive{width:68px;height:58px;font-size:24px}.nitro{width:92px;font-size:12px}.hidden{display:none}.small{opacity:.65;font-size:12px}.name{width:85%;padding:10px;margin:8px}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><span class="pill">LUMIRA V12</span><span><span class="pill">🏁 <b id="lap">1/3</b></span><span class="pill">🏆 <b id="pos">1st</b></span><span class="pill">⭐ <b id="score">0</b></span></span></div></div><div id="ai" class="ai">AI DRIVER: READY</div><div id="controls" class="controls"><div><button class="btn drive" id="l">‹</button><button class="btn drive" id="r">›</button></div><button class="btn nitro" id="n">NITRO</button></div><div id="menu" class="panel"><div class="card"><h1>🏎️ LUMIRA RACING</h1><input id="name" class="name" maxlength="24" placeholder="Player name"><h3>SELECT CAR</h3><div id="cars" class="grid"></div><div class="stats"><div class="stat">SPEED<br><b id="speed">0</b></div><div class="stat">HANDLING<br><b id="handling">0</b></div><div class="stat">NITRO<br><b id="nitro">0</b></div></div><h3>SELECT TRACK</h3><div id="tracks" class="grid"></div><button class="btn" id="race">START RACE</button><button class="btn" id="board">LEADERBOARD</button><div id="status" class="small"></div><div id="list" class="grid"></div></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,d=1;function rs(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();const API='https://studious-octo-fishstick-6.onrender.com';const cars=[['Azure','#4d82ff',82,78,75],['Crimson','#ff3d61',91,68,88],['Violet','#a66cff',76,91,82],['Gold','#ffd34d',87,73,96]];const tracks=[['Neon City','#081126'],['Sunset Coast','#4b2b20'],['Midnight Circuit','#09091b'],['Green Valley','#173324']];let selected=Number(localStorage.v12car||0),track=Number(localStorage.v12track||0),upgrade=Number(localStorage.v12upgrade||1),save=JSON.parse(localStorage.v12save||'{"coins":0,"best":0,"races":0}'),run=false,t=0,last=0,px,lap=1,prog=0,score=0,key={l:0,r:0,n:0},ai={action:'STEADY'},opp={x:0,y:0};const playerId=localStorage.lumiraPlayerId||('p_'+crypto.randomUUID().replaceAll('-',''));localStorage.lumiraPlayerId=playerId;function persist(){localStorage.v12car=selected;localStorage.v12track=track;localStorage.v12upgrade=upgrade;localStorage.v12save=JSON.stringify(save)}function render(){document.getElementById('name').value=save.name||'PLAYER';document.getElementById('cars').innerHTML=cars.map((a,i)=>`<button class="btn ${i===selected?'selected':''}" data-car="${i}">${a[0]}<br>⚡${a[2]} 🌀${a[3]} 💨${a[4]}</button>`).join('');document.querySelectorAll('[data-car]').forEach(b=>b.onclick=()=>{selected=+b.dataset.car;persist();render();stats()});document.getElementById('tracks').innerHTML=tracks.map((a,i)=>`<button class="btn ${i===track?'selected':''}" data-track="${i}">${a[0]}</button>`).join('');document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{track=+b.dataset.track;persist();render()});stats()}function stats(){let a=cars[selected],m=1+(upgrade-1)*.05;document.getElementById('speed').textContent=Math.round(a[2]*m);document.getElementById('handling').textContent=Math.round(a[3]*m);document.getElementById('nitro').textContent=Math.round(a[4]*m)}render();function road(){return Math.min(W*.72,680)}function reset(){px=W/2;lap=1;prog=0;score=0;opp={x:W*.5,y:H*.42};ai={action:'STEADY'}}function car(px,py,col,me=false){x.save();x.translate(px,py);x.shadowColor=me?'#42e8ff':'#000';x.shadowBlur=me?25:8;x.fillStyle='#101521';x.roundRect(-25,-44,50,88,12);x.fill();x.fillStyle=col;x.roundRect(-20,-39,40,78,10);x.fill();x.fillStyle='#061827';x.roundRect(-15,-23,30,24,6);x.fill();x.fillStyle=me?'#5ff6ff':'#ff304d';x.fillRect(-15,-37,30,4);x.restore()}function draw(){let h=H*.23;x.fillStyle=tracks[track][1];x.fillRect(0,0,W,H);x.fillStyle=track===1?'#a46d45':track===3?'#2b6139':'#183b2c';x.fillRect(0,h,W,H-h);let r=road();x.fillStyle='#252a31';x.beginPath();x.moveTo(W/2-r*.52,h);x.lineTo(W/2+r*.52,h);x.lineTo(W/2+r*.42,H);x.lineTo(W/2-r*.42,H);x.closePath();x.fill();x.strokeStyle='#f4d86a';x.lineWidth=5;x.stroke();x.strokeStyle='#fff';x.lineWidth=3;x.setLineDash([30,28]);x.lineDashOffset=-t*2;for(let q=1;q<3;q++){let xx=W/2-r*.42+r*.28*q;x.beginPath();x.moveTo(xx,h);x.lineTo(xx,H);x.stroke()}x.setLineDash([]);car(opp.x,opp.y,'#ff3d61');car(px,H*.78,cars[selected][1],true);if(key.n){x.fillStyle='#ffb52e';x.beginPath();x.moveTo(px-13,H*.82);x.lineTo(px,H*.82+55+Math.random()*18);x.lineTo(px+13,H*.82);x.fill()}}function update(dt){if(!run)return;t+=dt;let a=cars[selected],base=(a[2]/82)*(1+(upgrade-1)*.05),sp=410*dt*base*(key.n?(1.25+a[4]/300):1);px+=((key.r?1:0)-(key.l?1:0))*dt*(250+a[3]*1.2);let r=road();px=Math.max(W/2-r*.39,Math.min(W/2+r*.39,px));let s=ai.action==='NITRO'?1.45:ai.action==='ACCELERATE'?1.22:ai.action==='SAVE'?1.02:.94;opp.x+=Math.sign(px-opp.x)*dt*(150+s*90);opp.x=Math.max(W/2-r*.36,Math.min(W/2+r*.36,opp.x));opp.y+=dt*260*s;if(opp.y>H+80)opp.y=-80;prog+=sp;score+=Math.floor(sp*.04);if(prog>=2800){prog-=2800;lap++;if(lap>3)finish()}document.getElementById('lap').textContent=Math.min(lap,3)+'/3';document.getElementById('score').textContent=score;document.getElementById('pos').textContent=opp.y<H*.78?'2nd':'1st'}async function finish(){run=false;let position=opp.y<H*.78?2:1;score+=position===1?500:200;save.name=(document.getElementById('name').value||'PLAYER').trim().slice(0,24)||'PLAYER';save.best=Math.max(save.best,score);save.coins+=(position===1?150:75);save.races++;persist();document.getElementById('menu').classList.remove('hidden');document.getElementById('status').textContent='Saving to cloud…';try{await fetch(API+'/api/racing/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:save.name,score,track:tracks[track][0],car:cars[selected][0]})});await fetch(API+'/api/racing/profile/'+encodeURIComponent(playerId),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({coins:save.coins,bestScore:save.best,races:save.races})});document.getElementById('status').textContent='Cloud save complete • 🪙 '+save.coins+' • Best '+save.best}catch(e){document.getElementById('status').textContent='Saved locally; cloud unavailable'}render()}async function getAI(){if(!run)return;try{let r=await fetch(API+'/api/race-advice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({speed:cars[selected][2],nitro:key.n?20:75,position:opp.y<H*.78?1:2,lap,track:tracks[track][0]})});if(r.ok){ai=await r.json();document.getElementById('ai').textContent='AI DRIVER: '+(ai.action||'STEADY')}}catch(e){document.getElementById('ai').textContent='AI DRIVER: OFFLINE'}}async function board(){try{let r=await fetch(API+'/api/racing/leaderboard?limit=10'),j=await r.json();document.getElementById('list').innerHTML=(j.entries||[]).map((v,i)=>`<div class="btn">${i+1}. ${String(v.name||'PLAYER').replace(/[<>]/g,'')} — ⭐ ${Number(v.score)||0}<br><span class="small">${v.track||''} • ${v.car||''}</span></div>`).join('')}catch(e){document.getElementById('status').textContent='Leaderboard unavailable'}}document.getElementById('board').onclick=board;document.getElementById('race').onclick=()=>{save.name=(document.getElementById('name').value||'PLAYER').trim().slice(0,24)||'PLAYER';persist();document.getElementById('menu').classList.add('hidden');reset();run=true;getAI()};setInterval(getAI,3000);function bind(id,k){let e=document.getElementById(id);e.onpointerdown=()=>key[k]=1;e.onpointerup=e.onpointercancel=e.onpointerleave=()=>key[k]=0}bind('l','l');bind('r','r');bind('n','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')key.l=1;if(e.key==='ArrowRight')key.r=1;if(e.code==='Space')key.n=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')key.l=0;if(e.key==='ArrowRight')key.r=0;if(e.code==='Space')key.n=0});function loop(n){let dt=Math.min(.033,(n-(last||n))/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
