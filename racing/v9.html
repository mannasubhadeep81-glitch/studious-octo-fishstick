<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V9</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050812;color:#fff;font-family:system-ui}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px}.pill{background:#07101ddd;border:1px solid #ffffff22;border-radius:12px;padding:7px 10px;margin:2px;font-size:12px;font-weight:900}.ai{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:#071426dd;border:1px solid #55ddff55;padding:6px 10px;border-radius:99px;font-size:11px}.bar{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);width:min(360px,70vw);height:7px;border-radius:9px;background:#ffffff20;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff}.controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}.btn{width:68px;height:58px;border:1px solid #ffffff30;border-radius:18px;background:#07101ddd;color:#fff;font-size:24px;font-weight:900}.nitro{width:92px;font-size:12px}.panel{position:fixed;inset:0;display:grid;place-items:center;background:#020611e8;z-index:5}.card{width:min(470px,88vw);padding:28px;text-align:center;border:1px solid #ffffff22;border-radius:25px;background:#091325f5}.start{padding:14px 24px;border:0;border-radius:14px;font-weight:900}.hidden{display:none}.result{font-size:22px;font-weight:900;margin:16px}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><span class="pill">LUMIRA // RACING V9</span><span><span class="pill">🏁 <b id="lap">1/3</b></span><span class="pill">🏆 <b id="pos">2nd</b></span><span class="pill">⭐ <b id="score">0</b></span></span></div></div><div class="ai" id="ai">AI DRIVER: READY</div><div class="bar"><i id="prog"></i></div><div class="controls"><div><button class="btn" id="l">‹</button><button class="btn" id="r">›</button></div><button class="btn nitro" id="n">NITRO</button></div><div class="panel" id="menu"><div class="card"><h1>🏎️ LUMIRA</h1><h2 id="title">RACING V9</h2><p id="desc">Polished 2D racer • adaptive AI • effects • audio</p><div id="result" class="result hidden"></div><button class="start" id="start">START RACE</button></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,d=1;function resize(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();const API='https://studious-octo-fishstick-6.onrender.com';let run=false,t=0,last=0,px,lap=1,progress=0,score=0,key={l:0,r:0,n:0},ai={action:'STEADY'},opp={x:0,y:0,s:1},traffic=[],particles=[],audio=null,engine=null;function road(){return Math.min(W*.72,680)}function reset(){px=W/2;lap=1;progress=0;score=0;ai={action:'STEADY'};opp={x:W*.5,y:H*.42,s:.95};traffic=[];particles=[];for(let i=0;i<8;i++)traffic.push({x:W/2+(Math.random()-.5)*road()*.72,y:-100-i*190,s:.65+Math.random()*.65,h:Math.random()*360})}function snd(freq,dur,type='sine',gain=.035){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}function car(px,py,col,me=false){x.save();x.translate(px,py);x.shadowColor=me?'#42e8ff':'#000';x.shadowBlur=me?25:8;x.fillStyle='#101521';x.roundRect(-25,-44,50,88,12);x.fill();x.fillStyle=col;x.roundRect(-20,-39,40,78,10);x.fill();x.fillStyle='#061827';x.roundRect(-15,-23,30,24,6);x.fill();x.fillStyle=me?'#5ff6ff':'#ff304d';x.fillRect(-15,-37,30,4);x.fill();x.restore()}function burst(px,py,n=8){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.45})}function draw(){let h=H*.23;x.fillStyle='#061020';x.fillRect(0,0,W,H);let sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#081126');sky.addColorStop(1,'#1c5774');x.fillStyle=sky;x.fillRect(0,0,W,h);for(let z=0;z<4;z++){x.fillStyle=['#102735','#0d202a','#0a1a23','#07131d'][z];for(let i=-1;i<11;i++){let xx=i*110-(t*(20+z*13)%110),bh=50+(i*37+z*19)%90;x.fillRect(xx,h+z*32-bh,75,bh)}}x.fillStyle='#183b2c';x.fillRect(0,h,W,H-h);let r=road();x.fillStyle='#242a32';x.beginPath();x.moveTo(W/2-r*.52,h);x.lineTo(W/2+r*.52,h);x.lineTo(W/2+r*.42,H);x.lineTo(W/2-r*.42,H);x.closePath();x.fill();x.strokeStyle='#f4d86a';x.lineWidth=5;x.beginPath();x.moveTo(W/2-r*.52,h);x.lineTo(W/2-r*.42,H);x.moveTo(W/2+r*.52,h);x.lineTo(W/2+r*.42,H);x.stroke();x.strokeStyle='#fff';x.lineWidth=3;x.setLineDash([30,28]);x.lineDashOffset=-t*2;for(let q=1;q<3;q++){let xx=W/2-r*.42+r*.28*q;x.beginPath();x.moveTo(xx,h);x.lineTo(xx,H);x.stroke()}x.setLineDash([]);traffic.forEach(q=>car(q.x,q.y,`hsl(${q.h} 80% 58%)`));car(opp.x,opp.y,'#ff3d61');car(px,H*.78,'#4d82ff',true);particles.forEach(p=>{x.globalAlpha=Math.max(0,p.life*2);x.fillStyle='#fff';x.fillRect(p.x,p.y,3,3);x.globalAlpha=1});if(key.n){x.fillStyle='#ffb52e';x.beginPath();x.moveTo(px-13,H*.82);x.lineTo(px,H*.82+55+Math.random()*18);x.lineTo(px+13,H*.82);x.fill()}}function update(dt){if(!run)return;t+=dt;let r=road(),sp=410*dt*(key.n?1.65:1);px+=((key.r?1:0)-(key.l?1:0))*dt*360;px=Math.max(W/2-r*.39,Math.min(W/2+r*.39,px));traffic.forEach(q=>{q.y+=sp*q.s;if(q.y>H+100){q.y=-100-Math.random()*450;q.x=W/2+(Math.random()-.5)*r*.72;score+=100}if(Math.abs(q.x-px)<42&&Math.abs(q.y-H*.78)<75){score=Math.max(0,score-150);burst(px,H*.78,18);snd(90,.18,'sawtooth',.06);q.y=-300}});let s=ai.action==='NITRO'?1.45:ai.action==='ACCELERATE'?1.22:ai.action==='SAVE'?1.02:.94;opp.s=s;opp.x+=Math.sign(px-opp.x)*dt*(150+s*90);opp.x=Math.max(W/2-r*.36,Math.min(W/2+r*.36,opp.x));opp.y+=dt*260*s;if(opp.y>H+80)opp.y=-80;progress+=sp;if(progress>=2800){progress-=2800;lap++;snd(650,.18);if(lap>3)finish()}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);document.getElementById('lap').textContent=Math.min(lap,3)+'/3';document.getElementById('score').textContent=Math.floor(score);document.getElementById('prog').style.width=(progress/2800*100)+'%';let playerDist=H*.78,oppDist=opp.y;let p=oppDist<playerDist?2:1;document.getElementById('pos').textContent=p===1?'1st':'2nd'}function finish(){run=false;let position=opp.y<H*.78?2:1;score+=position===1?500:200;document.getElementById('menu').classList.remove('hidden');document.getElementById('title').textContent='RACE COMPLETE';document.getElementById('desc').textContent='Great run. Your result is saved locally.';document.getElementById('result').classList.remove('hidden');document.getElementById('result').textContent='🏁 '+(position===1?'1st PLACE':'2nd PLACE')+' • ⭐ '+score;document.getElementById('start').textContent='RACE AGAIN';snd(position===1?880:440,.5,'triangle',.08)}async function getAI(){if(!run)return;try{let r=await fetch(API+'/api/race-advice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({speed:key.n?170:105,nitro:key.n?20:75,position:opp.y<H*.78?1:2,lap})});if(r.ok){ai=await r.json();document.getElementById('ai').textContent='AI DRIVER: '+(ai.action||'STEADY')}}catch(e){document.getElementById('ai').textContent='AI DRIVER: OFFLINE'}}setInterval(getAI,3000);document.getElementById('start').onclick=()=>{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();document.getElementById('menu').classList.add('hidden');document.getElementById('result').classList.add('hidden');reset();run=true;getAI();snd(440,.12);setTimeout(()=>snd(660,.12),450);setTimeout(()=>snd(880,.2),900)};function bind(id,k){let e=document.getElementById(id);e.onpointerdown=()=>key[k]=1;e.onpointerup=e.onpointercancel=e.onpointerleave=()=>key[k]=0}bind('l','l');bind('r','r');bind('n','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')key.l=1;if(e.key==='ArrowRight')key.r=1;if(e.code==='Space')key.n=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')key.l=0;if(e.key==='ArrowRight')key.r=0;if(e.code==='Space')key.n=0});function loop(now){let dt=Math.min(.033,(now-(last||now))/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
