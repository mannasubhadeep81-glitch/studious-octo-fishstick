<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V8</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050812;color:#fff;font-family:system-ui}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px}.pill{background:#07101ddd;border:1px solid #ffffff25;border-radius:12px;padding:7px 10px;margin:2px;font-size:12px;font-weight:900}.ai{position:fixed;top:53px;left:50%;transform:translateX(-50%);font-size:11px;background:#071426dd;padding:6px 10px;border-radius:99px}.controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}.btn{background:#07101ddd;border:1px solid #ffffff30;border-radius:17px;color:#fff;font-weight:900}.drive{width:68px;height:58px;font-size:25px}.nitro{width:92px;height:58px;font-size:12px}.panel{position:fixed;inset:0;background:#020611e8;display:grid;place-items:center;z-index:5}.card{width:min(500px,89vw);padding:28px;border-radius:26px;background:#091325f5;text-align:center;box-shadow:0 25px 90px #000}.card h1{font-size:52px;margin:0;background:linear-gradient(90deg,#fff,#5de0ff,#ce67ff);color:transparent;background-clip:text}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:#ffffff0d;border-radius:14px;padding:12px;font-size:12px}.stat b{display:block;font-size:20px;margin-top:3px}.start{padding:14px 24px;background:#fff;color:#111;border:0;border-radius:14px;font-weight:900}.hidden{display:none}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#071426ee;padding:9px 13px;border-radius:12px;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><span class="pill">LUMIRA // RACING V8</span><span><span class="pill">🏁 <b id="lap">1/3</b></span><span class="pill">⏱️ <b id="time">0.0</b></span><span class="pill">🪙 <b id="coins">0</b></span></span></div></div><div class="ai" id="ai">AI DRIVER: READY</div><div class="controls"><div><button class="btn drive" id="l">‹</button><button class="btn drive" id="r">›</button></div><button class="btn nitro" id="n">NITRO</button></div><div id="toast" class="toast"></div><div id="panel" class="panel"><div class="card"><h1>LUMIRA</h1><h2 id="heading">RACING V8</h2><p id="desc">Polished 2D arcade racing</p><div class="stats"><div class="stat">POSITION<b id="pos">—</b></div><div class="stat">TIME<b id="finalTime">—</b></div><div class="stat">REWARD<b id="reward">—</b></div></div><button class="start" id="start">START RACE</button></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,d=1;function resize(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();const API='https://studious-octo-fishstick-6.onrender.com';let run=false,t=0,startAt=0,px,lap=1,lapProgress=0,coins=Number(localStorage.lumiraCoins||0),score=0,key={l:0,r:0,n:0},ai={action:'STEADY'},opp={x:0,y:0,s:1},traffic=[];function road(){return Math.min(W*.72,680)}function reset(){px=W/2;lap=1;lapProgress=0;score=0;startAt=performance.now();opp={x:W*.5,y:H*.43,s:.96};traffic=[];for(let i=0;i<6;i++)traffic.push({x:W/2+(Math.random()-.5)*road()*.7,y:-100-i*210,s:.7+Math.random()*.55,c:`hsl(${Math.random()*360} 80% 58%)`})}function car(px,py,col,me=false){x.save();x.translate(px,py);x.shadowColor=me?'#42e8ff':'#000';x.shadowBlur=me?24:8;x.fillStyle='#10151f';x.roundRect(-25,-44,50,88,12);x.fill();let g=x.createLinearGradient(-20,0,20,0);g.addColorStop(0,col);g.addColorStop(.5,'#fff');g.addColorStop(1,col);x.fillStyle=g;x.roundRect(-20,-39,40,78,10);x.fill();x.fillStyle='#061827';x.roundRect(-15,-23,30,24,6);x.fill();x.fillStyle=me?'#62f5ff':'#ff304d';x.fillRect(-15,-37,30,4);x.fillRect(-15,33,30,4);if(me&&key.n){x.fillStyle='#ffd45a';x.beginPath();x.moveTo(-9,42);x.lineTo(0,65+Math.random()*12);x.lineTo(9,42);x.fill()}x.restore()}function draw(){let h=H*.23;x.fillStyle='#061020';x.fillRect(0,0,W,H);let sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#081126');sky.addColorStop(1,'#1c5774');x.fillStyle=sky;x.fillRect(0,0,W,h);for(let z=0;z<4;z++){x.fillStyle=['#122b38','#10242d','#0c1c26','#07131d'][z];for(let i=-1;i<12;i++){let xx=i*100-(t*(18+z*12)%100),bh=45+(i*29+z*17)%100;x.fillRect(xx,h+z*30-bh,70,bh)}}x.fillStyle='#173c2c';x.fillRect(0,h,W,H-h);let r=road();x.fillStyle='#252a31';x.beginPath();x.moveTo(W/2-r*.52,h);x.lineTo(W/2+r*.52,h);x.lineTo(W/2+r*.42,H);x.lineTo(W/2-r*.42,H);x.closePath();x.fill();x.strokeStyle='#f4d86a';x.lineWidth=5;x.beginPath();x.moveTo(W/2-r*.52,h);x.lineTo(W/2-r*.42,H);x.moveTo(W/2+r*.52,h);x.lineTo(W/2+r*.42,H);x.stroke();x.strokeStyle='#fff';x.lineWidth=3;x.setLineDash([30,28]);x.lineDashOffset=-t*2;for(let q=1;q<3;q++){let xx=W/2-r*.42+r*.28*q;x.beginPath();x.moveTo(xx,h);x.lineTo(xx,H);x.stroke()}x.setLineDash([]);traffic.forEach(q=>car(q.x,q.y,q.c));car(opp.x,opp.y,'#ff3d61');car(px,H*.78,'#4d82ff',true)}function position(){return px<opp.x?1:2}function update(dt){if(!run)return;t+=dt;let mult=key.n?1.62:1;let sp=dt*410*mult;px+=((key.r?1:0)-(key.l?1:0))*dt*360;let r=road();px=Math.max(W/2-r*.39,Math.min(W/2+r*.39,px));traffic.forEach(q=>{q.y+=sp*q.s;if(q.y>H+100){q.y=-100-Math.random()*500;q.x=W/2+(Math.random()-.5)*r*.7;score+=100}if(Math.abs(q.x-px)<42&&Math.abs(q.y-H*.78)<75){score=Math.max(0,score-150);q.y=-280;toast('⚡ Collision -150')}});let s=ai.action==='NITRO'?1.5:ai.action==='ACCELERATE'?1.25:ai.action==='SAVE'?1.0:.93;opp.s=s;let desired=px+(Math.sin(t*.9)*r*.15);if(Math.abs(desired-opp.x)>18)opp.x+=Math.sign(desired-opp.x)*dt*(145+s*95);opp.x=Math.max(W/2-r*.36,Math.min(W/2+r*.36,opp.x));opp.y+=dt*255*s;if(opp.y>H+80)opp.y=-80;lapProgress+=sp;if(lapProgress>=2600){lapProgress-=2600;lap++;if(lap>3)finish()}document.getElementById('lap').textContent=Math.min(lap,3)+'/3';document.getElementById('time').textContent=((performance.now()-startAt)/1000).toFixed(1);document.getElementById('coins').textContent=coins}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),700)}function finish(){run=false;let seconds=(performance.now()-startAt)/1000,pos=position(),reward=pos===1?300:pos===2?180:100;coins+=reward;localStorage.lumiraCoins=coins;document.getElementById('panel').classList.remove('hidden');document.getElementById('heading').textContent='RACE COMPLETE';document.getElementById('desc').textContent='Checkpoint finish reached';document.getElementById('pos').textContent=pos===1?'1ST 🏆':pos===2?'2ND':'3RD';document.getElementById('finalTime').textContent=seconds.toFixed(1)+'s';document.getElementById('reward').textContent='+'+reward+' 🪙';document.getElementById('start').textContent='RACE AGAIN'}async function getAI(){if(!run)return;try{let r=await fetch(API+'/api/race-advice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({speed:key.n?170:105,nitro:key.n?20:75,position:position(),lap})});if(r.ok){ai=await r.json();document.getElementById('ai').textContent='AI DRIVER: '+(ai.action||'STEADY')}}catch(e){document.getElementById('ai').textContent='AI DRIVER: OFFLINE'}}setInterval(getAI,2800);document.getElementById('start').onclick=()=>{document.getElementById('panel').classList.add('hidden');document.getElementById('heading').textContent='RACING V8';document.getElementById('desc').textContent='Polished 2D arcade racing';reset();run=true;getAI()};function bind(id,k){let e=document.getElementById(id);e.onpointerdown=()=>key[k]=1;e.onpointerup=e.onpointercancel=e.onpointerleave=()=>key[k]=0}bind('l','l');bind('r','r');bind('n','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')key.l=1;if(e.key==='ArrowRight')key.r=1;if(e.code==='Space')key.n=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')key.l=0;if(e.key==='ArrowRight')key.r=0;if(e.code==='Space')key.n=0});function loop(n){let dt=Math.min(.033,(n-(loop.last||n))/1000);loop.last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
