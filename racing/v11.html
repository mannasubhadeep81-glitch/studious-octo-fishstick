<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V11</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050812;color:#fff;font-family:system-ui}canvas{display:block;width:100%;height:100%}.panel{position:fixed;inset:0;background:#020611e8;display:grid;place-items:center;z-index:5}.card{width:min(520px,90vw);padding:26px;border-radius:24px;background:#091325f5;text-align:center;border:1px solid #ffffff22}.btn,.pill{background:#07101ddd;border:1px solid #ffffff25;border-radius:12px;color:#fff;padding:9px 12px;font-weight:800}.btn{margin:5px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:left}.row{padding:9px;border-radius:10px;background:#ffffff09}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px}.ai{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:#071426dd;padding:6px 10px;border-radius:99px;font-size:11px}.controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}.drive{width:68px;height:58px;font-size:24px}.nitro{width:92px;font-size:12px}.hidden{display:none}.small{opacity:.65;font-size:12px}.name{width:90%;padding:10px;border-radius:10px;border:1px solid #ffffff22;background:#07101d;color:#fff;margin:8px}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><span class="pill">LUMIRA RACING V11</span><span><span class="pill">🏁 <b id="lap">1/3</b></span><span class="pill">🏆 <b id="pos">1st</b></span><span class="pill">⭐ <b id="score">0</b></span></span></div></div><div class="ai" id="ai">AI DRIVER: READY</div><div class="controls"><div><button class="btn drive" id="l">‹</button><button class="btn drive" id="r">›</button></div><button class="btn nitro" id="n">NITRO</button></div><div class="panel" id="menu"><div class="card"><h1>🏎️ LUMIRA</h1><h2>RACING V11</h2><input id="name" class="name" maxlength="24" placeholder="Player name"><p>Online-ready arcade racing</p><button class="btn" id="race">START RACE</button><button class="btn" id="board">LEADERBOARD</button><button class="btn" id="sync">SYNC SAVE</button><div id="status" class="small"></div><div id="list" class="grid"></div></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,d=1;function rs(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();const API='https://studious-octo-fishstick-6.onrender.com';const playerId=localStorage.lumiraPlayerId||('p_'+crypto.randomUUID().replaceAll('-',''));localStorage.lumiraPlayerId=playerId;let run=false,t=0,last=0,px,lap=1,prog=0,score=0,key={l:0,r:0,n:0},ai={action:'STEADY'},opp={x:0,y:0,s:1};const storeKey='lumiraV11';let save=JSON.parse(localStorage.getItem(storeKey)||'{"coins":0,"best":0,"races":0,"name":"PLAYER"}');function persist(){localStorage.setItem(storeKey,JSON.stringify(save));document.getElementById('name').value=save.name||'PLAYER'}document.getElementById('name').value=save.name||'PLAYER';function road(){return Math.min(W*.72,680)}function reset(){px=W/2;lap=1;prog=0;score=0;opp={x:W*.5,y:H*.42,s:.95};ai={action:'STEADY'}}function car(px,py,col,me=false){x.save();x.translate(px,py);x.shadowColor=me?'#42e8ff':'#000';x.shadowBlur=me?24:8;x.fillStyle='#101521';x.roundRect(-25,-44,50,88,12);x.fill();x.fillStyle=col;x.roundRect(-20,-39,40,78,10);x.fill();x.fillStyle='#061827';x.roundRect(-15,-23,30,24,6);x.fill();x.fillStyle=me?'#5ff6ff':'#ff304d';x.fillRect(-15,-37,30,4);x.restore()}function draw(){let h=H*.23;x.fillStyle='#061020';x.fillRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#081126');g.addColorStop(1,'#1c5774');x.fillStyle=g;x.fillRect(0,0,W,h);x.fillStyle='#183b2c';x.fillRect(0,h,W,H-h);let r=road();x.fillStyle='#252a31';x.beginPath();x.moveTo(W/2-r*.52,h);x.lineTo(W/2+r*.52,h);x.lineTo(W/2+r*.42,H);x.lineTo(W/2-r*.42,H);x.closePath();x.fill();x.strokeStyle='#f4d86a';x.lineWidth=5;x.beginPath();x.moveTo(W/2-r*.52,h);x.lineTo(W/2-r*.42,H);x.moveTo(W/2+r*.52,h);x.lineTo(W/2+r*.42,H);x.stroke();x.strokeStyle='#fff';x.lineWidth=3;x.setLineDash([30,28]);x.lineDashOffset=-t*2;for(let q=1;q<3;q++){let xx=W/2-r*.42+r*.28*q;x.beginPath();x.moveTo(xx,h);x.lineTo(xx,H);x.stroke()}x.setLineDash([]);car(opp.x,opp.y,'#ff3d61');car(px,H*.78,'#4d82ff',true);if(key.n){x.fillStyle='#ffb52e';x.beginPath();x.moveTo(px-13,H*.82);x.lineTo(px,H*.82+55+Math.random()*18);x.lineTo(px+13,H*.82);x.fill()}}function update(dt){if(!run)return;t+=dt;let r=road(),sp=410*dt*(key.n?1.65:1);px+=((key.r?1:0)-(key.l?1:0))*dt*360;px=Math.max(W/2-r*.39,Math.min(W/2+r*.39,px));let s=ai.action==='NITRO'?1.45:ai.action==='ACCELERATE'?1.22:ai.action==='SAVE'?1.02:.94;opp.s=s;opp.x+=Math.sign(px-opp.x)*dt*(150+s*90);opp.x=Math.max(W/2-r*.36,Math.min(W/2+r*.36,opp.x));opp.y+=dt*260*s;if(opp.y>H+80)opp.y=-80;prog+=sp;if(prog>=2800){prog-=2800;lap++;if(lap>3)finish()}document.getElementById('lap').textContent=Math.min(lap,3)+'/3';document.getElementById('score').textContent=Math.floor(score);document.getElementById('pos').textContent=opp.y<H*.78?'2nd':'1st'}async function finish(){run=false;const position=opp.y<H*.78?2:1;score+=position===1?500:200;save.name=(document.getElementById('name').value||'PLAYER').trim().slice(0,24)||'PLAYER';save.best=Math.max(save.best,score);save.coins+=(position===1?150:75);save.races++;persist();document.getElementById('menu').classList.remove('hidden');document.getElementById('status').textContent='Saving result…';await submitScore();await syncProfile();document.getElementById('status').textContent='Cloud + local save complete • Coins: '+save.coins+' • Best: '+save.best;document.getElementById('race').textContent='RACE AGAIN'}async function getAI(){if(!run)return;try{let r=await fetch(API+'/api/race-advice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({speed:key.n?170:105,nitro:key.n?20:75,position:opp.y<H*.78?1:2,lap})});if(r.ok){ai=await r.json();document.getElementById('ai').textContent='AI DRIVER: '+(ai.action||'STEADY')}}catch(e){document.getElementById('ai').textContent='AI DRIVER: OFFLINE'}}async function submitScore(){try{await fetch(API+'/api/racing/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:save.name,score,track:'Neon City',car:'Azure'})})}catch(e){}}async function syncProfile(){try{await fetch(API+'/api/racing/profile/'+encodeURIComponent(playerId),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({coins:save.coins,bestScore:save.best,races:save.races})})}catch(e){}}async function loadProfile(){try{const r=await fetch(API+'/api/racing/profile/'+encodeURIComponent(playerId));if(r.ok){const j=await r.json();const p=j.profile||{};save.coins=Math.max(save.coins||0,p.coins||0);save.best=Math.max(save.best||0,p.bestScore||0);save.races=Math.max(save.races||0,p.races||0);persist();document.getElementById('status').textContent='Cloud profile loaded'}}catch(e){}}async function leaderboard(){let list=[];try{let r=await fetch(API+'/api/racing/leaderboard?limit=10');if(r.ok){let j=await r.json();if(Array.isArray(j.entries))list=j.entries}}catch(e){}if(!list.length)list=[{name:save.name,score:save.best}];document.getElementById('list').innerHTML=list.sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,10).map((v,i)=>`<div class="row">${i+1}. <b>${String(v.name||'PLAYER').replace(/[<>]/g,'')}</b><br>⭐ ${Number(v.score)||0}</div>`).join('')}setInterval(getAI,3000);document.getElementById('board').onclick=()=>{leaderboard();document.getElementById('status').textContent='Leaderboard loaded'};document.getElementById('sync').onclick=async()=>{save.name=(document.getElementById('name').value||save.name||'PLAYER').trim().slice(0,24)||'PLAYER';persist();await syncProfile();document.getElementById('status').textContent='Cloud profile synced'};document.getElementById('race').onclick=()=>{save.name=(document.getElementById('name').value||'PLAYER').trim().slice(0,24)||'PLAYER';persist();document.getElementById('menu').classList.add('hidden');reset();run=true;getAI()};function bind(id,k){let e=document.getElementById(id);e.onpointerdown=()=>key[k]=1;e.onpointerup=e.onpointercancel=e.onpointerleave=()=>key[k]=0}bind('l','l');bind('r','r');bind('n','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')key.l=1;if(e.key==='ArrowRight')key.r=1;if(e.code==='Space')key.n=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')key.l=0;if(e.key==='ArrowRight')key.r=0;if(e.code==='Space')key.n=0});loadProfile();function loop(n){let dt=Math.min(.033,(n-(last||n))/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
