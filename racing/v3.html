<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V3</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050812;color:white;font-family:system-ui}canvas{width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:14px;gap:8px}.box{background:#07101ddd;border:1px solid #ffffff25;border-radius:12px;padding:7px 10px;text-align:center;backdrop-filter:blur(8px)}small{display:block;font-size:8px;opacity:.55}.buttons{position:fixed;bottom:28px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}.btn{width:62px;height:62px;border:1px solid #ffffff30;border-radius:18px;background:#07101ddd;color:white;font-size:28px;font-weight:900}.nit{width:86px;font-size:11px}.menu{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#16466ccc,#02050cee)}.card{width:min(500px,92vw);text-align:center;padding:28px;border-radius:26px;background:#071120ee;border:1px solid #ffffff22}.start{padding:14px 24px;border:0;border-radius:14px;font-weight:900}.hidden{display:none}.count{position:fixed;inset:0;display:grid;place-items:center;font-size:130px;font-weight:1000;pointer-events:none}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><b>LUMIRA // RACING V3</b><div style="display:flex;gap:6px"><div class="box"><small>SPEED</small><b id="spd">0</b></div><div class="box"><small>SCORE</small><b id="scr">0</b></div></div></div></div><div class="buttons"><div><button class="btn" id="l">‹</button><button class="btn" id="r">›</button></div><button class="btn nit" id="n">NITRO</button></div><div id="ct" class="count hidden"></div><div id="m" class="menu"><div class="card"><h1>LUMIRA RACING</h1><p>Premium 2D arcade racer — V3 sprite edition</p><button class="start" id="go">START RACE</button></div></div><script>const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,d=1;function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}size();onresize=size;const img=new Image(),imgs=[new Image(),new Image(),new Image()];imgs[0].src='assets/car-blue.svg';imgs[1].src='assets/car-red.svg';imgs[2].src='assets/car-purple.svg';let active=0,run=0,left=0,right=0,nit=0,t=0,last=0,score=0,px=0,traffic=[];function reset(){score=0;px=W/2;traffic=[];for(let i=0;i<9;i++)traffic.push({x:W/2+(Math.random()-.5)*W*.5,y:-i*190-100,s:.8+Math.random()*.5,k:i%3})}function road(){let rw=Math.min(W*.75,720),rx=W/2,h=H*.25;x.fillStyle='#07111d';x.fillRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#06101f');g.addColorStop(1,'#195074');x.fillStyle=g;x.fillRect(0,0,W,h);for(let q=0;q<3;q++){x.fillStyle=['#0b2935','#0a202b','#081821'][q];for(let i=-1;i<W/70+2;i++){let bx=i*85-(t*(.15+q*.1)%85),bh=50+((i*47+q*31)%90+90)%90;x.fillRect(bx,h+q*34-bh,55,bh)}}x.fillStyle='#17352b';x.fillRect(0,h,W,H-h);x.fillStyle='#292e37';x.beginPath();x.moveTo(rx-rw*.5,h);x.lineTo(rx+rw*.5,h);x.lineTo(rx+rw*.42,H);x.lineTo(rx-rw*.42,H);x.closePath();x.fill();x.strokeStyle='#f4e8a0';x.lineWidth=4;x.setLineDash([32,28]);x.lineDashOffset=t%60;for(let i=1;i<3;i++){let lx=rx-rw*.42+rw*.28*i;x.beginPath();x.moveTo(lx,h);x.lineTo(lx,H);x.stroke()}x.setLineDash([]);x.strokeStyle='#ffcb5d';x.beginPath();x.moveTo(rx-rw*.5,h);x.lineTo(rx-rw*.42,H);x.moveTo(rx+rw*.5,h);x.lineTo(rx+rw*.42,H);x.stroke()}function drawCar(o,player=false){let im=imgs[o.k||active];let w=player?62:49,h=player?108:84;x.save();x.translate(o.x,o.y);x.rotate(o.t||0);x.shadowBlur=player?24:10;x.shadowColor=player?'#48dfff':'#000';x.drawImage(im,-w/2,-h/2,w,h);x.restore()}function update(dt){t+=dt*520;let v=dt*410*(nit&&score>=0?1.7:1);if(nit)score+=dt*4;px+=((right-left)*390*dt);px=Math.max(W*.3,Math.min(W*.7,px));for(let q of traffic){q.y+=v*q.s;if(q.y>H+100){q.y=-120-Math.random()*300;q.x=W/2+(Math.random()-.5)*W*.5;score+=100}}}function draw(){road();traffic.forEach(drawCar);drawCar({x:px,y:H*.75,k:active,t:((right-left)*.08)} ,true);document.querySelector('#spd').textContent=Math.round(nit?180:110);document.querySelector('#scr').textContent=Math.floor(score)}function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;if(run)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);function bind(id,set){let e=document.querySelector(id);e.onpointerdown=()=>window[set]=1;e.onpointerup=e.onpointercancel=e.onpointerleave=()=>window[set]=0}bind('#l','left');bind('#r','right');bind('#n','nit');document.querySelector('#go').onclick=()=>{document.querySelector('#m').classList.add('hidden');reset();let n=3,ct=document.querySelector('#ct');ct.classList.remove('hidden');ct.textContent=n;let z=setInterval(()=>{n--;ct.textContent=n>0?n:'GO!';if(n<0){clearInterval(z);ct.classList.add('hidden');run=1}},650)};for(let i=0;i<9;i++){}reset();</script></body></html>
