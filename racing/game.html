<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V19</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111f;font-family:system-ui;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;gap:6px;font-weight:900;pointer-events:none}.pill{background:#07111ee8;border:1px solid #ffffff33;border-radius:13px;padding:8px 10px}.controls{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}.controls div{display:flex;gap:10px}.control{pointer-events:auto;width:68px;height:60px;border:1px solid #ffffff55;border-radius:18px;background:#07111ee8;color:#fff;font-size:25px;font-weight:900;touch-action:none}.nitro{width:102px;background:#c34b19}.menu{position:fixed;inset:0;display:grid;place-items:center;background:#020611d9;z-index:5}.card{width:min(430px,88vw);padding:25px;border-radius:26px;text-align:center;background:#102746;border:1px solid #48dfff55}.card button{width:100%;height:58px;margin-top:10px;border:0;border-radius:16px;background:#18a8ff;color:#fff;font-size:18px;font-weight:900}.hide{display:none!important}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="pill">🏎️ LUMIRA V19</span><span class="pill">⚡ <span id="speed">0</span> km/h</span><span class="pill">🏁 <span id="lap">1/3</span></span></div><div class="controls"><div><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div><button class="control nitro" id="nitro">NITRO</button></div><div id="menu" class="menu"><div class="card"><h1 id="title">🏁 LUMIRA RACING</h1><p>V19 • corrected camera view</p><button id="start">▶ START RACE</button><p>Player car stays in the lower-center foreground; traffic stays ahead on the track.</p></div></div><script>(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();let run=false,last=0,dist=0,lap=1,nitro=100;const car={x:0,vx:0,speed:0,accel:310,drag:90,grip:7};const inp={l:false,r:false,n:false};const lanes=[-.29,0,.29];const traffic=[{lane:0,z:700,v:175,c:'#ed3154'},{lane:2,z:1450,v:195,c:'#ffd24b'},{lane:1,z:2200,v:185,c:'#8f68ff'}];const scenery=Array.from({length:42},(_,i)=>({side:i%2?-1:1,z:i*170+100,type:i%5}));const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function rw(){return Math.min(W*.76,720)}function reset(){traffic[0].lane=0;traffic[0].z=700;traffic[1].lane=2;traffic[1].z=1450;traffic[2].lane=1;traffic[2].z=2200}function start(){run=true;dist=0;lap=1;car.x=0;car.vx=0;car.speed=0;nitro=100;reset();$('menu').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}function over(){run=false;$('menu').classList.remove('hide');$('title').textContent='💥 CRASH!';$('start').textContent='↻ RESTART RACE'}$('start').onclick=start;function bind(id,k){const e=$(id);e.onpointerdown=v=>{v.preventDefault();inp[k]=true};['pointerup','pointercancel','pointerleave'].forEach(v=>e.addEventListener(v,()=>inp[k]=false))}bind('left','l');bind('right','r');bind('nitro','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')inp.l=true;if(e.key==='ArrowRight')inp.r=true;if(e.code==='Space')inp.n=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')inp.l=false;if(e.key==='ArrowRight')inp.r=false;if(e.code==='Space')inp.n=false});function carSprite(x,y,col,s=1,rot=0){g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);g.fillStyle='#070a0f';g.shadowColor='#0009';g.shadowBlur=12;g.shadowOffsetY=8;g.beginPath();g.roundRect(-25,-43,50,86,12);g.fill();g.shadowColor='transparent';g.fillStyle=col;g.beginPath();g.roundRect(-20,-39,40,78,10);g.fill();g.fillStyle='#10243a';g.beginPath();g.moveTo(-14,-27);g.lineTo(14,-27);g.lineTo(11,-5);g.lineTo(-11,-5);g.closePath();g.fill();g.fillStyle='#dffaff';g.globalAlpha=.65;g.fill();g.globalAlpha=1;g.fillStyle='#fff';g.fillRect(-15,9,30,5);g.fillStyle='#11151b';g.fillRect(-27,-26,7,19);g.fillRect(20,-26,7,19);g.fillRect(-27,8,7,19);g.fillRect(20,8,7,19);g.fillStyle='#ff4055';g.fillRect(-14,27,9,5);g.fillRect(5,27,9,5);g.restore()}function tree(x,y,s){g.fillStyle='#51351e';g.fillRect(x-3,y+6,6,28*s);g.fillStyle='#176b3b';g.beginPath();g.arc(x,y,23*s,0,Math.PI*2);g.fill()}function draw(){g.clearRect(0,0,W,H);const horizon=H*.20,r=rw(),top=r*.43,bottom=r*.56;let sky=g.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#247db4');sky.addColorStop(1,'#d8f1fa');g.fillStyle=sky;g.fillRect(0,0,W,horizon);g.fillStyle='#214d66';g.beginPath();g.moveTo(0,horizon+45);g.lineTo(W*.22,horizon-10);g.lineTo(W*.42,horizon+35);g.lineTo(W*.64,horizon-5);g.lineTo(W,horizon+40);g.lineTo(W,H);g.lineTo(0,H);g.fill();g.fillStyle='#17633a';g.fillRect(0,horizon,W,H-horizon);g.fillStyle='#292f38';g.beginPath();g.moveTo(W/2-top,horizon);g.lineTo(W/2+top,horizon);g.lineTo(W/2+bottom,H);g.lineTo(W/2-bottom,H);g.closePath();g.fill();g.strokeStyle='#e7e7e7';g.lineWidth=2;g.stroke();for(const side of [-1,1]){g.strokeStyle='#d8343e';g.lineWidth=12;g.beginPath();g.moveTo(W/2+side*top,horizon);g.lineTo(W/2+side*bottom,H);g.stroke()}g.strokeStyle='#f5e66b';g.lineWidth=4;g.setLineDash([34,28]);g.lineDashOffset=-(dist%62);for(let i=1;i<3;i++){const xx=W/2-r*.42+r*.28*i;g.beginPath();g.moveTo(xx,horizon);g.lineTo(xx,H);g.stroke()}g.setLineDash([]);for(const o of scenery){let rel=o.z-dist;while(rel<0)rel+=3200;while(rel>3200)rel-=3200;if(rel<1750){const y=H*.70-rel*.050,s=clamp(1.25-rel/1500,.28,1);tree(W/2+o.side*(r*.59+s*20),y,s)}}for(const q of traffic){let rel=q.z-dist;while(rel<0)rel+=3000;while(rel>3000)rel-=3000;if(rel<1500){const y=H*.62-rel*.030,s=clamp(.42-rel/3600,.24,.62);carSprite(W/2+lanes[q.lane]*r*.72,y,q.c,s)}}const px=W/2+car.x;carSprite(px,H*.80,'#18d9ff',1,car.vx*.001);if(inp.n&&nitro>0){g.fillStyle='#ffb52e';g.beginPath();g.moveTo(px-13,H*.84);g.lineTo(px,H*.84+60+Math.random()*15);g.lineTo(px+13,H*.84);g.fill()}}function update(dt){const steer=(inp.r?1:0)-(inp.l?1:0),boost=inp.n&&nitro>0;if(boost)nitro=Math.max(0,nitro-38*dt);else nitro=Math.min(100,nitro+9*dt);const target=boost?560:430;if(car.speed<target)car.speed+=car.accel*dt;else car.speed-=car.drag*dt;car.speed=clamp(car.speed,0,target);car.vx+=steer*720*dt*(.35+car.speed/430);car.vx*=Math.max(0,1-car.grip*dt);car.x+=car.vx*dt;const limit=rw()*.39;if(Math.abs(car.x)>limit){car.x=clamp(car.x,-limit,limit);car.vx*=-.55;car.speed*=.72}dist+=car.speed*dt;for(const q of traffic){q.z-=q.v*dt;if(q.z<dist-250){q.z=dist+1150+Math.random()*1000;q.lane=Math.floor(Math.random()*3);q.v=165+Math.random()*55}const rel=q.z-dist,targetX=lanes[q.lane]*rw()*.72;if(Math.abs(rel)<80&&Math.abs(car.x-targetX)<58){over();return}}if(dist>=2800){dist-=2800;lap++;if(lap>3){run=false;$('menu').classList.remove('hide');$('title').textContent='🏆 FINISH!';$('start').textContent='↻ PLAY AGAIN'}}$('lap').textContent=lap+'/3';$('speed').textContent=Math.round(car.speed*.31)}function loop(now){if(!run)return;const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}draw()})();</script></body></html>
