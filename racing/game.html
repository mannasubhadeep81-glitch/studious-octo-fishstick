<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V16</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111f;font-family:system-ui;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;gap:7px;font-weight:900;pointer-events:none}.pill{background:#07111eee;border:1px solid #ffffff44;border-radius:12px;padding:7px 10px}.controls{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}.controls div{display:flex;gap:9px}.control{pointer-events:auto;width:68px;height:60px;border:1px solid #ffffff55;border-radius:17px;background:#07111ee8;color:#fff;font-size:25px;font-weight:900;touch-action:none}.nitro{width:100px;background:#a93c18}.menu{position:fixed;inset:0;display:grid;place-items:center;background:#02060dcc}.card{width:min(430px,88vw);padding:24px;border-radius:24px;text-align:center;background:#0b1a31;border:1px solid #43d9ff66;box-shadow:0 20px 70px #000}.card button{width:100%;height:56px;margin-top:10px;border:0;border-radius:15px;background:#1597ff;color:white;font-size:18px;font-weight:900}.hide{display:none!important}.small{opacity:.78;font-size:12px}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="pill">🏎️ LUMIRA V16</span><span class="pill">⚡ <span id="speed">0</span> km/h</span><span class="pill">🏁 <span id="lap">1/3</span></span></div><div class="controls"><div><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div><button class="control nitro" id="nitro">NITRO</button></div><div id="menu" class="menu"><div class="card"><h1>🏁 LUMIRA RACING</h1><p>V16 • enhanced 2D graphics + physics</p><button id="start">▶ START RACE</button><p id="msg" class="small">Dynamic road • scenery • shadows • traffic • nitro</p></div></div><script>(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d');let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const $=id=>document.getElementById(id);let running=false,last=0,t=0,dist=0,lap=1,nitroEnergy=100,shake=0;const car={x:0,vx:0,speed:0,max:420,accel:310,drag:90,grip:7};const input={l:false,r:false,n:false};const traffic=[{lane:-.25,z:650,v:180,c:'#ff3b5c'},{lane:.24,z:1150,v:205,c:'#ffd34d'},{lane:0,z:1750,v:220,c:'#9b72ff'}];const trees=[];for(let i=0;i<36;i++)trees.push({side:i%2?-1:1,z:i*210+100,h:18+(i%4)*6});function roadWidth(){return Math.min(W*.76,700)}function start(){running=true;dist=0;lap=1;car.x=0;car.vx=0;car.speed=0;nitroEnergy=100;traffic[0].z=650;traffic[1].z=1150;traffic[2].z=1750;$('menu').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}$('start').addEventListener('click',start);function bind(id,k){const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();input[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>e.addEventListener(ev,()=>input[k]=false))}bind('left','l');bind('right','r');bind('nitro','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')input.l=true;if(e.key==='ArrowRight')input.r=true;if(e.code==='Space')input.n=true;if(e.code==='Enter'&&!running)start()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')input.l=false;if(e.key==='ArrowRight')input.r=false;if(e.code==='Space')input.n=false});function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function tree(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#513c25';ctx.fillRect(-4,8,8,24);ctx.fillStyle='#103f29';ctx.beginPath();ctx.arc(0,0,25,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17633b';ctx.beginPath();ctx.arc(-14,-7,18,0,Math.PI*2);ctx.arc(14,-5,19,0,Math.PI*2);ctx.arc(0,-18,20,0,Math.PI*2);ctx.fill();ctx.restore()}function carDraw(x,y,col,scale=1,tilt=0){ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.scale(scale,scale);ctx.shadowColor='#000';ctx.shadowBlur=10;ctx.shadowOffsetY=7;ctx.fillStyle='#080b10';ctx.beginPath();ctx.roundRect(-24,-39,48,78,10);ctx.fill();ctx.shadowColor='transparent';ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(-19,-35,38,70,8);ctx.fill();ctx.fillStyle='#071c2b';ctx.beginPath();ctx.roundRect(-13,-21,26,22,5);ctx.fill();ctx.fillStyle='#dffaff';ctx.fillRect(-15,10,30,10);ctx.fillStyle='#101317';ctx.fillRect(-25,-25,6,18);ctx.fillRect(19,-25,6,18);ctx.fillRect(-25,9,6,18);ctx.fillRect(19,9,6,18);ctx.fillStyle='#fff';ctx.fillRect(-11,-33,22,4);ctx.fillStyle='#ff493d';ctx.fillRect(-13,28,10,4);ctx.fillRect(3,28,10,4);ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);const horizon=H*.18,r=roadWidth();let sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#62c8f2');sky.addColorStop(1,'#bdeaff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);ctx.fillStyle='#dff6ff';for(let i=0;i<5;i++){ctx.globalAlpha=.35;ctx.beginPath();ctx.ellipse((i*173+t*8)%W,55+(i%2)*30,55,13,0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#1d6d3d';ctx.fillRect(0,horizon,W,H-horizon);const roadTop=r*.54,roadBottom=r*.44;ctx.fillStyle='#252a31';ctx.beginPath();ctx.moveTo(W/2-roadTop,horizon);ctx.lineTo(W/2+roadTop,horizon);ctx.lineTo(W/2+roadBottom,H);ctx.lineTo(W/2-roadBottom,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#d84b43';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(W/2-roadTop,horizon);ctx.lineTo(W/2-roadBottom,H);ctx.moveTo(W/2+roadTop,horizon);ctx.lineTo(W/2+roadBottom,H);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.setLineDash([30,28]);ctx.lineDashOffset=-(dist%58);for(let i=1;i<3;i++){const xx=W/2-r*.42+r*.28*i;ctx.beginPath();ctx.moveTo(xx,horizon);ctx.lineTo(xx,H);ctx.stroke()}ctx.setLineDash([]);for(const q of trees){let rel=q.z-dist;while(rel<-1400)rel+=3000;while(rel>1400)rel-=3000;const y=H*.72-rel*.055;if(y>horizon-20&&y<H+50){const s=clamp(.35+rel/1800,.35,1.25);const tx=W/2+q.side*(r*.56+s*15);tree(tx,y,s)}}ctx.fillStyle='#f6e58a';ctx.font='900 18px system-ui';ctx.fillText('LUMIRA GP',14,horizon-16);for(const q of traffic){let rel=q.z-dist;while(rel<-1400)rel+=3000;while(rel>1400)rel-=3000;const y=H*.76-rel*.047;if(y>horizon-50&&y<H+90){const s=clamp(.55+rel/2600,.55,1.05);carDraw(W/2+q.lane*r*.75,y,q.c,s)}}const px=W/2+car.x;carDraw(px,H*.76,'#25d8ff',1,car.vx*.0012);if(input.n&&nitroEnergy>0){ctx.fillStyle='#ff9c27';ctx.beginPath();ctx.moveTo(px-13,H*.81);ctx.lineTo(px,H*.81+65+Math.random()*16);ctx.lineTo(px+13,H*.81);ctx.fill();ctx.fillStyle='#fff2a0';ctx.beginPath();ctx.moveTo(px-5,H*.81);ctx.lineTo(px,H*.81+38);ctx.lineTo(px+5,H*.81);ctx.fill()}if(shake>0){ctx.strokeStyle='#ff5a36';ctx.lineWidth=5;ctx.strokeRect(5,5,W-10,H-10)}}function update(dt){t+=dt;const steer=(input.r?1:0)-(input.l?1:0);const boost=input.n&&nitroEnergy>0;if(boost)nitroEnergy=Math.max(0,nitroEnergy-35*dt);else nitroEnergy=Math.min(100,nitroEnergy+8*dt);const target=boost?car.max+130:car.max;if(car.speed<target)car.speed+=car.accel*dt;else car.speed-=car.drag*dt;if(car.speed>target)car.speed-=460*dt;car.speed=clamp(car.speed,0,target);car.vx+=steer*720*dt*(.35+car.speed/car.max);car.vx*=Math.max(0,1-car.grip*dt);car.x+=car.vx*dt;const limit=roadWidth()*.39;if(Math.abs(car.x)>limit){car.x=clamp(car.x,-limit,limit);car.vx*=-.42;car.speed*=.82;shake=.18}dist+=car.speed*dt;for(const q of traffic){q.z-=(car.speed-q.v)*dt;if(q.z<80){const targetX=q.lane*roadWidth()*.75;if(Math.abs(car.x-targetX)<62){car.speed*=.55;car.vx+=(car.x<targetX?-1:1)*150;shake=.22}q.z=1900+Math.random()*900;q.lane=[-.28,0,.28][Math.floor(Math.random()*3)];q.v=160+Math.random()*100}}if(dist>=2800){dist-=2800;lap++;if(lap>3){lap=3;running=false;$('menu').classList.remove('hide');$('msg').textContent='🏆 FINISH! V16 race complete. Press START RACE again.'}}$('lap').textContent=lap+'/3';$('speed').textContent=Math.round(car.speed*.31);shake=Math.max(0,shake-dt)}function loop(now){if(!running){draw();return}const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}draw()})();</script></body></html>
