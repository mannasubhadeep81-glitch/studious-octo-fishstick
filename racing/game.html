<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V25</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101820;font-family:system-ui,-apple-system,sans-serif;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-weight:900;z-index:2}.panel{background:linear-gradient(180deg,#132c49ee,#071321ee);border:1px solid #ffffff33;border-radius:14px;padding:7px 11px;box-shadow:0 5px 18px #0006}.brand{font-size:12px}.speed{font-size:13px}.lap{font-size:13px}.controls{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:space-between;align-items:end;padding:0 12px;z-index:3;pointer-events:none}.steers{display:flex;gap:10px}.control{pointer-events:auto;width:72px;height:62px;border-radius:20px;border:1px solid #ffffff55;background:#071827dd;color:#fff;font-size:30px;font-weight:900;box-shadow:0 7px 20px #0007;touch-action:none}.nitro{width:102px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5de4ff,#0876bd 55%,#06395f);border:4px solid #63d9ff;font-size:12px;box-shadow:0 0 24px #00aaff66}.menu{position:fixed;inset:0;display:grid;place-items:center;background:#020711aa;z-index:5}.card{width:min(420px,88vw);padding:24px;border-radius:25px;text-align:center;background:linear-gradient(145deg,#14355b,#08182c);border:1px solid #5bcfff66;box-shadow:0 20px 70px #0009}.card h1{margin:0 0 8px}.card p{opacity:.85}.card button{width:100%;height:58px;border:0;border-radius:16px;background:linear-gradient(180deg,#29c4ff,#0788d8);color:#fff;font-size:18px;font-weight:900}.mode{font-size:12px;opacity:.75;margin-top:10px}.result{font-size:18px;font-weight:800;margin:10px 0}.hide{display:none!important}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="panel brand">🏁 LUMIRA GP <small>V25</small></span><span class="panel speed">⚡ <b id="speed">0</b> km/h</span><span class="panel lap">🏆 <b id="lap">1/3</b></span></div><div class="controls"><div class="steers"><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div><button class="control nitro" id="nitro">⚡<br>NITRO</button></div><div id="menu" class="menu"><div class="card"><h1 id="title">🏎️ LUMIRA RACING</h1><p id="sub">V25 • accurate collision physics</p><div id="result" class="result hide"></div><button id="start">▶ START RACE</button><div class="mode">Touch ◀ ▶ or tilt your phone • Hold NITRO to boost</div></div></div><script>(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),$=id=>document.getElementById(id);let W=0,H=0,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();let run=false,last=0,dist=0,lap=1,nitro=100,tilt=0,tiltOn=false;const car={x:0,vx:0,speed:0};const inp={l:false,r:false,n:false};const lanes=[-.31,0,.31];const traffic=[{lane:-1,z:720,v:175,c:'#1677ff'},{lane:1,z:1320,v:190,c:'#ffd126'},{lane:0,z:2050,v:180,c:'#ef3150'},{lane:-1,z:2850,v:200,c:'#8d5cff'}];const trees=Array.from({length:55},(_,i)=>({side:i%2?-1:1,z:i*145+80,type:i%3}));const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function roadW(){return Math.min(W*.82,760)}function reset(){traffic[0].lane=-1;traffic[0].z=720;traffic[1].lane=1;traffic[1].z=1320;traffic[2].lane=0;traffic[2].z=2050;traffic[3].lane=-1;traffic[3].z=2850}function showMenu(title,sub,button,result=''){run=false;$('menu').classList.remove('hide');$('title').textContent=title;$('sub').textContent=sub;$('start').textContent=button;$('result').textContent=result;$('result').classList.toggle('hide',!result)}function start(){run=true;dist=0;lap=1;car.x=0;car.vx=0;car.speed=0;nitro=100;reset();$('menu').classList.add('hide');$('result').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}$('start').onclick=start;function bind(id,k){const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();inp[k]=true});['pointerup','pointercancel','pointerleave'].forEach(t=>e.addEventListener(t,()=>inp[k]=false))}bind('left','l');bind('right','r');bind('nitro','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')inp.l=true;if(e.key==='ArrowRight')inp.r=true;if(e.code==='Space')inp.n=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')inp.l=false;if(e.key==='ArrowRight')inp.r=false;if(e.code==='Space')inp.n=false});addEventListener('deviceorientation',e=>{if(tiltOn&&e.gamma!=null)tilt=clamp(e.gamma/28,-1,1)});async function enableTilt(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){tiltOn=(await DeviceOrientationEvent.requestPermission())==='granted'}else tiltOn=true}catch(e){tiltOn=false}}$('start').addEventListener('click',enableTilt,{once:true});function roundRect(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}function carSprite(x,y,col,s=1,angle=0,player=false){g.save();g.translate(x,y);g.rotate(angle);g.scale(s,s);g.shadowColor='#0009';g.shadowBlur=16;g.shadowOffsetY=10;g.fillStyle='#05080c';roundRect(-34,-24,68,48,12);g.fill();g.shadowColor='transparent';g.fillStyle=col;roundRect(-29,-21,58,42,10);g.fill();g.fillStyle='#071522';roundRect(-18,-15,36,17,6);g.fill();g.fillStyle='#9eeeff';g.globalAlpha=.65;roundRect(-14,-12,28,9,4);g.fill();g.globalAlpha=1;g.fillStyle='#11161b';roundRect(-34,-17,8,13,4);g.fill();roundRect(26,-17,8,13,4);g.fill();roundRect(-34,5,8,13,4);g.fill();roundRect(26,5,8,13,4);g.fill();g.fillStyle=player?'#ffffff':'#ff4055';roundRect(-19,15,12,4,2);g.fill();roundRect(7,15,12,4,2);g.fill();if(player){g.fillStyle='#fff';g.globalAlpha=.25;roundRect(-25,-20,50,5,3);g.fill();g.globalAlpha=1}g.restore()}function palm(x,y,s){g.save();g.translate(x,y);g.fillStyle='#7a4b28';g.fillRect(-4,0,8,55*s);g.strokeStyle='#a66a38';g.lineWidth=3;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(7,25*s,0,55*s);g.stroke();g.fillStyle='#159447';for(let i=0;i<7;i++){const a=i*Math.PI*2/7;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(Math.cos(a)*30*s,Math.sin(a)*18*s-10*s,Math.cos(a)*58*s,Math.sin(a)*28*s-12*s);g.quadraticCurveTo(Math.cos(a)*27*s,Math.sin(a)*6*s,0,0);g.fill()}g.restore()}function mountain(x,y,s){g.fillStyle='#6aa0b7';g.beginPath();g.moveTo(x-250*s,y+100*s);g.lineTo(x-95*s,y-80*s);g.lineTo(x,y-210*s);g.lineTo(x+90*s,y-90*s);g.lineTo(x+210*s,y+80*s);g.closePath();g.fill();g.fillStyle='#eaf8ff';g.beginPath();g.moveTo(x-45*s,y-120*s);g.lineTo(x,y-210*s);g.lineTo(x+48*s,y-110*s);g.lineTo(x+20*s,y-130*s);g.lineTo(x,y-160*s);g.lineTo(x-20*s,y-125*s);g.closePath();g.fill()}function roadPoint(rel){const t=clamp(1-rel/2600,0,1),h=H*.30;return{y:h+(H-h)*t*t,half:roadW()*.34+(roadW()*.16)*t*t}}function draw(){g.clearRect(0,0,W,H);const horizon=H*.30,r=roadW();let sky=g.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#4ec8ff');sky.addColorStop(1,'#d9f6ff');g.fillStyle=sky;g.fillRect(0,0,W,horizon);g.fillStyle='#72b7c9';g.fillRect(0,horizon-35,W,35);mountain(W*.25,horizon,1);mountain(W*.60,horizon+5,1.15);mountain(W*.88,horizon+18,.72);g.fillStyle='#15834a';g.fillRect(0,horizon,W,H-horizon);const top=r*.28,bottom=r*.58;g.fillStyle='#343a42';g.beginPath();g.moveTo(W/2-top,horizon);g.lineTo(W/2+top,horizon);g.lineTo(W/2+bottom,H);g.lineTo(W/2-bottom,H);g.closePath();g.fill();g.strokeStyle='#e8e8e8';g.lineWidth=2;g.stroke();for(const side of[-1,1]){g.strokeStyle='#d83939';g.lineWidth=13;g.beginPath();g.moveTo(W/2+side*top,horizon);g.lineTo(W/2+side*bottom,H);g.stroke();g.strokeStyle='#f7f7f7';g.lineWidth=5;g.beginPath();g.moveTo(W/2+side*(top+10),horizon);g.lineTo(W/2+side*(bottom+8),H);g.stroke()}g.strokeStyle='#f7e66b';g.lineWidth=4;g.setLineDash([30,28]);g.lineDashOffset=-(dist%58);for(let i=1;i<3;i++){const x=W/2-r*.30+r*.60*(i-1);g.beginPath();g.moveTo(x,horizon);g.lineTo(x,H);g.stroke()}g.setLineDash([]);for(const t of trees){let rel=t.z-dist;while(rel<0)rel+=4300;if(rel<2600){const p=roadPoint(rel),s=clamp(1.5-rel/2300,.35,1.3),side=t.side;const x=W/2+side*(p.half+55*s);palm(x,p.y-70*s,s)}}for(const q of traffic){let rel=q.z-dist;while(rel<0)rel+=3600;if(rel<2200){const p=roadPoint(rel),x=W/2+lanes[q.lane+1]*p.half*.88,s=clamp(.34+(.9-rel/2500),.36,1.12);carSprite(x,p.y-25*s,q.c,s,0,false)}}const px=W/2+car.x;carSprite(px,H*.79,'#ed242b',1.25,car.vx*.001,true);if(inp.n&&nitro>0){for(let i=0;i<3;i++){g.fillStyle=i===1?'#fff3a3':'#ff8b20';g.beginPath();g.moveTo(px-13+i*10,H*.80);g.lineTo(px-7+i*7,H*.80+45+Math.random()*30);g.lineTo(px-1+i*5,H*.80);g.closePath();g.fill()}}drawSpeedometer();drawMiniMap()}function drawSpeedometer(){const x=W-92,y=H-102,r=65;g.save();g.translate(x,y);g.fillStyle='#091018dd';g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.fill();g.strokeStyle='#ffffff55';g.lineWidth=4;g.stroke();g.strokeStyle='#f33';g.lineWidth=7;g.beginPath();g.arc(0,0,r-10,-2.25,-.35);g.stroke();g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(0,0);const a=-2.25+(car.speed/560)*1.9;g.lineTo(Math.cos(a)*43,Math.sin(a)*43);g.stroke();g.fillStyle='#fff';g.font='900 22px system-ui';g.textAlign='center';g.fillText(Math.round(car.speed*.31),0,28);g.font='10px system-ui';g.fillText('km/h',0,42);g.restore()}function drawMiniMap(){const x=W-88,y=62;g.save();g.strokeStyle='#ffffffaa';g.lineWidth=5;g.beginPath();g.moveTo(x,y);g.lineTo(x+38,y-10);g.lineTo(x+52,y+12);g.lineTo(x+35,y+32);g.lineTo(x+52,y+55);g.lineTo(x+20,y+70);g.lineTo(x-5,y+52);g.lineTo(x+5,y+28);g.lineTo(x-10,y+10);g.closePath();g.stroke();g.fillStyle='#ef3038';g.beginPath();g.arc(x+20,y+42,5,0,Math.PI*2);g.fill();g.restore()}function update(dt){const steer=tiltOn?tilt:(inp.r?1:0)-(inp.l?1:0),boost=inp.n&&nitro>0;if(boost)nitro=Math.max(0,nitro-42*dt);else nitro=Math.min(100,nitro+10*dt);const target=boost?560:430;if(car.speed<target)car.speed+=300*dt;else car.speed-=75*dt;car.speed=clamp(car.speed,0,target);car.vx+=steer*720*dt*(.45+car.speed/430);car.vx*=Math.max(0,1-7*dt);car.x+=car.vx*dt;const limit=roadW()*.42;if(Math.abs(car.x)>limit){car.x=clamp(car.x,-limit,limit);car.vx*=-.55;car.speed*=.75}dist+=car.speed*dt;for(const q of traffic){q.z-=q.v*dt;if(q.z<dist-300){q.z=dist+1250+Math.random()*1200;q.lane=Math.floor(Math.random()*3)-1;q.v=165+Math.random()*55;continue}const rel=q.z-dist;if(rel<180&&rel>-180){const p=roadPoint(rel);const qx=W/2+lanes[q.lane+1]*p.half*.88;const s=clamp(.34+(.9-rel/2500),.36,1.12);const playerLeft=W/2+car.x-34*1.25;const playerRight=W/2+car.x+34*1.25;const playerTop=H*.79-24*1.25;const playerBottom=H*.79+24*1.25;const trafficLeft=qx-34*s;const trafficRight=qx+34*s;const trafficTop=p.y-25*s-24*s;const trafficBottom=p.y-25*s+24*s;if(playerLeft<trafficRight&&playerRight>trafficLeft&&playerTop<trafficBottom&&playerBottom>trafficTop){showMenu('💥 CRASH!','V25 • real car-to-car collision','↻ RESTART RACE','Cars touched — race ended');return}}}if(dist>=4200){dist-=4200;lap++;if(lap>3){showMenu('🏆 YOU WIN!','LUMIRA GP • FINISH','🏁 PLAY AGAIN','🥇 1st Place • 3/3 Laps completed');return}}$('lap').textContent=lap+'/3';$('speed').textContent=Math.round(car.speed*.31)}function loop(now){if(!run)return;const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(run)requestAnimationFrame(loop)}draw()})();</script></body></html>
