<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111f;font-family:system-ui;color:white}canvas{display:block;width:100%;height:100%}.hud{position:fixed;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;font-weight:900;pointer-events:none}.pill{background:#07111fee;border:1px solid #ffffff44;border-radius:12px;padding:8px 12px}.menu{position:fixed;inset:0;display:grid;place-items:center;background:#02060dcc}.card{width:min(420px,88vw);padding:25px;border-radius:24px;text-align:center;background:#0b1a31;border:1px solid #43d9ff66;box-shadow:0 20px 70px #000}.card button{width:100%;height:58px;margin-top:10px;border:0;border-radius:15px;background:#1597ff;color:white;font-size:18px;font-weight:900}.card button.secondary{background:#26364d}.hide{display:none!important}.controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.controls div{display:flex;gap:10px}.control{pointer-events:auto;width:68px;height:58px;border:1px solid #ffffff44;border-radius:16px;background:#07111edd;color:#fff;font-size:25px;font-weight:900;touch-action:none}.nitro{width:100px;background:#b43c18}.small{opacity:.75;font-size:12px}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="pill">🏎️ LUMIRA RACING</span><span class="pill">🏁 <span id="lap">1/3</span> • <span id="speed">0</span> km/h</span></div><div class="controls"><div><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div><button class="control nitro" id="nitro">NITRO</button></div><div id="menu" class="menu"><div class="card"><h1>🏁 LUMIRA RACING</h1><p>2D Physics Racing</p><button id="start">▶ START RACE</button><button id="multi" class="secondary">👥 MULTIPLAYER</button><p id="msg" class="small">Acceleration • grip • drift • collisions • AI traffic</p></div></div><script>(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d');let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const $=id=>document.getElementById(id);let running=false,last=0,t=0,lap=1,dist=0,finish=false;const input={l:false,r:false,n:false};const car={x:0,vx:0,speed:0,max:330,accel:420,brake:620,drag:110,grip:8.5};const ai=[{x:-.28,s:275,d:500},{x:.28,s:300,d:1100},{x:0,s:285,d:1750}];function start(){running=true;finish=false;lap=1;dist=0;car.x=0;car.vx=0;car.speed=80;ai[0].d=500;ai[1].d=1100;ai[2].d=1750;$('menu').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}$('start').addEventListener('click',start);$('multi').addEventListener('click',()=>{$('msg').textContent='Multiplayer is next; solo physics is now active.'});function bind(id,k){const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();input[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>e.addEventListener(ev,()=>input[k]=false))}bind('left','l');bind('right','r');bind('nitro','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')input.l=true;if(e.key==='ArrowRight')input.r=true;if(e.code==='Space')input.n=true;if(e.code==='Enter'&&!running)start()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')input.l=false;if(e.key==='ArrowRight')input.r=false;if(e.code==='Space')input.n=false});function roadWidth(){return Math.min(W*.76,700)}function carDraw(x,y,scale=1,color='#25d8ff',tilt=0){ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.scale(scale,scale);ctx.fillStyle='#111';ctx.fillRect(-25,-38,50,76);ctx.fillStyle=color;ctx.fillRect(-20,-35,40,70);ctx.fillStyle='#071b2a';ctx.fillRect(-13,-18,26,20);ctx.fillStyle='#e8fbff';ctx.fillRect(-16,10,32,11);ctx.fillStyle='#111';ctx.fillRect(-27,-26,7,17);ctx.fillRect(20,-26,7,17);ctx.fillRect(-27,10,7,17);ctx.fillRect(20,10,7,17);ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);const horizon=H*.2,road=roadWidth();ctx.fillStyle='#3188b2';ctx.fillRect(0,0,W,horizon);ctx.fillStyle='#1e6b3c';ctx.fillRect(0,horizon,W,H-horizon);ctx.fillStyle='#30343b';ctx.beginPath();ctx.moveTo(W/2-road*.52,horizon);ctx.lineTo(W/2+road*.52,horizon);ctx.lineTo(W/2+road*.43,H);ctx.lineTo(W/2-road*.43,H);ctx.closePath();ctx.fill();const shake=Math.min(5,Math.abs(car.vx)*.01);ctx.strokeStyle='#f8e88a';ctx.lineWidth=4;ctx.setLineDash([30,28]);ctx.lineDashOffset=-(dist*.8%58);for(let i=1;i<3;i++){const x=W/2-road*.42+road*.28*i;ctx.beginPath();ctx.moveTo(x,horizon);ctx.lineTo(x,H);ctx.stroke()}ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.font='900 18px system-ui';ctx.fillText('LUMIRA GP',16,horizon-16);for(const a of ai){let rel=a.d-dist;while(rel<-1400)rel+=2800;while(rel>1400)rel-=2800;const y=H*.76-rel*.09;if(y>horizon-50&&y<H+80){const ax=W/2+a.x*road*.7;carDraw(ax,y,Math.max(.55,1-rel/3000), '#ff425f',0)}}const px=W/2+car.x*road*.7;carDraw(px,H*.76,1,'#25d8ff',car.vx*.0015);if(input.n&&car.speed>120){ctx.fillStyle='#ff9b28';ctx.beginPath();ctx.moveTo(px-13,H*.81);ctx.lineTo(px,H*.81+65+Math.random()*12);ctx.lineTo(px+13,H*.81);ctx.fill()}}function update(dt){t+=dt;const road=roadWidth();const steer=(input.r?1:0)-(input.l?1:0);const nitro=input.n&&car.speed>70;const targetMax=car.max+(nitro?190:0);if(car.speed<targetMax)car.speed+=car.accel*dt;else car.speed-=car.drag*dt;if(car.speed>targetMax)car.speed-=car.brake*dt;if(!nitro&&car.speed>car.max)car.speed-=120*dt;car.speed=Math.max(0,Math.min(targetMax,car.speed));const steeringStrength=150+car.speed*.42;car.vx+=steer*steeringStrength*dt;car.vx-=car.vx*car.grip*dt;car.x+=car.vx*dt/Math.max(road*.7,1);const edge=.38;if(car.x<-edge){car.x=-edge;car.vx*= -.35;car.speed*=.78}if(car.x>edge){car.x=edge;car.vx*= -.35;car.speed*=.78}dist+=car.speed*dt;for(const a of ai){a.d+=a.s*dt;if(a.d>=2800)a.d-=2800;let rel=a.d-dist;while(rel>1400)rel-=2800;while(rel<-1400)rel+=2800;if(Math.abs(rel)<75&&Math.abs(a.x-car.x)<.09){car.speed*=.82;car.vx+=(car.x>a.x?1:-1)*1.8}}const newLap=Math.floor(dist/2800)+1;if(newLap!==lap){lap=Math.min(3,newLap);if(lap>=3&&dist>=8400){finish=true;running=false;$('menu').classList.remove('hide');$('msg').textContent='🏆 FINISH! Physics race complete. Press START RACE again.'}}$('lap').textContent=Math.min(lap,3)+'/3';$('speed').textContent=Math.round(car.speed*.72)}function loop(now){if(!running){draw();return}const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}draw()})();</script></body></html>
