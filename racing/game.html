<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V18</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111f;font-family:system-ui;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;gap:6px;font-weight:900;pointer-events:none}.pill{background:#07111ee8;border:1px solid #ffffff33;border-radius:13px;padding:8px 10px;backdrop-filter:blur(5px)}.controls{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}.controls div{display:flex;gap:10px}.control{pointer-events:auto;width:68px;height:60px;border:1px solid #ffffff55;border-radius:18px;background:#07111ee8;color:#fff;font-size:25px;font-weight:900;touch-action:none;box-shadow:0 7px 20px #0008}.nitro{width:102px;background:#c34b19}.menu{position:fixed;inset:0;display:grid;place-items:center;background:#020611d9;z-index:5}.card{width:min(430px,88vw);padding:25px;border-radius:26px;text-align:center;background:linear-gradient(145deg,#102746,#071326);border:1px solid #48dfff55;box-shadow:0 25px 90px #000}.card button{width:100%;height:58px;margin-top:10px;border:0;border-radius:16px;background:linear-gradient(135deg,#18a8ff,#3867ff);color:white;font-size:18px;font-weight:900}.hide{display:none!important}.small{opacity:.75;font-size:12px}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="pill">🏎️ LUMIRA V18</span><span class="pill">⚡ <span id="speed">0</span> km/h</span><span class="pill">🏁 <span id="lap">1/3</span></span></div><div class="controls"><div><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div><button class="control nitro" id="nitro">NITRO</button></div><div id="menu" class="menu"><div class="card"><h1 id="title">🏁 LUMIRA RACING</h1><p>V18 • polished 2D graphics + physics</p><button id="start">▶ START RACE</button><p id="msg" class="small">Detailed cars, scenery, road depth and crash physics.</p></div></div><script>(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();let run=false,last=0,dist=0,lap=1,nitro=100,shake=0,flash=0;const car={x:0,vx:0,speed:0,max:420,accel:310,drag:90,grip:7};const inp={l:false,r:false,n:false};const lanes=[-.29,0,.29];const traffic=[{lane:0,z:700,v:175,c:'#ed3154'},{lane:2,z:1450,v:195,c:'#ffd24b'},{lane:1,z:2200,v:185,c:'#8f68ff'}];const scenery=Array.from({length:42},(_,i)=>({side:i%2?-1:1,z:i*170+100,type:i%5}));function rw(){return Math.min(W*.76,720)}function reset(){traffic[0].lane=0;traffic[0].z=700;traffic[0].v=175;traffic[1].lane=2;traffic[1].z=1450;traffic[1].v=195;traffic[2].lane=1;traffic[2].z=2200;traffic[2].v=185}function start(){run=true;dist=0;lap=1;car.x=0;car.vx=0;car.speed=0;nitro=100;shake=0;flash=0;reset();$('menu').classList.add('hide');$('title').textContent='🏁 LUMIRA RACING';$('msg').textContent='Detailed cars, scenery, road depth and crash physics.';last=performance.now();requestAnimationFrame(loop)}function over(t){run=false;flash=.45;shake=.5;$('menu').classList.remove('hide');$('title').textContent='💥 CRASH!';$('msg').textContent=t+' Game Over — press START RACE to try again.'}$('start').addEventListener('click',start);function bind(id,k){const e=$(id);e.addEventListener('pointerdown',v=>{v.preventDefault();inp[k]=true});['pointerup','pointercancel','pointerleave'].forEach(v=>e.addEventListener(v,()=>inp[k]=false))}bind('left','l');bind('right','r');bind('nitro','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')inp.l=true;if(e.key==='ArrowRight')inp.r=true;if(e.code==='Space')inp.n=true;if(e.code==='Enter'&&!run)start()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')inp.l=false;if(e.key==='ArrowRight')inp.r=false;if(e.code==='Space')inp.n=false});const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function carSprite(x,y,col,s=1,rot=0,ai=false){g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);g.shadowColor='#0009';g.shadowBlur=12;g.shadowOffsetY=8;g.fillStyle='#070a0f';g.beginPath();g.roundRect(-25,-43,50,86,12);g.fill();g.shadowColor='transparent';g.fillStyle=col;g.beginPath();g.roundRect(-20,-39,40,78,10);g.fill();g.fillStyle='#101b29';g.beginPath();g.moveTo(-14,-27);g.lineTo(14,-27);g.lineTo(11,-5);g.lineTo(-11,-5);g.closePath();g.fill();g.fillStyle='#7fe9ff';g.globalAlpha=.55;g.fill();g.globalAlpha=1;g.fillStyle='#fff';g.fillRect(-15,9,30,5);g.fillStyle='#11151b';g.fillRect(-27,-26,7,19);g.fillRect(20,-26,7,19);g.fillRect(-27,8,7,19);g.fillRect(20,8,7,19);g.fillStyle='#ff4055';g.fillRect(-14,27,9,5);g.fillRect(5,27,9,5);if(!ai){g.fillStyle='#e8f8ff';g.fillRect(-15,-34,30,4);g.fillStyle='#1a2230';g.fillRect(-19,35,38,5);g.fillStyle='#fff';g.fillRect(-10,36,20,3)}else{g.fillStyle='#222';g.fillRect(-16,35,32,4)}g.restore()}function tree(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#51351e';g.fillRect(-4,5,8,31);g.fillStyle='#0a452c';g.beginPath();g.arc(0,0,25,0,Math.PI*2);g.fill();g.fillStyle='#176b3b';g.beginPath();g.arc(-10,-9,19,0,Math.PI*2);g.arc(11,-7,18,0,Math.PI*2);g.arc(0,-20,18,0,Math.PI*2);g.fill();g.restore()}function sign(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#777';g.fillRect(-2,0,4,36);g.fillStyle='#fff';g.fillRect(-24,-17,48,20);g.fillStyle='#d62839';g.fillRect(-21,-14,42,14);g.fillStyle='#fff';g.font='bold 8px system-ui';g.textAlign='center';g.fillText('LUMIRA',0,-4);g.restore()}function draw(){g.clearRect(0,0,W,H);g.save();if(shake>0)g.translate((Math.random()-.5)*10,(Math.random()-.5)*10);const horizon=H*.22,r=rw();let sky=g.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#267eb4');sky.addColorStop(.65,'#78c8e7');sky.addColorStop(1,'#d9f2fa');g.fillStyle=sky;g.fillRect(0,0,W,horizon);g.fillStyle='#234d68';g.beginPath();g.moveTo(0,horizon+35);g.lineTo(W*.2,horizon-10);g.lineTo(W*.38,horizon+30);g.lineTo(W*.58,horizon-5);g.lineTo(W*.78,horizon+28);g.lineTo(W,horizon-10);g.lineTo(W,H);g.lineTo(0,H);g.fill();g.fillStyle='#17633a';g.fillRect(0,horizon,W,H-horizon);g.fillStyle='#113f2b';g.beginPath();g.moveTo(0,horizon+65);g.lineTo(W*.25,horizon+5);g.lineTo(W*.5,horizon+55);g.lineTo(W*.75,horizon+5);g.lineTo(W,horizon+65);g.lineTo(W,H);g.lineTo(0,H);g.fill();const top=r*.48,bottom=r*.43;g.fillStyle='#292f38';g.beginPath();g.moveTo(W/2-top,horizon);g.lineTo(W/2+top,horizon);g.lineTo(W/2+bottom,H);g.lineTo(W/2-bottom,H);g.closePath();g.fill();g.strokeStyle='#e4e4e4';g.lineWidth=2;g.stroke();for(let side of [-1,1]){g.strokeStyle='#d8343e';g.lineWidth=13;g.beginPath();g.moveTo(W/2+side*top,horizon);g.lineTo(W/2+side*bottom,H);g.stroke();g.strokeStyle='#f5f0d0';g.lineWidth=7;g.setLineDash([18,16]);g.lineDashOffset=-(dist%34);g.beginPath();g.moveTo(W/2+side*(top-5),horizon);g.lineTo(W/2+side*(bottom-5),H);g.stroke();g.setLineDash([])}g.strokeStyle='#f6e36c';g.lineWidth=4;g.setLineDash([34,28]);g.lineDashOffset=-(dist%62);for(let i=1;i<3;i++){const xx=W/2-r*.42+r*.28*i;g.beginPath();g.moveTo(xx,horizon);g.lineTo(xx,H);g.stroke()}g.setLineDash([]);for(const o of scenery){let rel=o.z-dist;while(rel<0)rel+=3200;while(rel>3200)rel-=3200;if(rel<1800){const y=H*.73-rel*.052;const s=clamp(1.45-rel/1500,.28,1.15);const sx=W/2+o.side*(r*.55+s*22);if(o.type===4)sign(sx,y,s);else tree(sx,y,s)}}for(const q of traffic){let rel=q.z-dist;while(rel<0)rel+=3000;while(rel>3000)rel-=3000;if(rel<1550){const y=H*.77-rel*.048,s=clamp(1.12-rel/3400,.52,1.05);carSprite(W/2+lanes[q.lane]*r*.75,y,q.c,s,0,true)}}const px=W/2+car.x;carSprite(px,H*.77,'#18d9ff',1,car.vx*.0012,false);if(inp.n&&nitro>0){g.globalAlpha=.85;g.fillStyle='#ffb52e';g.beginPath();g.moveTo(px-14,H*.82);g.lineTo(px,H*.82+65+Math.random()*20);g.lineTo(px+14,H*.82);g.fill();g.globalAlpha=1}if(flash>0){g.fillStyle='rgba(255,70,30,.28)';g.fillRect(0,0,W,H)}g.restore();flash=Math.max(0,flash-.016);shake=Math.max(0,shake-.016)}function update(dt){const steer=(inp.r?1:0)-(inp.l?1:0),boost=inp.n&&nitro>0;if(boost)nitro=Math.max(0,nitro-38*dt);else nitro=Math.min(100,nitro+9*dt);const target=boost?560:430;if(car.speed<target)car.speed+=car.accel*dt;else car.speed-=car.drag*dt;car.speed=clamp(car.speed,0,target);car.vx+=steer*720*dt*(.35+car.speed/430);car.vx*=Math.max(0,1-car.grip*dt);car.x+=car.vx*dt;const limit=rw()*.39;if(Math.abs(car.x)>limit){car.x=clamp(car.x,-limit,limit);car.vx*=-.55;car.speed*=.72;shake=.18}dist+=car.speed*dt;for(const q of traffic){q.z-=q.v*dt;if(q.z<dist-250){q.z=dist+1150+Math.random()*1000;let choices=lanes.map((_,i)=>i).filter(i=>Math.abs(lanes[i]*rw()*.75-car.x)>90);q.lane=choices.length?choices[Math.floor(Math.random()*choices.length)]:Math.floor(Math.random()*3);q.v=165+Math.random()*55}const rel=q.z-dist,targetX=lanes[q.lane]*rw()*.75;if(Math.abs(rel)<92&&Math.abs(car.x-targetX)<58){over('Your car hit traffic.');return}}if(dist>=2800){dist-=2800;lap++;if(lap>3){run=false;$('menu').classList.remove('hide');$('title').textContent='🏆 FINISH!';$('msg').textContent='Race complete — press START RACE to play again.'}}$('lap').textContent=lap+'/3';$('speed').textContent=Math.round(car.speed*.31)}function loop(now){if(!run){draw();return}const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}draw()})();</script></body></html>
