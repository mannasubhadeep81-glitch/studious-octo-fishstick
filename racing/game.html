<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V26</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:system-ui,sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:2;font-weight:900}.p{background:#071827dd;border:1px solid #ffffff33;border-radius:12px;padding:7px 10px}.controls{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:space-between;padding:0 12px;z-index:3}.steer{display:flex;gap:10px}.btn{width:72px;height:62px;border:1px solid #ffffff55;border-radius:18px;background:#071827dd;color:#fff;font-size:30px;font-weight:900}.nitro{width:100px;border-radius:50%;background:#0876bd;border:4px solid #63d9ff;font-size:12px}.menu{position:fixed;inset:0;display:grid;place-items:center;background:#020711aa;z-index:5}.card{width:min(420px,88vw);padding:24px;border-radius:24px;text-align:center;background:#102c4d;border:1px solid #5bcfff66}.card button{width:100%;height:56px;border:0;border-radius:15px;background:#159fe8;color:#fff;font-size:18px;font-weight:900}.result{font-size:18px;font-weight:800;margin:10px}.hide{display:none!important}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="p">🏁 LUMIRA GP <small>V26</small></span><span class="p">⚡ <b id="speed">0</b> km/h</span><span class="p">🏆 <b id="lap">1/3</b></span></div><div class="controls"><div class="steer"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><button class="btn nitro" id="nitro">⚡<br>NITRO</button></div><div id="menu" class="menu"><div class="card"><h1 id="title">🏎️ LUMIRA RACING</h1><p id="sub">V26 • fixed car overlap</p><div id="result" class="result hide"></div><button id="start">▶ START RACE</button><p>Touch ◀ ▶ or tilt phone • Hold NITRO</p></div></div><script>(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),$=x=>document.getElementById(x);let W,H;function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();const lanes=[-.31,0,.31],car={x:0,vx:0,speed:0},inp={l:0,r:0,n:0};let dist=0,lap=1,run=0,last=0,tilt=0,tiltOn=0,nitro=100;let traffic=[];function reset(){traffic=[{lane:-1,z:850,v:165,c:'#1677ff'},{lane:1,z:1500,v:175,c:'#ffd126'},{lane:0,z:2300,v:180,c:'#ef3150'},{lane:-1,z:3150,v:190,c:'#8d5cff'}]}function roadW(){return Math.min(W*.82,760)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function menu(t,s,b,r){run=0;$('menu').classList.remove('hide');$('title').textContent=t;$('sub').textContent=s;$('start').textContent=b;$('result').textContent=r||'';$('result').classList.toggle('hide',!r)}async function tilt(){try{if(typeof DeviceOrientationEvent!='undefined'&&DeviceOrientationEvent.requestPermission)tiltOn=(await DeviceOrientationEvent.requestPermission())==='granted';else tiltOn=1}catch(e){tiltOn=0}}function start(){run=1;dist=0;lap=1;car.x=0;car.vx=0;car.speed=0;nitro=100;reset();$('menu').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}$('start').onclick=()=>{tilt();start()};[['left','l'],['right','r'],['nitro','n']].forEach(([id,k])=>{let e=$(id);e.onpointerdown=x=>{x.preventDefault();inp[k]=1};['pointerup','pointercancel','pointerleave'].forEach(t=>e.addEventListener(t,()=>inp[k]=0))});addEventListener('deviceorientation',e=>{if(tiltOn&&e.gamma!=null)tilt=clamp(e.gamma/28,-1,1)});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')inp.l=1;if(e.key==='ArrowRight')inp.r=1;if(e.code==='Space')inp.n=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')inp.l=0;if(e.key==='ArrowRight')inp.r=0;if(e.code==='Space')inp.n=0});function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}function carDraw(x,y,col,s=1,player=0){g.save();g.translate(x,y);g.scale(s,s);g.shadowColor='#0009';g.shadowBlur=12;g.shadowOffsetY=7;g.fillStyle='#05080c';rr(-34,-24,68,48,11);g.fill();g.shadowColor='transparent';g.fillStyle=col;rr(-29,-21,58,42,9);g.fill();g.fillStyle='#071522';rr(-18,-15,36,17,6);g.fill();g.fillStyle='#9eeeff';g.globalAlpha=.65;rr(-14,-12,28,9,4);g.fill();g.globalAlpha=1;g.fillStyle='#111';rr(-34,-17,8,13,4);g.fill();rr(26,-17,8,13,4);g.fill();rr(-34,5,8,13,4);g.fill();rr(26,5,8,13,4);g.fill();g.restore()}function roadPoint(rel){let t=clamp(1-rel/2600,0,1),h=H*.30;return{y:h+(H-h)*t*t,half:roadW()*(.34+.16*t*t)}}function draw(){g.clearRect(0,0,W,H);let h=H*.30,r=roadW();let sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#4ec8ff');sky.addColorStop(1,'#d9f6ff');g.fillStyle=sky;g.fillRect(0,0,W,h);g.fillStyle='#6aa0b7';g.beginPath();g.moveTo(0,h);g.lineTo(W*.22,h-150);g.lineTo(W*.42,h);g.lineTo(W*.62,h-190);g.lineTo(W,h);g.fill();g.fillStyle='#15834a';g.fillRect(0,h,W,H-h);let top=r*.28,bot=r*.58;g.fillStyle='#343a42';g.beginPath();g.moveTo(W/2-top,h);g.lineTo(W/2+top,h);g.lineTo(W/2+bot,H);g.lineTo(W/2-bot,H);g.closePath();g.fill();for(let side of[-1,1]){g.strokeStyle='#d83939';g.lineWidth=13;g.beginPath();g.moveTo(W/2+side*top,h);g.lineTo(W/2+side*bot,H);g.stroke();g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();g.moveTo(W/2+side*(top+10),h);g.lineTo(W/2+side*(bot+8),H);g.stroke()}g.strokeStyle='#f7e66b';g.lineWidth=4;g.setLineDash([30,28]);g.lineDashOffset=-(dist%58);for(let i=0;i<2;i++){let x=W/2-r*.30+r*.60*i;g.beginPath();g.moveTo(x,h);g.lineTo(x,H);g.stroke()}g.setLineDash([]);for(let q of traffic){let rel=q.z-dist;if(rel<0)rel+=3600;if(rel<2200){let p=roadPoint(rel),s=clamp(.34+.9-rel/2500,.36,1.12),x=W/2+lanes[q.lane+1]*p.half*.88;carDraw(x,p.y-25*s,q.c,s)}}let px=W/2+car.x;carDraw(px,H*.79,'#ed242b',1.25,1);if(inp.n&&nitro>0){for(let i=0;i<3;i++){g.fillStyle=i==1?'#fff3a3':'#ff8b20';g.beginPath();g.moveTo(px-13+i*10,H*.80);g.lineTo(px-7+i*7,H*.80+50+Math.random()*25);g.lineTo(px-1+i*5,H*.80);g.fill()}}}function crash(q,rel,p){let s=clamp(.34+.9-rel/2500,.36,1.12),qx=W/2+lanes[q.lane+1]*p.half*.88;let pw=34*1.25,ph=24*1.25,tw=34*s,th=24*s,px=W/2+car.x,py=H*.79,qy=p.y-25*s;return Math.abs(px-qx)<pw+tw-8&&Math.abs(py-qy)<ph+th-8}function update(dt){let steer=tiltOn?tilt:(inp.r?1:0)-(inp.l?1:0),boost=inp.n&&nitro>0;if(boost)nitro=Math.max(0,nitro-42*dt);else nitro=Math.min(100,nitro+10*dt);let target=boost?560:430;car.speed=clamp(car.speed+(car.speed<target?300:-75)*dt,0,target);car.vx+=steer*720*dt*(.45+car.speed/430);car.vx*=Math.max(0,1-7*dt);car.x+=car.vx*dt;let lim=roadW()*.42;if(Math.abs(car.x)>lim){car.x=clamp(car.x,-lim,lim);car.vx*=-.55;car.speed*=.75}dist+=car.speed*dt;for(let q of traffic){q.z-=q.v*dt;if(q.z<dist-300){q.z=dist+1400+Math.random()*1000;q.lane=Math.floor(Math.random()*3)-1;q.v=165+Math.random()*35;continue}let rel=q.z-dist;if(rel<190&&rel>-190){let p=roadPoint(rel);if(q.lane===Math.round(car.x/(roadW()*.31))&&Math.abs(rel)<125){menu('💥 CRASH!','V26 • same-lane collision','↻ RESTART RACE','The cars actually touched');return}if(crash(q,rel,p)){menu('💥 CRASH!','V26 • car body collision','↻ RESTART RACE','The cars touched');return}}}if(dist>=4200){dist-=4200;lap++;if(lap>3){menu('🏆 YOU WIN!','LUMIRA GP • FINISH','🏁 PLAY AGAIN','🥇 1st Place • 3/3 Laps completed');return}}$('lap').textContent=lap+'/3';$('speed').textContent=Math.round(car.speed*.31)}function loop(now){if(!run)return;let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(run)requestAnimationFrame(loop)}draw()})();</script></body></html>
