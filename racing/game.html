<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LUMIRA Racing V52 • SCENERY</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:8px;left:0;right:0;display:flex;justify-content:space-between;gap:6px;padding:0 8px;z-index:4;font-size:12px;font-weight:900}
.pill{background:#06121ddd;border:1px solid #ffffff2d;border-radius:14px;padding:7px 9px;backdrop-filter:blur(8px)}
.speed{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:6;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:#07121de8;border:3px solid #ffffff55;box-shadow:0 10px 35px #0008}
.speed b{font-size:28px;line-height:1}.speed small{font-size:10px;opacity:.75}
.controls{position:fixed;left:0;right:0;bottom:10px;display:flex;justify-content:space-between;align-items:end;padding:0 12px;z-index:5}
.steer{display:flex;gap:10px}.btn{width:70px;height:58px;border:1px solid #ffffff55;border-radius:18px;background:#071827e8;color:#fff;font-size:28px;font-weight:900;touch-action:none;box-shadow:0 8px 22px #0006}
.nitro{width:104px;border-radius:50%;background:#0876bd;border:4px solid #63d9ff;font-size:12px}
.menu{position:fixed;inset:0;display:grid;place-items:center;background:#020711aa;z-index:9}.card{width:min(430px,86vw);padding:23px;border-radius:24px;text-align:center;background:#102c4d;border:1px solid #5bcfff66;box-shadow:0 18px 60px #0008}.card button{width:100%;height:56px;border:0;border-radius:15px;background:#159fe8;color:#fff;font-size:18px;font-weight:900}.hide{display:none!important}.result{font-size:19px;font-weight:900;margin:12px 0}.small{opacity:.8;font-size:13px;line-height:1.45}
</style></head><body><div id="sceneBadge" style="position:fixed;top:48px;left:50%;transform:translateX(-50%);z-index:5;background:#063b2aee;color:#fff;border:1px solid #ffffff55;border-radius:12px;padding:6px 10px;font:900 11px system-ui;letter-spacing:.4px">🌳 ROADSCAPE • V49</div>
<canvas id="game"></canvas>
<div class="hud"><span class="pill">🔴 YOU <b id="you">0</b> km/h</span><span class="pill">🏁 <b id="lap">1/3</b></span><span class="pill">🔵 AI <b id="ai">0</b> km/h</span></div>
<div class="speed"><div style="text-align:center"><b id="speed">0</b><br><small>KM/H</small></div></div>
<div class="controls"><div class="steer"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><button class="btn nitro" id="nitro">⚡<br>NITRO</button></div>
<div id="menu" class="menu"><div class="card"><h1 id="title">🏎️ YOU vs LUMIRA AI</h1><p id="sub">V42 • arcade 2D racing + responsive speed</p><div id="result" class="result hide"></div><button id="start">▶ START DUEL</button><p class="small">Fast acceleration, visible speed feedback, timed Nitro, independent AI, realistic roadside scenery and dangerous rocks.</p></div></div>
<script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),$=id=>document.getElementById(id);
let W,H,D;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const inp={l:false,r:false,n:false};const player={x:-.06,vx:0,speed:0,dist:0};const rival={x:.20,vx:0,speed:0,dist:70};
const TRACK=12600,LAP=4200,CAR_W=.12,CAR_L=92;
const obstacles=[850,1250,1650,2050,2450,2850,3250,3650,4100,4500,4900,5350,5800,6250,6700,7150,7600,8050,8500,8950,9400,9850,10300,10750,11200,11650,12100].map((d,i)=>({d,x:[-.25,.24,-.08,.30,-.30,.12,-.20,.27,-.08,.31,-.28,.05,.24,-.16,.30,-.25,.08,-.31,.22,-.12,.29,-.26,.04,.25,-.30,.16,-.22][i]}));
let running=false,last=0,nitro=100,nitroTime=0,tilt=0,tiltOK=false,aiMood=0,aiCooldown=0,hitFlash=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){Object.assign(player,{x:-.06,vx:0,speed:0,dist:0});Object.assign(rival,{x:.20,vx:0,speed:0,dist:70});nitro=100;nitroTime=0;aiMood=0;aiCooldown=0;hitFlash=0}
async function enableTilt(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')tiltOK=(await DeviceOrientationEvent.requestPermission())==='granted';else tiltOK='DeviceOrientationEvent'in window}catch(e){tiltOK=false}}
function finish(title,reason){running=false;inp.n=false;$('menu').classList.remove('hide');$('title').textContent=title;$('sub').textContent=reason;$('result').classList.remove('hide');$('result').textContent=title.includes('CRASH')?'💥 ROCK COLLISION':'🏁 FINISH';$('start').textContent='↻ PLAY AGAIN'}
function start(){reset();running=true;$('menu').classList.add('hide');last=performance.now();enableTilt();requestAnimationFrame(loop)}
$('start').onclick=start;
[['left','l'],['right','r'],['nitro','n']].forEach(([id,key])=>{const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();inp[key]=true});['pointerup','pointercancel','pointerleave'].forEach(t=>e.addEventListener(t,()=>inp[key]=false))});
addEventListener('deviceorientation',e=>{if(tiltOK&&e.gamma!=null)tilt=clamp(e.gamma/25,-1,1)});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')inp.l=true;if(e.key==='ArrowRight')inp.r=true;if(e.code==='Space')inp.n=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')inp.l=false;if(e.key==='ArrowRight')inp.r=false;if(e.code==='Space')inp.n=false});
let drag=false;c.addEventListener('pointerdown',()=>{if(running)drag=true});c.addEventListener('pointermove',e=>{if(!running||!drag)return;const r=c.getBoundingClientRect();player.x=clamp(((e.clientX-r.left)/r.width-.5)*1.15,-.43,.43);player.vx=0});['pointerup','pointercancel'].forEach(t=>c.addEventListener(t,()=>drag=false));
function rounded(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function drawCar(x,y,color,scale=1){
g.save();g.translate(x,y);g.scale(scale,scale);
g.shadowColor='#000c';g.shadowBlur=20;g.shadowOffsetY=11;
g.fillStyle='#05070a';rounded(-35,-48,70,96,18);g.fill();
g.shadowColor='transparent';
/* aerodynamic sports-car body */
g.fillStyle=color;g.beginPath();
g.moveTo(0,-49);g.bezierCurveTo(22,-46,31,-31,32,-8);
g.lineTo(30,29);g.bezierCurveTo(28,43,18,49,0,51);
g.bezierCurveTo(-18,49,-28,43,-30,29);g.lineTo(-32,-8);
g.bezierCurveTo(-31,-31,-22,-46,0,-49);g.closePath();g.fill();
/* body highlight */
g.fillStyle='#ffffff';g.globalAlpha=.18;g.beginPath();g.moveTo(-20,-38);g.quadraticCurveTo(0,-49,20,-38);g.lineTo(15,25);g.quadraticCurveTo(0,35,-15,25);g.closePath();g.fill();g.globalAlpha=1;
/* black roof + windshield */
g.fillStyle='#07121c';g.beginPath();g.moveTo(-20,-28);g.quadraticCurveTo(0,-40,20,-28);g.lineTo(15,1);g.quadraticCurveTo(0,8,-15,1);g.closePath();g.fill();
g.fillStyle='#9eeaff';g.globalAlpha=.72;g.beginPath();g.moveTo(-14,-27);g.quadraticCurveTo(0,-34,14,-27);g.lineTo(11,-7);g.quadraticCurveTo(0,-2,-11,-7);g.closePath();g.fill();g.globalAlpha=1;
/* center body line */
g.strokeStyle='#ffffff55';g.lineWidth=1.5;g.beginPath();g.moveTo(0,-45);g.lineTo(0,45);g.stroke();
/* headlights */
for(const sx of[-1,1]){g.fillStyle='#f7fbff';g.shadowColor='#bff6ff';g.shadowBlur=9;g.beginPath();g.ellipse(sx*18,-29,7,4,0,0,Math.PI*2);g.fill();g.shadowColor='transparent'}
/* rear light */
g.fillStyle='#ff3944';g.fillRect(-18,35,36,4);
/* wheels */
g.fillStyle='#08090b';for(const yy of[-27,20]){rounded(-37,yy,10,22,4);g.fill();rounded(27,yy,10,22,4);g.fill()}
g.fillStyle='#bfc7ce';for(const yy of[-24,23]){g.beginPath();g.arc(-32,yy+5,3,0,Math.PI*2);g.fill();g.beginPath();g.arc(32,yy+5,3,0,Math.PI*2);g.fill()}
/* side mirrors */
g.fillStyle=color;rounded(-35,-17,8,11,3);g.fill();rounded(27,-17,8,11,3);g.fill();
g.restore()}function drawRock(x,y,scale){g.save();g.translate(x,y);g.scale(scale,scale);g.shadowColor='#000b';g.shadowBlur=15;g.shadowOffsetY=8;g.fillStyle='#222';g.beginPath();g.moveTo(-44,16);g.lineTo(-32,-19);g.lineTo(-8,-30);g.lineTo(18,-21);g.lineTo(42,9);g.lineTo(25,29);g.lineTo(-22,26);g.closePath();g.fill();g.shadowColor='transparent';g.fillStyle='#777';g.beginPath();g.moveTo(-32,-19);g.lineTo(-8,-30);g.lineTo(18,-21);g.lineTo(7,-2);g.lineTo(-16,5);g.closePath();g.fill();g.fillStyle='#aaa';g.beginPath();g.arc(-13,-10,5,0,Math.PI*2);g.fill();g.restore()}
function drawTree(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#5a3924';g.fillRect(-4,0,8,28);g.fillStyle='#145f35';g.beginPath();g.arc(0,-12,20,0,Math.PI*2);g.arc(-12,0,15,0,Math.PI*2);g.arc(12,0,15,0,Math.PI*2);g.fill();g.fillStyle='#2b8a4d';g.beginPath();g.arc(-5,-17,10,0,Math.PI*2);g.fill();g.restore()}
function drawHouse(x,y,s,flip=false){g.save();g.translate(x,y);g.scale((flip?-1:1)*s,s);g.fillStyle='#d7bd91';g.fillRect(-28,-2,56,31);g.fillStyle='#9a4638';g.beginPath();g.moveTo(-36,-2);g.lineTo(0,-30);g.lineTo(36,-2);g.closePath();g.fill();g.fillStyle='#61382c';g.fillRect(-7,13,14,16);g.fillStyle='#91d8e8';g.fillRect(-21,5,11,10);g.fillRect(10,5,11,10);g.fillStyle='#eee';g.globalAlpha=.35;g.fillRect(-25,1,50,3);g.globalAlpha=1;g.restore()}
function drawCloud(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.arc(-24,5,16,0,Math.PI*2);g.arc(-5,-4,22,0,Math.PI*2);g.arc(17,4,17,0,Math.PI*2);g.arc(34,9,11,0,Math.PI*2);g.fill();g.restore()}
function drawBird(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.strokeStyle='#263746';g.lineWidth=2.2;g.lineCap='round';g.beginPath();g.moveTo(-8,1);g.quadraticCurveTo(-3,-7,0,0);g.quadraticCurveTo(4,-7,9,1);g.stroke();g.restore()}
function drawScenery(){const roadW=canvas.width*.62, left=canvas.width/2-roadW/2, right=canvas.width/2+roadW/2;g.save();g.fillStyle='#79ad55';g.fillRect(0,0,canvas.width,canvas.height);for(let i=0;i<9;i++){const p=i/9, y=90+p*p*canvas.height*.72, s=.35+p*.85, spread=70+p*115;drawTree(left-spread,y,s);drawTree(right+spread,y,s);if(i%2===0){drawHouse(left-spread-65,y+12,s*.8,i%4===0);drawHouse(right+spread+65,y+12,s*.8,i%4!==0)}}for(let i=0;i<5;i++){const x=canvas.width*(.12+i*.19), y=55+Math.sin(i*2)*20;drawBird(x,y,.45+i*.05)}g.restore()}
function draw(){g.clearRect(0,0,W,H);const horizon=H*.25;
let sky=g.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#5fd2ff');sky.addColorStop(1,'#e8fbff');g.fillStyle=sky;g.fillRect(0,0,W,horizon);
g.fillStyle='#668d9a';g.beginPath();g.moveTo(0,horizon);g.lineTo(W*.20,horizon-82);g.lineTo(W*.34,horizon-28);g.lineTo(W*.44,horizon-8);g.lineTo(W*.50,horizon);g.lineTo(W*.56,horizon-8);g.lineTo(W*.66,horizon-28);g.lineTo(W*.80,horizon-82);g.lineTo(W,horizon);g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.fill();
g.fillStyle='#167845';g.fillRect(0,horizon,W,H-horizon);
g.fillStyle='#4f8f3d';g.fillRect(0,horizon,W*.19,H-horizon);g.fillRect(W*.81,horizon,W*.19,H-horizon);
for(let i=0;i<9;i++){const yy=horizon+35+i*((H-horizon-55)/9),sc=.55+i*.10;drawTree(55+(i%3)*55,yy,sc);drawTree(W-55-(i%3)*55,yy,sc);if(i%3===1){drawHouse(145,yy+5,sc*.7,false);drawHouse(W-145,yy+5,sc*.7,true)}}
const top=W*.14,bot=W*.37;g.fillStyle='#292f36';g.beginPath();g.moveTo(W/2-top,horizon);g.lineTo(W/2+top,horizon);g.lineTo(W/2+bot,H);g.lineTo(W/2-bot,H);g.closePath();g.fill();
g.strokeStyle='#e24b50';g.lineWidth=8;for(const side of[-1,1]){g.beginPath();g.moveTo(W/2+side*top,horizon);g.lineTo(W/2+side*bot,H);g.stroke()}
g.strokeStyle='#f5ed62';g.lineWidth=4;g.setLineDash([24,28]);g.lineDashOffset=-(player.dist%52);g.beginPath();g.moveTo(W/2,horizon);g.lineTo(W/2,H);g.stroke();g.setLineDash([]);
const rel=rival.dist-player.dist,roadHalf=W*.37,playerY=H*.78,rivalY=playerY-rel*.22,rivalX=W/2+rival.x*roadHalf,playerX=W/2+player.x*roadHalf;
for(let i=0;i<20;i++){const d=Math.floor(player.dist/150)*150+i*150+70,od=d-player.dist;if(od>-450&&od<2300){const y=playerY-od*.22,s=clamp(1.25-Math.abs(od)/2600*.52,.28,1.25),side=i%2?-1:1,edge=roadHalf+55+s*48;drawTree(W/2+side*edge,y-28,s);if(i%4===0)drawHouse(W/2+side*(edge+58+s*30),y+8,s*.72,side<0)}}
for(let i=0;i<4;i++){drawCloud(W*(.18+i*.22),55+(i%2)*28,.55+(i%2)*.12)}
for(let i=0;i<5;i++){const t=(performance.now()*.000035+i*.23)%1;const x=W*(.20+i*.17)+t*W*.18;const y=48+i*16-Math.sin(t*Math.PI)*12;drawBird(x%W,y,.28+i*.025)}
for(const o of obstacles){const od=o.d-player.dist;if(od>-700&&od<1900){const oy=playerY-od*.22,ox=W/2+o.x*roadHalf,os=clamp(1.18-Math.abs(od)/2600*.18,.72,1.18);drawRock(ox,oy,os)}}
if(rivalY>-130&&rivalY<H+130){drawCar(rivalX,rivalY,'#168cff',clamp(1.18-Math.abs(rel)/2600*.18,.88,1.18))}
drawCar(playerX,playerY,'#ef2630',1.18);
if(nitroTime>0){g.fillStyle='#ff9f20';g.beginPath();g.moveTo(playerX-12,playerY+49);g.lineTo(playerX,playerY+112);g.lineTo(playerX+12,playerY+49);g.fill();g.fillStyle='#fff5a0';g.beginPath();g.moveTo(playerX-5,playerY+49);g.lineTo(playerX,playerY+88);g.lineTo(playerX+5,playerY+49);g.fill()}
if(hitFlash>0){g.fillStyle='rgba(255,40,40,'+Math.min(.32,hitFlash)+')';g.fillRect(0,0,W,H)}
}
function update(dt){
const manual=(inp.r?1:0)-(inp.l?1:0),steer=tiltOK&&Math.abs(tilt)>.08?tilt:manual;
if(inp.n&&nitro>0&&nitroTime<=0)nitroTime=3.2;
const boosting=nitroTime>0&&nitro>0;
if(boosting){nitroTime=Math.max(0,nitroTime-dt);nitro=Math.max(0,nitro-31*dt)}else{nitro=Math.min(100,nitro+8*dt)}
const pMax=boosting?420:285,pAcc=boosting?690:430,pBrake=boosting?20:34;
const target=pMax;
if(player.speed<target)player.speed=Math.min(target,player.speed+pAcc*dt);else player.speed=Math.max(target,player.speed-pBrake*dt);
if(!boosting&&player.speed>235)player.speed=Math.max(235,player.speed-10*dt);
player.vx+=steer*4.3*dt;player.vx*=Math.pow(.0022,dt);if(!drag)player.x=clamp(player.x+player.vx*dt,-.43,.43);
if(Math.abs(player.x)>.40)player.speed=Math.max(0,player.speed-75*dt);
player.dist+=player.speed*dt;
const smoothNeed=nitroTime<=0&&player.speed>285; if(smoothNeed)player.speed=285;
aiCooldown-=dt;if(aiCooldown<=0){aiCooldown=1.8+Math.random()*2.6;aiMood=Math.random()<.58?1:Math.random()<.5?-1:0}
const ahead=player.dist-rival.dist,sameLane=Math.abs(player.x-rival.x)<.18,roadRisk=Math.abs(rival.x)>.39;
let targetSpeed=258+(aiMood>0?24:aiMood<0?-10:0)+(ahead>650?12:0)-(roadRisk?85:0)-(sameLane&&ahead>0?14:0);
targetSpeed=clamp(targetSpeed,165,304);rival.speed+=(targetSpeed-rival.speed)*Math.min(1,dt*(targetSpeed>rival.speed?1.8:2.8));rival.speed=clamp(rival.speed,0,304);
const avoid=sameLane?(rival.x<=player.x?.28:-.28):0,desiredX=clamp(.12+Math.sin(rival.dist/650)*.16+avoid,-.40,.40);rival.vx+=(desiredX-rival.x)*5.2*dt;rival.vx*=Math.pow(.004,dt);rival.x=clamp(rival.x+rival.vx*dt,-.42,.42);if(Math.abs(rival.x)>.40)rival.speed=Math.max(0,rival.speed-70*dt);rival.dist+=rival.speed*dt;
for(const o of obstacles){const od=o.d-player.dist;if(Math.abs(od)<CAR_L*.66&&Math.abs(o.x-player.x)<CAR_W*.95){finish('💥 GAME OVER','You hit a rock hazard');return}}
const dz=rival.dist-player.dist,dx=Math.abs(rival.x-player.x);if(Math.abs(dz)<CAR_L&&dx<CAR_W){const push=player.x<rival.x?-1:1;player.vx+=push*1.5;rival.vx-=push*1.2;player.speed*=.76;rival.speed*=.80;hitFlash=.42}
hitFlash=Math.max(0,hitFlash-dt);$('you').textContent=Math.round(player.speed);$('ai').textContent=Math.round(rival.speed);$('speed').textContent=Math.round(player.speed);$('lap').textContent=Math.min(3,Math.floor(player.dist/LAP)+1)+'/3';
if(player.dist>=TRACK||rival.dist>=TRACK){if(player.dist>=TRACK&&player.dist>rival.dist)finish('🏆 YOU WIN!','You reached the finish first');else finish('🔵 LUMIRA AI WINS','AI reached the finish first')}
}
function loop(now){if(!running)return;const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}draw()
})();
</script></body></html>
