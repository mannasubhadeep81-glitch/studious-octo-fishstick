<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111f;font-family:system-ui;color:white}canvas{display:block;width:100%;height:100%}.hud{position:fixed;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;font-weight:900;pointer-events:none}.pill{background:#07111fee;border:1px solid #ffffff44;border-radius:12px;padding:8px 12px}.menu{position:fixed;inset:0;display:grid;place-items:center;background:#02060dcc}.card{width:min(420px,88vw);padding:25px;border-radius:24px;text-align:center;background:#0b1a31;border:1px solid #43d9ff66;box-shadow:0 20px 70px #000}.card button{width:100%;height:58px;margin-top:10px;border:0;border-radius:15px;background:#1597ff;color:white;font-size:18px;font-weight:900}.card button.secondary{background:#26364d}.hide{display:none!important}.controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.controls div{display:flex;gap:10px}.control{pointer-events:auto;width:68px;height:58px;border:1px solid #ffffff44;border-radius:16px;background:#07111edd;color:#fff;font-size:25px;font-weight:900;touch-action:none}.nitro{width:100px;background:#b43c18}.small{opacity:.75;font-size:12px}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="pill">🏎️ LUMIRA RACING</span><span class="pill">🏁 <span id="lap">1/3</span></span></div><div class="controls"><div><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div><button class="control nitro" id="nitro">NITRO</button></div><div id="menu" class="menu"><div class="card"><h1>🏁 LUMIRA RACING</h1><p>Mobile 2D Racing</p><button id="start">▶ START RACE</button><button id="multi" class="secondary">👥 MULTIPLAYER</button><p id="msg" class="small">Solo mode starts immediately. Multiplayer connects to the Render server.</p></div></div><script>(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d');let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const $=id=>document.getElementById(id);let running=false,last=0,t=0,playerX=0,dist=0,lap=1,nitro=0,keys={l:false,r:false,n:false};function start(){running=true;$('menu').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}$('start').addEventListener('click',start);$('multi').addEventListener('click',()=>{$('msg').textContent='Multiplayer lobby is available in V13.1. Use START RACE for a guaranteed local race.'});function bind(id,k){const e=$(id);const down=v=>ev=>{ev.preventDefault();keys[k]=v};e.addEventListener('pointerdown',down(true));['pointerup','pointercancel','pointerleave'].forEach(ev=>e.addEventListener(ev,down(false)))}bind('left','l');bind('right','r');bind('nitro','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=true;if(e.key==='ArrowRight')keys.r=true;if(e.code==='Space')keys.n=true;if(e.code==='Enter'&&!running)start()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=false;if(e.key==='ArrowRight')keys.r=false;if(e.code==='Space')keys.n=false});function car(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#111';ctx.fillRect(-25,-37,50,74);ctx.fillStyle='#25d8ff';ctx.fillRect(-20,-34,40,68);ctx.fillStyle='#071b2a';ctx.fillRect(-13,-18,26,18);ctx.fillStyle='#e8fbff';ctx.fillRect(-16,10,32,11);ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);const horizon=H*.2;ctx.fillStyle='#3188b2';ctx.fillRect(0,0,W,horizon);ctx.fillStyle='#1e6b3c';ctx.fillRect(0,horizon,W,H-horizon);const road=Math.min(W*.76,700);ctx.fillStyle='#30343b';ctx.beginPath();ctx.moveTo(W/2-road*.52,horizon);ctx.lineTo(W/2+road*.52,horizon);ctx.lineTo(W/2+road*.43,H);ctx.lineTo(W/2-road*.43,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#f8e88a';ctx.lineWidth=4;ctx.setLineDash([30,28]);ctx.lineDashOffset=-(t*180%58);for(let i=1;i<3;i++){const x=W/2-road*.42+road*.28*i;ctx.beginPath();ctx.moveTo(x,horizon);ctx.lineTo(x,H);ctx.stroke()}ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.font='900 18px system-ui';ctx.fillText('LUMIRA GP',16,horizon-16);car(W/2+playerX,H*.76,1);if(keys.n){ctx.fillStyle='#ff9b28';ctx.beginPath();ctx.moveTo(W/2+playerX-13,H*.81);ctx.lineTo(W/2+playerX,H*.81+65+Math.random()*12);ctx.lineTo(W/2+playerX+13,H*.81);ctx.fill()}}function update(dt){t+=dt;const road=Math.min(W*.76,700);playerX+=((keys.r?1:0)-(keys.l?1:0))*dt*360;playerX=Math.max(-road*.39,Math.min(road*.39,playerX));dist+=(keys.n?560:350)*dt;if(dist>=2800){dist-=2800;lap++;if(lap>3){lap=3;running=false;$('menu').classList.remove('hide');$('msg').textContent='🏆 FINISH! Press START RACE to race again.'}}$('lap').textContent=lap+'/3'}function loop(now){if(!running){draw();return}const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}draw()})();</script></body></html>
