<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V17</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111f;font-family:system-ui;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;gap:6px;font-weight:900;pointer-events:none}.pill{background:#07111eee;border:1px solid #ffffff44;border-radius:12px;padding:7px 9px}.controls{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}.controls div{display:flex;gap:9px}.control{pointer-events:auto;width:68px;height:60px;border:1px solid #ffffff55;border-radius:17px;background:#07111ee8;color:#fff;font-size:25px;font-weight:900;touch-action:none}.nitro{width:100px;background:#a93c18}.menu{position:fixed;inset:0;display:grid;place-items:center;background:#02060dcc;z-index:5}.card{width:min(430px,88vw);padding:24px;border-radius:24px;text-align:center;background:#0b1a31;border:1px solid #43d9ff66;box-shadow:0 20px 70px #000}.card button{width:100%;height:56px;margin-top:10px;border:0;border-radius:15px;background:#1597ff;color:white;font-size:18px;font-weight:900}.hide{display:none!important}.small{opacity:.78;font-size:12px}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="pill">🏎️ LUMIRA V17</span><span class="pill">⚡ <span id="speed">0</span> km/h</span><span class="pill">🏁 <span id="lap">1/3</span></span></div><div class="controls"><div><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div><button class="control nitro" id="nitro">NITRO</button></div><div id="menu" class="menu"><div class="card"><h1 id="title">🏁 LUMIRA RACING</h1><p>V17 • collision + crash system</p><button id="start">▶ START RACE</button><p id="msg" class="small">Traffic has separate lanes and real collision game-over.</p></div></div><script>(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();let running=false,last=0,dist=0,lap=1,nitro=100,shake=0;const car={x:0,vx:0,speed:0,max:420,accel:310,drag:90,grip:7};const input={l:false,r:false,n:false};const lanes=[-.27,0,.27];const traffic=[{lane:0,z:700,v:175,c:'#ff3b5c'},{lane:2,z:1450,v:195,c:'#ffd34d'},{lane:1,z:2200,v:185,c:'#9b72ff'}];const trees=Array.from({length:32},(_,i)=>({side:i%2?-1:1,z:i*220+100}));function rw(){return Math.min(W*.76,700)}function resetTraffic(){traffic[0].lane=0;traffic[0].z=700;traffic[0].v=175;traffic[1].lane=2;traffic[1].z=1450;traffic[1].v=195;traffic[2].lane=1;traffic[2].z=2200;traffic[2].v=185}function start(){running=true;dist=0;lap=1;car.x=0;car.vx=0;car.speed=0;nitro=100;shake=0;resetTraffic();$('menu').classList.add('hide');$('title').textContent='🏁 LUMIRA RACING';$('msg').textContent='Traffic has separate lanes and real collision game-over.';last=performance.now();requestAnimationFrame(loop)}function gameOver(reason){running=false;shake=.5;$('menu').classList.remove('hide');$('title').textContent='💥 CRASH!';$('msg').textContent=reason+' Game Over — press START RACE to try again.'}$('start').addEventListener('click',start);function bind(id,k){const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();input[k]=true});['pointerup','pointercancel','pointerleave'].forEach(v=>e.addEventListener(v,()=>input[k]=false))}bind('left','l');bind('right','r');bind('nitro','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')input.l=true;if(e.key==='ArrowRight')input.r=true;if(e.code==='Space')input.n=true;if(e.code==='Enter'&&!running)start()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')input.l=false;if(e.key==='ArrowRight')input.r=false;if(e.code==='Space')input.n=false});function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function carDraw(x,y,col,s=1,tilt=0){ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.scale(s,s);ctx.fillStyle='#07090c';ctx.shadowColor='#000';ctx.shadowBlur=9;ctx.shadowOffsetY=6;ctx.beginPath();ctx.roundRect(-23,-38,46,76,9);ctx.fill();ctx.shadowColor='transparent';ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(-18,-34,36,68,7);ctx.fill();ctx.fillStyle='#071c2b';ctx.fillRect(-12,-20,24,20);ctx.fillStyle='#eaffff';ctx.fillRect(-14,10,28,10);ctx.fillStyle='#101317';ctx.fillRect(-25,-24,6,18);ctx.fillRect(19,-24,6,18);ctx.fillRect(-25,8,6,18);ctx.fillRect(19,8,6,18);ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);const h=H*.18,r=rw();let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#4db8e8');sky.addColorStop(1,'#d8f4ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,h);ctx.fillStyle='#1d6d3d';ctx.fillRect(0,h,W,H-h);const rt=r*.54,rb=r*.44;ctx.fillStyle='#292e35';ctx.beginPath();ctx.moveTo(W/2-rt,h);ctx.lineTo(W/2+rt,h);ctx.lineTo(W/2+rb,H);ctx.lineTo(W/2-rb,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#d94b43';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(W/2-rt,h);ctx.lineTo(W/2-rb,H);ctx.moveTo(W/2+rt,h);ctx.lineTo(W/2+rb,H);ctx.stroke();ctx.strokeStyle='#f5e37b';ctx.lineWidth=4;ctx.setLineDash([30,28]);ctx.lineDashOffset=-(dist%58);for(let i=1;i<3;i++){const xx=W/2-r*.42+r*.28*i;ctx.beginPath();ctx.moveTo(xx,h);ctx.lineTo(xx,H);ctx.stroke()}ctx.setLineDash([]);for(const tr of trees){let rel=tr.z-dist;while(rel<0)rel+=3000;while(rel>3000)rel-=3000;if(rel<1900){const y=H*.72-rel*.055,s=clamp(1.2-rel/1700,.35,1);const tx=W/2+tr.side*(r*.56+s*10);ctx.fillStyle='#513c25';ctx.fillRect(tx-3,y+10,6,20*s);ctx.fillStyle='#12613a';ctx.beginPath();ctx.arc(tx,y,20*s,0,Math.PI*2);ctx.fill()}}for(const q of traffic){let rel=q.z-dist;while(rel<0)rel+=3000;while(rel>3000)rel-=3000;if(rel<1500){const y=H*.76-rel*.047,s=clamp(1.05-rel/3200,.55,1);carDraw(W/2+lanes[q.lane]*r*.75,y,q.c,s)}}const px=W/2+car.x;carDraw(px,H*.76,'#25d8ff',1,car.vx*.0012);if(input.n&&nitro>0){ctx.fillStyle='#ff9c27';ctx.beginPath();ctx.moveTo(px-13,H*.81);ctx.lineTo(px,H*.81+68+Math.random()*12);ctx.lineTo(px+13,H*.81);ctx.fill()}if(shake>0){ctx.strokeStyle='#ff4b35';ctx.lineWidth=6;ctx.strokeRect(5,5,W-10,H-10)}}function update(dt){const steer=(input.r?1:0)-(input.l?1:0),boost=input.n&&nitro>0;if(boost)nitro=Math.max(0,nitro-38*dt);else nitro=Math.min(100,nitro+9*dt);const target=boost?550:420;if(car.speed<target)car.speed+=car.accel*dt;else car.speed-=car.drag*dt;car.speed=clamp(car.speed,0,target);car.vx+=steer*720*dt*(.35+car.speed/420);car.vx*=Math.max(0,1-car.grip*dt);car.x+=car.vx*dt;const limit=rw()*.39;if(Math.abs(car.x)>limit){car.x=clamp(car.x,-limit,limit);car.vx*=-.5;car.speed*=.75;shake=.2}dist+=car.speed*dt;for(const q of traffic){q.z-=q.v*dt;if(q.z<dist-250){q.z=dist+1100+Math.random()*1000;let choices=lanes.map((_,i)=>i);choices=choices.filter(i=>Math.abs(lanes[i]*rw()*.75-car.x)>90);q.lane=choices.length?choices[Math.floor(Math.random()*choices.length)]:Math.floor(Math.random()*3);q.v=165+Math.random()*55}const rel=q.z-dist;const targetX=lanes[q.lane]*rw()*.75;if(Math.abs(rel)<92&&Math.abs(car.x-targetX)<58){gameOver('Your car hit traffic.');return}}if(dist>=2800){dist-=2800;lap++;if(lap>3){running=false;$('menu').classList.remove('hide');$('title').textContent='🏆 FINISH!';$('msg').textContent='Race complete — press START RACE to play again.'}}$('lap').textContent=lap+'/3';$('speed').textContent=Math.round(car.speed*.31);shake=Math.max(0,shake-dt)}function loop(now){if(!running){draw();return}const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}draw()})();</script></body></html>
