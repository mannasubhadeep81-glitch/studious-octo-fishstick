<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V33</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:system-ui,sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;top:9px;left:0;right:0;display:flex;justify-content:space-between;padding:0 9px;z-index:3;font-weight:900}.p{background:#071827dd;border:1px solid #ffffff33;border-radius:12px;padding:7px 9px}.controls{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;z-index:4}.btn{width:74px;height:62px;border:1px solid #ffffff55;border-radius:18px;background:#071827dd;color:#fff;font-size:29px;font-weight:900;touch-action:none}.steer{display:flex;gap:10px}.nitro{width:102px;border-radius:50%;background:#0876bd;border:4px solid #63d9ff;font-size:12px}.menu{position:fixed;inset:0;display:grid;place-items:center;background:#020711bb;z-index:8}.card{width:min(430px,88vw);padding:25px;border-radius:25px;text-align:center;background:#102c4d;border:1px solid #5bcfff66}.card button{width:100%;height:56px;border:0;border-radius:15px;background:#159fe8;color:#fff;font-size:18px;font-weight:900}.hide{display:none!important}.result{font-size:19px;font-weight:900;margin:12px 0}.small{opacity:.8;font-size:13px}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="p">🔴 YOU <b id="you">0</b> km/h</span><span class="p">🏁 <b id="lap">1/3</b></span><span class="p">🔵 LUMIRA AI <b id="ai">0</b> km/h</span></div><div class="controls"><div class="steer"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><button class="btn nitro" id="nitro">⚡<br>NITRO</button></div><div id="menu" class="menu"><div class="card"><h1 id="title">🏎️ YOU vs LUMIRA AI</h1><p id="sub">V33 • independent speed physics</p><div id="result" class="result hide"></div><button id="start">▶ START DUEL</button><p class="small">🔴 You • 🔵 Lumira AI<br>Each car has its own speed. Nitro creates real acceleration.</p></div></div><script>(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const inp={l:0,r:0,n:0};const you={x:-.13,vx:0,s:0,dist:0},ai={x:.13,vx:0,s:0,dist:0};let run=0,last=0,tilt=0,tiltOn=0,nitro=100,aiBoostTimer=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const road=()=>Math.min(W*.82,760);const TRACK=12600;const CAR_HALF_X=.075,CAR_HALF_Z=105;function reset(){you.x=-.13;you.vx=0;you.s=0;you.dist=0;ai.x=.13;ai.vx=0;ai.s=0;ai.dist=0;nitro=100;aiBoostTimer=0}async function tiltPermission(){try{if(typeof DeviceOrientationEvent!='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')tiltOn=(await DeviceOrientationEvent.requestPermission())==='granted';else if(typeof DeviceOrientationEvent!='undefined')tiltOn=true}catch(e){tiltOn=false}}function end(title,text){run=0;$('menu').classList.remove('hide');$('title').textContent=title;$('sub').textContent=text;$('result').classList.remove('hide');$('result').textContent=title.includes('CRASH')?'🚗 Actual car-body contact detected':'🏁 Race result recorded';$('start').textContent='↻ PLAY AGAIN'}function start(){reset();run=1;$('menu').classList.add('hide');last=performance.now();requestAnimationFrame(loop);tiltPermission()}$('start').onclick=start;[['left','l'],['right','r'],['nitro','n']].forEach(([id,k])=>{let e=$(id);e.onpointerdown=x=>{x.preventDefault();inp[k]=1};['pointerup','pointercancel','pointerleave'].forEach(t=>e.addEventListener(t,()=>inp[k]=0))});addEventListener('deviceorientation',e=>{if(tiltOn&&e.gamma!=null)tilt=clamp(e.gamma/28,-1,1)});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')inp.l=1;if(e.key==='ArrowRight')inp.r=1;if(e.code==='Space')inp.n=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')inp.l=0;if(e.key==='ArrowRight')inp.r=0;if(e.code==='Space')inp.n=0});function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}function car(x,y,col,s=1){g.save();g.translate(x,y);g.scale(s,s);g.shadowColor='#000b';g.shadowBlur=12;g.shadowOffsetY=7;g.fillStyle='#05080c';rr(-34,-24,68,48,11);g.fill();g.shadowColor='transparent';g.fillStyle=col;rr(-29,-21,58,42,9);g.fill();g.fillStyle='#071522';rr(-18,-15,36,17,6);g.fill();g.fillStyle='#a8efff';g.globalAlpha=.7;rr(-14,-12,28,9,4);g.fill();g.globalAlpha=1;g.fillStyle='#111';[-34,26].forEach(x=>{rr(x,-17,8,13,4);g.fill();rr(x,5,8,13,4);g.fill()});g.restore()}function draw(){g.clearRect(0,0,W,H);let h=H*.30,r=road(),sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#4fc9ff');sky.addColorStop(1,'#e0f7ff');g.fillStyle=sky;g.fillRect(0,0,W,h);g.fillStyle='#668ea1';g.beginPath();g.moveTo(0,h);g.lineTo(W*.22,h-150);g.lineTo(W*.42,h);g.lineTo(W*.65,h-170);g.lineTo(W,h);g.lineTo(W,H);g.lineTo(0,H);g.fill();g.fillStyle='#167d48';g.fillRect(0,h,W,H-h);let top=r*.28,bot=r*.58;g.fillStyle='#353b42';g.beginPath();g.moveTo(W/2-top,h);g.lineTo(W/2+top,h);g.lineTo(W/2+bot,H);g.lineTo(W/2-bot,H);g.closePath();g.fill();for(let side of[-1,1]){g.strokeStyle='#d9383d';g.lineWidth=13;g.beginPath();g.moveTo(W/2+side*top,h);g.lineTo(W/2+side*bot,H);g.stroke();g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();g.moveTo(W/2+side*(top+9),h);g.lineTo(W/2+side*(bot+8),H);g.stroke()}g.strokeStyle='#f4e75d';g.lineWidth=4;g.setLineDash([30,28]);g.lineDashOffset=-(you.dist%58);for(let i=0;i<2;i++){let x=W/2-r*.30+r*.60*i;g.beginPath();g.moveTo(x,h);g.lineTo(x,H);g.stroke()}g.setLineDash([]);const gap=ai.dist-you.dist;if(gap>0&&gap<2300){const t=clamp(gap/2300,0,1),ay=H*.79-t*H*.48;const perspective=.72-.20*t;const ax=W/2+ai.x*r*perspective;const scale=1.12-.35*t;car(ax,ay,'#168cff',scale)}else if(gap<0&&gap>-900){const t=clamp((-gap)/900,0,1);const ay=H*.79+t*H*.22;const ax=W/2+ai.x*r*.72;const scale=1.12-.20*t;if(ay<H+70)car(ax,ay,'#168cff',scale)}car(W/2+you.x*r*.70,H*.79,'#ef2630',1.25);if(inp.n&&nitro>0){g.fillStyle='#ff9f20';g.beginPath();g.moveTo(W/2+you.x*r*.70-13,H*.81);g.lineTo(W/2+you.x*r*.70,H*.81+62);g.lineTo(W/2+you.x*r*.70+13,H*.81);g.fill()}}function update(dt){const steer=tiltOn?tilt:(inp.r?1:0)-(inp.l?1:0);const playerBoost=inp.n&&nitro>0;if(playerBoost)nitro=Math.max(0,nitro-42*dt);else nitro=Math.min(100,nitro+10*dt);const playerMax=playerBoost?570:440;const playerAccel=playerBoost?560:315;you.s=clamp(you.s+(you.s<playerMax?playerAccel:-90)*dt,0,playerMax);you.vx+=steer*720*dt*(.45+you.s/440);you.vx*=Math.max(0,1-7*dt);you.x=clamp(you.x+you.vx*dt,-.36,.36);you.dist+=you.s*dt;aiBoostTimer=(aiBoostTimer+dt)%5;const aiUsingBoost=aiBoostTimer>3.4;const aiMax=aiUsingBoost?570:440;const aiAccel=aiUsingBoost?560:315;let target=aiMax;if(ai.dist>you.dist+450)target=390;if(ai.dist<you.dist-450)target=aiMax;ai.s=clamp(ai.s+(ai.s<target?aiAccel:-90)*dt,0,aiMax);ai.dist+=ai.s*dt;ai.x=.13+Math.sin(ai.dist/430)*.14;const depth=Math.abs(ai.dist-you.dist),lateral=Math.abs(you.x-ai.x);if(depth<CAR_HALF_Z*2&&lateral<CAR_HALF_X*2){end('💥 GAME OVER','The two cars touched');return}const lap=Math.min(3,Math.floor(you.dist/4200)+1);$('lap').textContent=lap+'/3';$('you').textContent=Math.round(you.s*.31);$('ai').textContent=Math.round(ai.s*.31);if(you.dist>=TRACK||ai.dist>=TRACK){if(you.dist>=TRACK&&you.dist>=ai.dist)end('🏆 YOU WIN!','You crossed the finish first');else if(ai.dist>=TRACK)end('🔵 LUMIRA AI WINS','AI crossed the finish first')}}function loop(now){if(!run)return;const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(run)requestAnimationFrame(loop)}draw()})();</script></body></html>
