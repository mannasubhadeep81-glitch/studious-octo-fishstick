<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V15</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111f;font-family:system-ui;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;gap:7px;font-weight:900;pointer-events:none}.pill{background:#07111fee;border:1px solid #ffffff44;border-radius:12px;padding:7px 10px}.controls{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}.controls div{display:flex;gap:9px}.control{pointer-events:auto;width:68px;height:60px;border:1px solid #ffffff55;border-radius:17px;background:#07111ee8;color:#fff;font-size:25px;font-weight:900;touch-action:none}.nitro{width:100px;background:#a93c18}.menu{position:fixed;inset:0;display:grid;place-items:center;background:#02060dcc}.card{width:min(430px,88vw);padding:24px;border-radius:24px;text-align:center;background:#0b1a31;border:1px solid #43d9ff66;box-shadow:0 20px 70px #000}.card button{width:100%;height:56px;margin-top:10px;border:0;border-radius:15px;background:#1597ff;color:white;font-size:18px;font-weight:900}.hide{display:none!important}.small{opacity:.78;font-size:12px}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="pill">🏎️ LUMIRA V15</span><span class="pill">⚡ <span id="speed">0</span> km/h</span><span class="pill">🏁 <span id="lap">1/3</span></span></div><div class="controls"><div><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div><button class="control nitro" id="nitro">NITRO</button></div><div id="menu" class="menu"><div class="card"><h1>🏁 LUMIRA RACING</h1><p>Arcade physics • traffic • nitro • mobile controls</p><button id="start">▶ START RACE</button><p id="msg" class="small">Acceleration, grip, steering inertia and collision physics enabled.</p></div></div><script>(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d');let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const $=id=>document.getElementById(id);let running=false,last=0,t=0,dist=0,lap=1,nitroEnergy=100,shake=0;const car={x:0,vx:0,speed:0,max:420,accel:310,drag:90,grip:7};const input={l:false,r:false,n:false};const traffic=[{lane:-.23,z:650,v:180,c:'#ff3b5c'},{lane:.23,z:1150,v:205,c:'#ffd34d'},{lane:0,z:1750,v:220,c:'#9b72ff'}];function roadWidth(){return Math.min(W*.76,700)}function start(){running=true;dist=0;lap=1;car.x=0;car.vx=0;car.speed=0;nitroEnergy=100;traffic[0].z=650;traffic[1].z=1150;traffic[2].z=1750;$('menu').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}$('start').addEventListener('click',start);function bind(id,k){const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();input[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>e.addEventListener(ev,()=>input[k]=false))}bind('left','l');bind('right','r');bind('nitro','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')input.l=true;if(e.key==='ArrowRight')input.r=true;if(e.code==='Space')input.n=true;if(e.code==='Enter'&&!running)start()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')input.l=false;if(e.key==='ArrowRight')input.r=false;if(e.code==='Space')input.n=false});function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function carDraw(x,y,col,scale=1,tilt=0){ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.scale(scale,scale);ctx.fillStyle='#080b10';ctx.fillRect(-24,-39,48,78);ctx.fillStyle=col;ctx.fillRect(-19,-35,38,70);ctx.fillStyle='#092033';ctx.fillRect(-13,-20,26,20);ctx.fillStyle='#eefcff';ctx.fillRect(-15,10,30,11);ctx.fillStyle='#090b10';ctx.fillRect(-25,-25,-6,18);ctx.fillRect(19,-25,6,18);ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);const horizon=H*.18,r=roadWidth();ctx.fillStyle='#2d8ab4';ctx.fillRect(0,0,W,horizon);ctx.fillStyle='#1d6d3d';ctx.fillRect(0,horizon,W,H-horizon);ctx.fillStyle='#30343b';ctx.beginPath();ctx.moveTo(W/2-r*.54,horizon);ctx.lineTo(W/2+r*.54,horizon);ctx.lineTo(W/2+r*.44,H);ctx.lineTo(W/2-r*.44,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#f7e57a';ctx.lineWidth=4;ctx.setLineDash([32,28]);ctx.lineDashOffset=-(dist%60);for(let i=1;i<3;i++){const xx=W/2-r*.42+r*.28*i;ctx.beginPath();ctx.moveTo(xx,horizon);ctx.lineTo(xx,H);ctx.stroke()}ctx.setLineDash([]);for(const q of traffic){let rel=q.z-dist;while(rel<-1400)rel+=2800;while(rel>1400)rel-=2800;let y=H*.76-rel*.045;if(y>horizon-50&&y<H+80)carDraw(W/2+q.lane*r*.75,y,q.c,.8)}carDraw(W/2+car.x,H*.76,'#25d8ff',1,car.vx*.0015);if(input.n&&nitroEnergy>0){ctx.fillStyle='#ff9c27';ctx.beginPath();ctx.moveTo(W/2+car.x-13,H*.81);ctx.lineTo(W/2+car.x,H*.81+70+Math.random()*14);ctx.lineTo(W/2+car.x+13,H*.81);ctx.fill()}if(shake>0){ctx.strokeStyle='#ff5a36';ctx.lineWidth=5;ctx.strokeRect(5,5,W-10,H-10)}}function update(dt){t+=dt;const steer=(input.r?1:0)-(input.l?1:0);const boost=input.n&&nitroEnergy>0;if(boost)nitroEnergy=Math.max(0,nitroEnergy-35*dt);else nitroEnergy=Math.min(100,nitroEnergy+8*dt);const target=boost?car.max+130:car.max;if(car.speed<target)car.speed+=car.accel*dt;else car.speed-=car.drag*dt;if(car.speed>target)car.speed-=460*dt;car.speed=clamp(car.speed,0,target);car.vx+=steer*720*dt*(.35+car.speed/car.max);car.vx*=Math.max(0,1-car.grip*dt);car.x+=car.vx*dt;const limit=roadWidth()*.39;if(Math.abs(car.x)>limit){car.x=clamp(car.x,-limit,limit);car.vx*=-.42;car.speed*=.82;shake=.18}dist+=car.speed*dt;for(const q of traffic){q.z-=(car.speed-q.v)*dt;if(q.z<80){const targetX=q.lane*roadWidth()*.75;if(Math.abs(car.x-targetX)<62){car.speed*=.55;car.vx+=(car.x<targetX?-1:1)*150;shake=.22}q.z=1900+Math.random()*900;q.lane=[-.28,0,.28][Math.floor(Math.random()*3)];q.v=160+Math.random()*100}}if(dist>=2800){dist-=2800;lap++;if(lap>3){lap=3;running=false;$('menu').classList.remove('hide');$('msg').textContent='🏆 FINISH! Press START RACE to race again.'}}$('lap').textContent=lap+'/3';$('speed').textContent=Math.round(car.speed*.31);shake=Math.max(0,shake-dt)}function loop(now){if(!running){draw();return}const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}draw()})();</script></body></html>
