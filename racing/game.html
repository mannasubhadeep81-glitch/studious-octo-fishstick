<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V34</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#07111d;color:#fff;font-family:system-ui,sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;top:9px;left:0;right:0;display:flex;justify-content:space-between;gap:5px;padding:0 9px;z-index:3;font-weight:900;font-size:12px}.p{background:#071827e8;border:1px solid #ffffff33;border-radius:12px;padding:7px 9px}.controls{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 12px;z-index:4}.steer{display:flex;gap:9px}.btn{width:72px;height:60px;border:1px solid #ffffff55;border-radius:18px;background:#071827e8;color:#fff;font-size:28px;font-weight:900;touch-action:none}.nitro{width:104px;border-radius:50%;background:#0876bd;border:4px solid #63d9ff;font-size:12px}.menu{position:fixed;inset:0;display:grid;place-items:center;background:#020711bb;z-index:8}.card{width:min(430px,86vw);padding:24px;border-radius:24px;text-align:center;background:#102c4d;border:1px solid #5bcfff66;box-shadow:0 18px 60px #0008}.card button{width:100%;height:56px;border:0;border-radius:15px;background:#159fe8;color:#fff;font-size:18px;font-weight:900}.hide{display:none!important}.result{font-size:19px;font-weight:900;margin:12px 0}.small{opacity:.8;font-size:13px;line-height:1.5}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="p">🔴 YOU <b id="you">0</b> km/h</span><span class="p">🏁 <b id="lap">1/3</b></span><span class="p">🔵 AI <b id="ai">0</b> km/h</span></div><div class="controls"><div class="steer"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><button class="btn nitro" id="nitro">⚡<br>NITRO</button></div><div id="menu" class="menu"><div class="card"><h1 id="title">🏎️ YOU vs LUMIRA AI</h1><p id="sub">V34 • real speed + collision physics</p><div id="result" class="result hide"></div><button id="start">▶ START DUEL</button><p class="small">🔴 Your car • 🔵 AI car<br>Touch ◀ ▶ or tilt your phone. Nitro gives extra acceleration. Cars cannot pass through each other.</p></div></div><script>(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),$=id=>document.getElementById(id);let W=0,H=0,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const inp={l:0,r:0,n:0};const you={x:-.14,vx:0,s:0,dist:0},ai={x:.14,vx:0,s:0,dist:0};let run=0,last=0,tilt=0,tiltOn=false,nitro=100,aiBoost=0,aiNextBoost=4;const TRACK=12600,LAP=4200,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function reset(){you.x=-.14;you.vx=0;you.s=0;you.dist=0;ai.x=.14;ai.vx=0;ai.s=0;ai.dist=0;nitro=100;aiBoost=0;aiNextBoost=3.5}async function requestTilt(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){tiltOn=(await DeviceOrientationEvent.requestPermission())==='granted'}else{tiltOn='DeviceOrientationEvent'in window}}catch(e){tiltOn=false}}function end(title,text){run=0;$('menu').classList.remove('hide');$('title').textContent=title;$('sub').textContent=text;$('result').classList.remove('hide');$('result').textContent=title.includes('CRASH')?'💥 Actual body-to-body collision':'🏁 Finish order recorded';$('start').textContent='↻ PLAY AGAIN'}function start(){reset();run=1;$('menu').classList.add('hide');last=performance.now();requestTilt();requestAnimationFrame(loop)}$('start').onclick=start;[['left','l'],['right','r'],['nitro','n']].forEach(([id,k])=>{const e=$(id);e.onpointerdown=a=>{a.preventDefault();a.stopPropagation();inp[k]=1};['pointerup','pointercancel','pointerleave'].forEach(t=>e.addEventListener(t,()=>inp[k]=0))});addEventListener('deviceorientation',e=>{if(tiltOn&&e.gamma!=null)tilt=clamp(e.gamma/28,-1,1)});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')inp.l=1;if(e.key==='ArrowRight')inp.r=1;if(e.code==='Space')inp.n=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')inp.l=0;if(e.key==='ArrowRight')inp.r=0;if(e.code==='Space')inp.n=0});c.addEventListener('pointerdown',e=>{if(!run)return;const r=c.getBoundingClientRect();inp.l=e.clientX<r.left+r.width*.43?1:0;inp.r=e.clientX>r.left+r.width*.57?1:0});c.addEventListener('pointermove',e=>{if(!run||e.buttons===0)return;const r=c.getBoundingClientRect();inp.l=e.clientX<r.left+r.width*.43?1:0;inp.r=e.clientX>r.left+r.width*.57?1:0});['pointerup','pointercancel'].forEach(t=>c.addEventListener(t,()=>{inp.l=inp.r=0}));function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}function car(x,y,col,s=1){g.save();g.translate(x,y);g.scale(s,s);g.shadowColor='#000b';g.shadowBlur=13;g.shadowOffsetY=8;g.fillStyle='#05080c';rr(-38,-27,76,54,12);g.fill();g.shadowColor='transparent';g.fillStyle=col;rr(-32,-24,64,48,10);g.fill();g.fillStyle='#071522';rr(-20,-18,40,19,7);g.fill();g.fillStyle='#b9f2ff';g.globalAlpha=.72;rr(-15,-14,30,10,4);g.fill();g.globalAlpha=1;g.fillStyle='#111';[-38,30].forEach(x=>{rr(x,-19,9,15,4);g.fill();rr(x,4,9,15,4);g.fill()});g.fillStyle='#fff';g.globalAlpha=.75;g.fillRect(-26,20,52,3);g.restore()}function draw(){g.clearRect(0,0,W,H);const skyH=H*.30,r=Math.min(W*.86,780),top=r*.27,bot=r*.59;let sky=g.createLinearGradient(0,0,0,skyH);sky.addColorStop(0,'#39bfff');sky.addColorStop(1,'#d8f5ff');g.fillStyle=sky;g.fillRect(0,0,W,skyH);g.fillStyle='#4e8498';g.beginPath();g.moveTo(0,skyH);g.lineTo(W*.22,skyH-120);g.lineTo(W*.40,skyH);g.lineTo(W*.65,skyH-150);g.lineTo(W,skyH);g.lineTo(W,H);g.lineTo(0,H);g.fill();g.fillStyle='#167845';g.fillRect(0,skyH,W,H-skyH);g.fillStyle='#30363d';g.beginPath();g.moveTo(W/2-top,skyH);g.lineTo(W/2+top,skyH);g.lineTo(W/2+bot,H);g.lineTo(W/2-bot,H);g.closePath();g.fill();for(const side of[-1,1]){g.strokeStyle='#d83b46';g.lineWidth=12;g.beginPath();g.moveTo(W/2+side*top,skyH);g.lineTo(W/2+side*bot,H);g.stroke()}g.strokeStyle='#f7e95e';g.lineWidth=4;g.setLineDash([28,27]);g.lineDashOffset=-(you.dist%55);for(let i=0;i<2;i++){const x=W/2-r*.30+r*.60*i;g.beginPath();g.moveTo(x,skyH);g.lineTo(x,H);g.stroke()}g.setLineDash([]);const gap=ai.dist-you.dist;let ay=H*.78-gap*.48;let ax=W/2+ai.x*r*.70;if(ay>-90&&ay<H+90){const scale=clamp(1.18-Math.abs(gap)/2600*.22,.90,1.18);car(ax,ay,'#168cff',scale)}const py=H*.78,px=W/2+you.x*r*.70;car(px,py,'#ef2630',1.42);if(inp.n&&nitro>0){g.fillStyle='#ff9f20';g.beginPath();g.moveTo(px-14,py+29);g.lineTo(px,py+88);g.lineTo(px+14,py+29);g.fill();g.fillStyle='#fff5a0';g.beginPath();g.moveTo(px-6,py+29);g.lineTo(px,py+65);g.lineTo(px+6,py+29);g.fill()}}function update(dt){const manual=(inp.r?1:0)-(inp.l?1:0);const steer=tiltOn&&Math.abs(tilt)>.08?tilt:manual;const boost=inp.n&&nitro>0;if(boost)nitro=Math.max(0,nitro-38*dt);else nitro=Math.min(100,nitro+9*dt);const pMax=boost?570:440,pAcc=boost?650:360;you.s=clamp(you.s+(you.s<pMax?pAcc:-150)*dt,0,pMax);you.vx+=steer*820*dt*(.55+you.s/500);you.vx*=Math.max(0,1-7.5*dt);you.x=clamp(you.x+you.vx*dt,-.39,.39);you.dist+=you.s*dt;aiNextBoost-=dt;if(aiNextBoost<=0){aiBoost=2.1;aiNextBoost=5.2+Math.random()*2.8}if(aiBoost>0)aiBoost-=dt;const aiMax=aiBoost>0?535:410,aiAcc=aiBoost>0?610:300;ai.s=clamp(ai.s+(ai.s<aiMax?aiAcc:-120)*dt,0,aiMax);ai.dist+=ai.s*dt;ai.x=.14+Math.sin(ai.dist/520)*.16;const dz=Math.abs(ai.dist-you.dist),dx=Math.abs(ai.x-you.x);if(dz<122&&dx<.145){end('💥 GAME OVER','Your car touched the AI car');return}$('lap').textContent=Math.min(3,Math.floor(you.dist/LAP)+1)+'/3';$('you').textContent=Math.round(you.s);$('ai').textContent=Math.round(ai.s);if(you.dist>=TRACK||ai.dist>=TRACK){if(you.dist>=TRACK&&you.dist>ai.dist)end('🏆 YOU WIN!','You crossed the finish first');else end('🔵 LUMIRA AI WINS','AI crossed the finish first')}}function loop(now){if(!run)return;const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(run)requestAnimationFrame(loop)}draw()})();</script></body></html>
