<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V36</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;color:#fff;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 8px;z-index:4;font-size:12px;font-weight:900}.pill{background:#071827ee;border:1px solid #ffffff33;border-radius:12px;padding:7px 9px}.controls{position:fixed;left:0;right:0;bottom:10px;display:flex;justify-content:space-between;align-items:end;padding:0 12px;z-index:5}.steer{display:flex;gap:10px}.btn{width:70px;height:58px;border:1px solid #ffffff55;border-radius:18px;background:#071827e8;color:#fff;font-size:28px;font-weight:900;touch-action:none}.nitro{width:104px;border-radius:50%;background:#0876bd;border:4px solid #63d9ff;font-size:12px}.menu{position:fixed;inset:0;display:grid;place-items:center;background:#020711aa;z-index:9}.card{width:min(430px,86vw);padding:23px;border-radius:24px;text-align:center;background:#102c4d;border:1px solid #5bcfff66;box-shadow:0 18px 60px #0008}.card button{width:100%;height:56px;border:0;border-radius:15px;background:#159fe8;color:#fff;font-size:18px;font-weight:900}.hide{display:none!important}.result{font-size:19px;font-weight:900;margin:12px 0}.small{opacity:.8;font-size:13px;line-height:1.45}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="pill">🔴 YOU <b id="you">0</b> km/h</span><span class="pill">🏁 <b id="lap">1/3</b></span><span class="pill">🔵 AI <b id="ai">0</b> km/h</span></div><div class="controls"><div class="steer"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><button class="btn nitro" id="nitro">⚡<br>NITRO</button></div><div id="menu" class="menu"><div class="card"><h1 id="title">🏎️ YOU vs LUMIRA AI</h1><p id="sub">V37 • dynamic physics + independent AI</p><div id="result" class="result hide"></div><button id="start">▶ START DUEL</button><p class="small">AI drives independently: accelerates, brakes, overtakes and can win the race. No forced same-speed rubber band.</p></div></div><script>(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,D;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const inp={l:false,r:false,n:false};const player={x:-.05,vx:0,speed:0,dist:0};const rival={x:.22,vx:0,speed:0,dist:90};const TRACK=12600,LAP=4200,CAR_W=.12,CAR_L=92;let running=false,last=0,nitro=100,tilt=0,tiltOK=false,aiMood=0,aiCooldown=0,hitFlash=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function reset(){Object.assign(player,{x:-.05,vx:0,speed:0,dist:0});Object.assign(rival,{x:.22,vx:0,speed:0,dist:90});nitro=100;tilt=0;aiMood=0;aiCooldown=0;hitFlash=0}async function enableTilt(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')tiltOK=(await DeviceOrientationEvent.requestPermission())==='granted';else tiltOK='DeviceOrientationEvent'in window}catch(e){tiltOK=false}}function finish(title,reason){running=false;$('menu').classList.remove('hide');$('title').textContent=title;$('sub').textContent=reason;$('result').classList.remove('hide');$('result').textContent=title.includes('CRASH')?'💥 BODY COLLISION':'🏁 FINISH LINE';$('start').textContent='↻ PLAY AGAIN'}function start(){reset();running=true;$('menu').classList.add('hide');last=performance.now();enableTilt();requestAnimationFrame(loop)}$('start').onclick=start;[['left','l'],['right','r'],['nitro','n']].forEach(([id,key])=>{const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();inp[key]=true});['pointerup','pointercancel','pointerleave'].forEach(t=>e.addEventListener(t,()=>inp[key]=false))});addEventListener('deviceorientation',e=>{if(tiltOK&&e.gamma!=null)tilt=clamp(e.gamma/25,-1,1)});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')inp.l=true;if(e.key==='ArrowRight')inp.r=true;if(e.code==='Space')inp.n=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')inp.l=false;if(e.key==='ArrowRight')inp.r=false;if(e.code==='Space')inp.n=false});let drag=false;c.addEventListener('pointerdown',()=>{if(running)drag=true});c.addEventListener('pointermove',e=>{if(!running||!drag)return;const r=c.getBoundingClientRect();player.x=clamp(((e.clientX-r.left)/r.width-.5)*1.15,-.43,.43);player.vx=0});['pointerup','pointercancel'].forEach(t=>c.addEventListener(t,()=>drag=false));function rounded(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}function drawCar(x,y,color,scale=1){g.save();g.translate(x,y);g.scale(scale,scale);g.shadowColor='#000b';g.shadowBlur=14;g.shadowOffsetY=8;g.fillStyle='#05080c';rounded(-34,-46,68,92,13);g.fill();g.shadowColor='transparent';g.fillStyle=color;rounded(-29,-42,58,84,11);g.fill();g.fillStyle='#071522';rounded(-19,-32,38,28,7);g.fill();g.fillStyle='#b9f2ff';g.globalAlpha=.72;rounded(-14,-28,28,15,4);g.fill();g.globalAlpha=1;g.fillStyle='#111';for(const yy of[-33,18]){rounded(-34,yy,9,17,4);g.fill();rounded(25,yy,9,17,4);g.fill()}g.fillStyle='#fff';g.globalAlpha=.7;g.fillRect(-22,34,44,3);g.restore()}function draw(){g.clearRect(0,0,W,H);const horizon=H*.27;let sky=g.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#35bdf5');sky.addColorStop(1,'#d9f5ff');g.fillStyle=sky;g.fillRect(0,0,W,horizon);g.fillStyle='#4c879b';g.beginPath();g.moveTo(0,horizon);g.lineTo(W*.25,horizon-90);g.lineTo(W*.45,horizon);g.lineTo(W*.70,horizon-120);g.lineTo(W,horizon);g.lineTo(W,H);g.lineTo(0,H);g.fill();g.fillStyle='#167845';g.fillRect(0,horizon,W,H-horizon);const top=W*.16,bot=W*.36;g.fillStyle='#30363d';g.beginPath();g.moveTo(W/2-top,horizon);g.lineTo(W/2+top,horizon);g.lineTo(W/2+bot,H);g.lineTo(W/2-bot,H);g.closePath();g.fill();g.strokeStyle='#d83b46';g.lineWidth=9;for(const side of[-1,1]){g.beginPath();g.moveTo(W/2+side*top,horizon);g.lineTo(W/2+side*bot,H);g.stroke()}g.strokeStyle='#f7e95e';g.lineWidth=4;g.setLineDash([25,25]);g.lineDashOffset=-(player.dist%50);for(const x of[W/2-W*.17,W/2+W*.17]){g.beginPath();g.moveTo(x,horizon);g.lineTo(x,H);g.stroke()}g.setLineDash([]);const rel=rival.dist-player.dist,roadHalf=W*.36,playerY=H*.78,rivalY=playerY-rel*.22,rivalX=W/2+rival.x*roadHalf,playerX=W/2+player.x*roadHalf;if(rivalY>-130&&rivalY<H+130){const perspective=clamp(1.18-Math.abs(rel)/2600*.18,.88,1.18);drawCar(rivalX,rivalY,'#168cff',perspective)}drawCar(playerX,playerY,'#ef2630',1.18);if(inp.n&&nitro>0){g.fillStyle='#ff9f20';g.beginPath();g.moveTo(playerX-12,playerY+49);g.lineTo(playerX,playerY+105);g.lineTo(playerX+12,playerY+49);g.fill();g.fillStyle='#fff5a0';g.beginPath();g.moveTo(playerX-5,playerY+49);g.lineTo(playerX,playerY+82);g.lineTo(playerX+5,playerY+49);g.fill()}if(hitFlash>0){g.fillStyle='rgba(255,40,40,'+Math.min(.32,hitFlash)+')';g.fillRect(0,0,W,H)}}function update(dt){const manual=(inp.r?1:0)-(inp.l?1:0),steer=tiltOK&&Math.abs(tilt)>.08?tilt:manual,boosting=inp.n&&nitro>0;if(boosting)nitro=Math.max(0,nitro-35*dt);else nitro=Math.min(100,nitro+10*dt);const pMax=boosting?360:235,pAcc=boosting?430:250;const pDrag=boosting?34:52;player.speed+=((player.speed<pMax?pAcc:0)-pDrag)*dt;player.speed=clamp(player.speed,0,pMax);player.vx+=steer*4.2*dt;player.vx*=Math.pow(.0025,dt);if(!drag)player.x=clamp(player.x+player.vx*dt,-.43,.43);if(Math.abs(player.x)>.40)player.speed=Math.max(0,player.speed-65*dt);player.dist+=player.speed*dt;const ahead=player.dist-rival.dist;const sameLane=Math.abs(player.x-rival.x)<.18;aiCooldown-=dt;if(aiCooldown<=0){aiCooldown=2.2+Math.random()*2.8;aiMood=Math.random()<.62?1:Math.random()<.55?-1:0}const roadRisk=Math.abs(rival.x)>.38;const playerNear=sameLane&&Math.abs(ahead)<850;let targetSpeed=258;if(aiMood>0)targetSpeed+=18;if(aiMood<0)targetSpeed-=12;if(roadRisk)targetSpeed-=75;if(playerNear&&ahead>0)targetSpeed-=18;if(ahead>650)targetSpeed+=8;if(ahead<-650)targetSpeed+=6;targetSpeed=clamp(targetSpeed,155,292);const accel=targetSpeed>rival.speed?230:340;rival.speed+=Math.sign(targetSpeed-rival.speed)*accel*dt;rival.speed=clamp(rival.speed,0,300);const obstacleBias=playerNear?(rival.x<=player.x?1:-1):0;const desiredX=clamp(.12+Math.sin(rival.dist/680)*.13+obstacleBias*.30,-.40,.40);const laneSteer=clamp(desiredX-rival.x,-1.25*dt,1.25*dt);rival.vx+=laneSteer*4.8;rival.vx*=Math.pow(.003,dt);rival.x=clamp(rival.x+rival.vx*dt,-.42,.42);if(Math.abs(rival.x)>0.40)rival.speed=Math.max(0,rival.speed-70*dt);rival.dist+=rival.speed*dt;const dz=rival.dist-player.dist,dx=Math.abs(rival.x-player.x);if(Math.abs(dz)<CAR_L&&dx<CAR_W){const push=dx<.03?(player.x<=rival.x?-1:1):(player.x<rival.x?-1:1);player.vx+=push*1.8;rival.vx-=push*1.8;player.speed*=.72;rival.speed*=.78;player.dist=Math.max(0,player.dist-35);rival.dist=Math.max(0,rival.dist-20);hitFlash=.45}hitFlash=Math.max(0,hitFlash-dt);$('you').textContent=Math.round(player.speed);$('ai').textContent=Math.round(rival.speed);$('lap').textContent=Math.min(3,Math.floor(player.dist/LAP)+1)+'/3';if(player.dist>=TRACK||rival.dist>=TRACK){if(player.dist>=TRACK&&player.dist>rival.dist)finish('🏆 YOU WIN!','You reached the finish first');else finish('🔵 LUMIRA AI WINS','AI reached the finish first')}}function loop(now){if(!running)return;const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}draw()})();</script></body></html>
