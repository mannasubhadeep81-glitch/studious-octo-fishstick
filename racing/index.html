<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><title>LUMIRA Racing</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a12;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;touch-action:none}canvas{display:block;width:100%;height:100%;background:#08111c}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start;padding:max(14px,env(safe-area-inset-top)) 16px 0;text-shadow:0 2px 8px #000}.brand{font-weight:900;letter-spacing:2px;font-size:15px}.stats{display:flex;gap:10px}.stat{min-width:86px;padding:7px 10px;border:1px solid #ffffff28;border-radius:12px;background:#07101dcc;backdrop-filter:blur(10px);text-align:center}.stat small{display:block;font-size:9px;opacity:.6;letter-spacing:1px}.stat b{font-size:15px}.nitro{position:fixed;left:16px;right:16px;bottom:24px;height:11px;border:1px solid #ffffff40;border-radius:99px;background:#07101dcc;overflow:hidden;box-shadow:0 4px 20px #0008}.nitro i{display:block;height:100%;width:72%;background:linear-gradient(90deg,#24c6ff,#7b5cff,#ff4edb);box-shadow:0 0 16px #5d7cff;transition:width .08s}.controls{position:fixed;left:0;right:0;bottom:45px;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}.pad{display:flex;gap:10px}.ctrl{width:62px;height:62px;border:1px solid #ffffff35;border-radius:18px;background:#08101dcc;color:#fff;font-size:26px;font-weight:800;box-shadow:0 8px 25px #0008;backdrop-filter:blur(8px);-webkit-tap-highlight-color:transparent}.ctrl:active{transform:scale(.94);background:#ffffff22}.boost{width:82px;font-size:13px;letter-spacing:1px;background:linear-gradient(145deg,#173a66,#24165d)}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#163c64aa,#030711e8 65%);padding:24px;z-index:5}.card{width:min(520px,92vw);padding:30px;border:1px solid #ffffff25;border-radius:28px;background:#08111de8;box-shadow:0 30px 90px #000b;text-align:center;backdrop-filter:blur(18px)}h1{margin:0;font-size:clamp(38px,10vw,72px);letter-spacing:-3px;background:linear-gradient(90deg,#fff,#62c8ff,#d96dff);-webkit-background-clip:text;color:transparent}.sub{opacity:.7;line-height:1.5}.start{border:0;border-radius:15px;padding:15px 28px;font-size:16px;font-weight:900;color:#06101b;background:#fff;box-shadow:0 8px 35px #5ab9ff55}.hidden{display:none}.tip{font-size:11px;opacity:.45;margin-top:18px}.count{position:fixed;inset:0;display:grid;place-items:center;font-size:clamp(80px,22vw,180px);font-weight:1000;text-shadow:0 8px 40px #000;z-index:4;pointer-events:none}
</style></head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div class="top"><div class="brand">LUMIRA // RACING</div><div class="stats"><div class="stat"><small>SPEED</small><b id="speed">0 KM/H</b></div><div class="stat"><small>SCORE</small><b id="score">000000</b></div><div class="stat"><small>BEST</small><b id="best">000000</b></div></div></div><div class="nitro"><i id="nitro"></i></div></div>
<div class="controls"><div class="pad"><button class="ctrl" id="left">‹</button><button class="ctrl" id="right">›</button></div><button class="ctrl boost" id="boost">NITRO</button></div>
<div class="count hidden" id="count">3</div>
<div class="overlay" id="menu"><div class="card"><h1>LUMIRA</h1><h2>RACING</h2><p class="sub">A fast, cinematic 2D arcade racer with parallax scenery, traffic, nitro and responsive touch controls.</p><button class="start" id="start">START RACE</button><div class="tip">Landscape mode recommended • Tap left/right to steer • Hold NITRO to boost</div></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id);let running=false,keys={left:false,right:false,boost:false},score=0,best=+localStorage.lumiraBest||0,nitro=72,t=0,last=0,player,traffic=[],particles=[];
$('best').textContent=String(best).padStart(6,'0');
function roadX(){return W*.5}function roadW(){return Math.min(W*.76,720)}
function reset(){score=0;nitro=72;player={x:W/2,y:H*.76,w:58,h:96,tilt:0};traffic=[];particles=[];for(let i=0;i<7;i++)spawn(i);}
function spawn(i){let rw=roadW(),x=roadX()+(Math.random()-.5)*rw*.72;traffic.push({x,y:-140-i*170-Math.random()*220,w:48+Math.random()*10,h:78+Math.random()*18,s:.75+Math.random()*.45,hue:Math.random()*360})}
function car(x,y,w,h,color,playerCar=false,tilt=0){ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.shadowColor=playerCar?'#47cfff':'#000';ctx.shadowBlur=playerCar?22:10;let g=ctx.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,'#0b1020');g.addColorStop(.18,color);g.addColorStop(.5,'#fff');g.addColorStop(.58,color);g.addColorStop(1,'#090d16');ctx.fillStyle=g;round(-w/2,-h/2,w,h,13);ctx.fillStyle='#0a111b';round(-w*.34,-h*.30,w*.68,h*.28,9);ctx.fillStyle='#8edfff99';round(-w*.29,-h*.26,w*.58,h*.19,6);ctx.fillStyle='#111722';round(-w*.44,-h*.34,w*.12,h*.22,4);round(w*.32,-h*.34,w*.12,h*.22,4);round(-w*.44,h*.12,w*.12,h*.22,4);round(w*.32,h*.12,w*.12,h*.22,4);ctx.fillStyle=playerCar?'#5ff4ff':'#ff334d';ctx.fillRect(-w*.33,-h*.43,w*.66,5);ctx.fillRect(-w*.33,h*.38,w*.66,5);if(playerCar){ctx.fillStyle='#ffffff';ctx.globalAlpha=.8;ctx.fillRect(-w*.1,-h*.5,w*.2,4)}ctx.restore()}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function scenery(scroll){let horizon=H*.25;ctx.fillStyle='#07111c';ctx.fillRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#06101f');sky.addColorStop(1,'#183f62');ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);ctx.fillStyle='#b7eaff22';ctx.beginPath();ctx.arc(W*.72,H*.15,Math.min(W,H)*.06,0,7);ctx.fill();
for(let layer=0;layer<3;layer++){let base=horizon+layer*40;ctx.fillStyle=['#0c2530','#0a1d27','#08161f'][layer];for(let x=-100;x<W+150;x+=90+layer*25){let h=45+((x*13+layer*31)%90+90)%90;let xx=x-((scroll*(.12+layer*.12))%120);ctx.fillRect(xx,base-h,55+layer*12,h);if(layer===0){ctx.fillStyle='#5bc6ff20';for(let wy=base-h+15;wy<base-8;wy+=16)ctx.fillRect(xx+9,wy,4,5);ctx.fillStyle='#0c2530'}}}
ctx.fillStyle='#173629';ctx.fillRect(0,horizon,W,H-horizon);let rw=roadW(),rx=roadX();ctx.fillStyle='#d7d9d622';ctx.beginPath();ctx.moveTo(rx-rw*.58,horizon);ctx.lineTo(rx+rw*.58,horizon);ctx.lineTo(rx+rw*.5,H);ctx.lineTo(rx-rw*.5,H);ctx.closePath();ctx.fill();ctx.fillStyle='#252a33';ctx.beginPath();ctx.moveTo(rx-rw*.5,horizon);ctx.lineTo(rx+rw*.5,horizon);ctx.lineTo(rx+rw*.42,H);ctx.lineTo(rx-rw*.42,H);ctx.closePath();ctx.fill();
ctx.strokeStyle='#f6f0bd';ctx.lineWidth=4;ctx.setLineDash([34,28]);ctx.lineDashOffset=scroll%62;for(let lane=1;lane<3;lane++){let lx=rx-rw*.42+rw*.28*lane;ctx.beginPath();ctx.moveTo(lx,horizon);ctx.lineTo(lx,H);ctx.stroke()}ctx.setLineDash([]);ctx.strokeStyle='#ffcc5c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(rx-rw*.5,horizon);ctx.lineTo(rx-rw*.42,H);ctx.moveTo(rx+rw*.5,horizon);ctx.lineTo(rx+rw*.42,H);ctx.stroke();
for(let i=0;i<18;i++){let y=(i*120+scroll*.75)%H;let s=14+(i%4)*5;ctx.fillStyle='#8be6ff33';ctx.fillRect((i*97)%W,y,s,2)}}
function dust(x,y,n=2){for(let i=0;i<n;i++)particles.push({x:x+(Math.random()-.5)*25,y:y+42,vx:(Math.random()-.5)*25,vy:30+Math.random()*45,life:.35+Math.random()*.3,r:2+Math.random()*5})}
function update(dt){t+=dt;let speed=dt*420*(keys.boost&&nitro>0?1.7:1);if(keys.boost&&nitro>0)nitro=Math.max(0,nitro-dt*24);else nitro=Math.min(100,nitro+dt*5);player.x+=(keys.left?-1:0)*dt*390+(keys.right?1:0)*dt*390;let rw=roadW();player.x=Math.max(roadX()-rw*.39,Math.min(roadX()+rw*.39,player.x));player.tilt+=( ((keys.right?1:0)-(keys.left?1:0))*.12-player.tilt)*dt*8;for(let q of traffic){q.y+=speed*q.s;q.x+=Math.sin(t*1.2+q.hue)*dt*8;if(q.y>H+150){q.y=-100-Math.random()*200;q.x=roadX()+(Math.random()-.5)*rw*.72;q.s=.75+Math.random()*.5;score+=100}}for(let i=traffic.length-1;i>=0;i--){let q=traffic[i];if(Math.abs(q.x-player.x)<(q.w+player.w)*.42&&Math.abs(q.y-player.y)<(q.h+player.h)*.42){score=Math.max(0,score-250);q.y=-300-Math.random()*300;nitro=Math.max(0,nitro-20);for(let k=0;k<22;k++)particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,life:.4+Math.random()*.5,r:2+Math.random()*4})}}
dust(player.x,player.y,keys.boost?4:1);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=50*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}score+=dt*12}
function draw(){scenery(t*520);for(let q of traffic)car(q.x,q.y,q.w,q.h,'hsl('+q.hue+' 78% 56%)');for(let p of particles){ctx.globalAlpha=Math.max(0,p.life*1.5);ctx.fillStyle='#d8f7ff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;car(player.x,player.y,player.w,player.h,'#4a7dff',true,player.tilt);$('speed').textContent=Math.round(105+(keys.boost?70:0)+(Math.abs(player.x-roadX())/roadW())*18)+' KM/H';$('score').textContent=String(Math.floor(score)).padStart(6,'0');$('nitro').style.width=nitro+'%'}
function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;if(running)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function countdown(){let n=3;$('count').textContent=n;$('count').classList.remove('hidden');let iv=setInterval(()=>{n--;if(n>0)$('count').textContent=n;else if(n===0)$('count').textContent='GO!';else{$('count').classList.add('hidden');clearInterval(iv);running=true}},650)}
$('start').onclick=()=>{$('menu').classList.add('hidden');reset();running=false;countdown()};
function bind(el,k){['pointerdown','touchstart'].forEach(e=>el.addEventListener(e,ev=>{ev.preventDefault();keys[k]=true},{passive:false}));['pointerup','pointercancel','touchend','touchcancel'].forEach(e=>el.addEventListener(e,ev=>{ev.preventDefault();keys[k]=false},{passive:false}))}bind($('left'),'left');bind($('right'),'right');bind($('boost'),'boost');addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.code==='Space')keys.boost=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.code==='Space')keys.boost=false});addEventListener('blur',()=>{keys={left:false,right:false,boost:false}});
setInterval(()=>{if(running&&score>best){best=Math.floor(score);localStorage.lumiraBest=best;$('best').textContent=String(best).padStart(6,'0')}},1000);
</script></body></html>
