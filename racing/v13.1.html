<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V13.1</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#061020;color:#fff;font-family:system-ui}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px}.pill{background:#07101ddd;border:1px solid #ffffff25;border-radius:12px;padding:8px;font-weight:900}.controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}.btn{width:70px;height:58px;border-radius:17px;border:1px solid #ffffff30;background:#07101ddd;color:#fff;font-size:24px;font-weight:900}.nitro{width:94px;font-size:12px}.menu{position:fixed;inset:0;background:#020611ee;display:grid;place-items:center;z-index:5}.card{width:min(480px,88vw);padding:25px;border-radius:24px;background:#091325;border:1px solid #ffffff20;text-align:center}input{padding:11px;border-radius:11px;background:#07101d;border:1px solid #ffffff25;color:#fff;margin:5px;width:75%}.hide{display:none}.players{text-align:left}.p{padding:8px;background:#ffffff09;border-radius:9px;margin:4px}.small{opacity:.7;font-size:12px}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><span class="pill">🏎️ LUMIRA V13.1</span><span class="pill">🏁 <b id="lap">1/3</b> • <b id="pos">1st</b></span></div></div><div class="controls"><div><button class="btn" id="left">‹</button><button class="btn" id="right">›</button></div><button class="btn nitro" id="nitro">NITRO</button></div><div id="menu" class="menu"><div class="card"><h1>🏁 Multiplayer Race</h1><input id="name" maxlength="24" placeholder="Player name"><input id="room" maxlength="24" placeholder="Room code"><br><button class="btn" id="join" style="width:auto;font-size:15px">JOIN</button><button class="btn" id="ready" style="width:auto;font-size:15px" disabled>READY</button><p id="status">Create/join a room to start.</p><div id="players" class="players"></div><p class="small">2–4 players • live WebSocket race</p></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,d=1;function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();const API='https://studious-octo-fishstick-6.onrender.com';const id=localStorage.lumiraPlayerId||('p_'+crypto.randomUUID().replaceAll('-',''));localStorage.lumiraPlayerId=id;let ws,started=false,ready=false,last=0,t=0,px=W/2,prog=0,lap=1,key={l:0,r:0,n:0},remote=new Map(),players=[];const colors=['#4d82ff','#ff3d61','#a66cff','#ffd34d'];function roomUrl(){const u=new URL(API);u.protocol=u.protocol==='https:'?'wss:':'ws:';u.pathname='/ws/racing';return u.toString()}function renderPlayers(){document.getElementById('players').innerHTML=players.map(p=>`<div class="p">🏎️ ${String(p.name||'PLAYER').replace(/[<>]/g,'')} ${p.ready?'✅ READY':'⏳ WAITING'}</div>`).join('');document.getElementById('ready').disabled=!ws||ws.readyState!==1||ready}function connect(){if(ws&&ws.readyState===1)return;const room=document.getElementById('room').value.trim()||('ROOM-'+Math.random().toString(36).slice(2,7).toUpperCase());document.getElementById('room').value=room;ws=new WebSocket(roomUrl());ws.onopen=()=>{ws.send(JSON.stringify({type:'join',roomId:room,playerId:id,name:document.getElementById('name').value.trim()||'PLAYER'}));document.getElementById('status').textContent='Connected — join another device with room '+room};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'||m.type==='players'){players=m.players||[];renderPlayers();if(m.type==='joined')document.getElementById('status').textContent='Room '+room+' joined'}if(m.type==='start'){started=true;document.getElementById('menu').classList.add('hide');document.getElementById('status').textContent='GO!'}if(m.type==='state'&&m.id!==id)remote.set(m.id,{x:Number(m.x)||W/2,y:Number(m.y)||0,lap:Number(m.lap)||1,rx:Number(m.x)||W/2,ry:Number(m.y)||0,at:performance.now()});if(m.type==='finish')document.getElementById('status').textContent='Player finished: '+m.id};ws.onerror=()=>document.getElementById('status').textContent='WebSocket connection error';ws.onclose=()=>{document.getElementById('status').textContent='Disconnected — local mode';document.getElementById('ready').disabled=true}}document.getElementById('join').onclick=connect;document.getElementById('ready').onclick=()=>{ready=true;ws?.send(JSON.stringify({type:'ready',ready:true}));renderPlayers()};function bind(id,k){let e=document.getElementById(id);e.onpointerdown=()=>key[k]=1;e.onpointerup=e.onpointercancel=e.onpointerleave=()=>key[k]=0}bind('left','l');bind('right','r');bind('nitro','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')key.l=1;if(e.key==='ArrowRight')key.r=1;if(e.code==='Space')key.n=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')key.l=0;if(e.key==='ArrowRight')key.r=0;if(e.code==='Space')key.n=0});function draw(){x.fillStyle='#061020';x.fillRect(0,0,W,H);let h=H*.22;x.fillStyle='#173b4d';x.fillRect(0,0,W,h);x.fillStyle='#183b2c';x.fillRect(0,h,W,H-h);let r=Math.min(W*.72,680);x.fillStyle='#252a31';x.beginPath();x.moveTo(W/2-r*.52,h);x.lineTo(W/2+r*.52,h);x.lineTo(W/2+r*.42,H);x.lineTo(W/2-r*.42,H);x.closePath();x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.setLineDash([28,28]);x.lineDashOffset=-t*2;for(let q=1;q<3;q++){let xx=W/2-r*.42+r*.28*q;x.beginPath();x.moveTo(xx,h);x.lineTo(xx,H);x.stroke()}x.setLineDash([]);let i=0;for(const p of remote.values()){let y=H*.78-(p.y-prog)*.05;drawCar(p.x,y,colors[(i++)%colors.length])}drawCar(px,H*.78,'#42e8ff');if(key.n){x.fillStyle='#ffb52e';x.beginPath();x.moveTo(px-12,H*.83);x.lineTo(px,H*.83+50+Math.random()*15);x.lineTo(px+12,H*.83);x.fill()}}function drawCar(a,b,col){x.fillStyle='#111827';x.beginPath();x.roundRect(a-22,b-38,44,76,10);x.fill();x.fillStyle=col;x.beginPath();x.roundRect(a-18,b-34,36,68,8);x.fill();x.fillStyle='#071827';x.fillRect(a-13,b-18,26,20)}function update(dt){if(!started)return;t+=dt;let r=Math.min(W*.72,680),speed=(key.n?1.55:1)*330;px+=((key.r?1:0)-(key.l?1:0))*dt*350;px=Math.max(W/2-r*.39,Math.min(W/2+r*.39,px));prog+=speed*dt;if(prog>2800){prog-=2800;lap++;if(lap>3){lap=3;started=false;ws?.send(JSON.stringify({type:'finish',score:1000}))}}document.getElementById('lap').textContent=lap+'/3';if(ws?.readyState===1&&Math.floor(t*20)%3===0)ws.send(JSON.stringify({type:'state',x:px,y:prog,lap}))}function loop(n){let dt=Math.min(.033,(n-(last||n))/1000);last=n;for(const p of remote.values()){p.x+=(p.rx-p.x)*Math.min(1,dt*12);p.y+=(p.ry-p.y)*Math.min(1,dt*12)}update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
