<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V13.2</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#10243a;color:#fff;font-family:system-ui}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px}.pill{background:#071426ee;border:1px solid #6ee7ff66;border-radius:14px;padding:9px 12px;font-weight:900}.controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}.btn{min-width:64px;height:56px;border-radius:16px;border:1px solid #ffffff55;background:#10213aee;color:#fff;font-size:19px;font-weight:900;touch-action:manipulation}.nitro{width:96px;background:#7a2b18ee}.menu{position:fixed;inset:0;background:#020611cc;display:grid;place-items:center;z-index:5}.card{width:min(440px,84vw);padding:24px;border-radius:25px;background:#0b1930;border:1px solid #63ddff66;box-shadow:0 18px 70px #000b;text-align:center}input{box-sizing:border-box;padding:12px;border-radius:12px;background:#061222;border:1px solid #ffffff44;color:#fff;margin:5px;width:90%;font-size:16px}.hide{display:none!important}.players{text-align:left;margin-top:10px}.p{padding:9px;background:#ffffff0d;border-radius:10px;margin:5px}.start{width:90%;height:58px;margin:8px 0;background:#1b8cff;font-size:18px}.small{opacity:.85;font-size:12px}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><span class="pill">🏎️ LUMIRA V13.2</span><span class="pill">🏁 <b id="lap">1/3</b></span></div></div><div class="controls"><div><button type="button" class="btn" id="left">◀</button><button type="button" class="btn" id="right">▶</button></div><button type="button" class="btn nitro" id="nitro">NITRO</button></div><div id="menu" class="menu"><div class="card"><h1>🏁 LUMIRA RACING</h1><input id="name" maxlength="24" placeholder="Player name"><input id="room" maxlength="24" placeholder="Room code"><button type="button" class="btn start" id="solo">▶ START RACE</button><button type="button" class="btn" id="join">👥 MULTIPLAYER</button><button type="button" class="btn" id="ready" disabled>READY</button><p id="status">Press START RACE to begin immediately.</p><div id="players" class="players"></div><p class="small">Solo works without another player. Multiplayer uses the live Render server.</p></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,d=1;function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();const API='https://studious-octo-fishstick-6.onrender.com';const id=localStorage.lumiraPlayerId||('p_'+crypto.randomUUID().replaceAll('-',''));localStorage.lumiraPlayerId=id;let ws=null,started=false,ready=false,last=0,t=0,px=W/2,prog=0,lap=1,key={l:0,r:0,n:0},remote=new Map(),players=[];const colors=['#42e8ff','#ff5577','#b77cff','#ffd447'];const $=id=>document.getElementById(id);function startRace(){started=true;$('menu').classList.add('hide');$('status').textContent='🏁 GO!';last=performance.now()}$('solo').addEventListener('click',startRace);function roomUrl(){const u=new URL(API);u.protocol='wss:';u.pathname='/ws/racing';return u.toString()}function render(){ $('players').innerHTML=players.map(p=>`<div class="p">🏎️ ${String(p.name||'PLAYER').replace(/[<>]/g,'')} ${p.ready?'✅ READY':'⏳ WAITING'}</div>`).join('');$('ready').disabled=!ws||ws.readyState!==1||ready}function connect(){if(ws?.readyState===1)return;const room=$('room').value.trim()||('ROOM-'+Math.random().toString(36).slice(2,7).toUpperCase());$('room').value=room;ws=new WebSocket(roomUrl());ws.onopen=()=>{ws.send(JSON.stringify({type:'join',roomId:room,playerId:id,name:$('name').value.trim()||'PLAYER'}));$('status').textContent='Room '+room+' joined — share code with another player'};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'||m.type==='players'){players=m.players||[];render()}if(m.type==='start'){startRace()}if(m.type==='state'&&m.id!==id)remote.set(m.id,{x:Number(m.x)||W/2,y:Number(m.y)||0,rx:Number(m.x)||W/2,ry:Number(m.y)||0})};ws.onerror=()=>$('status').textContent='WebSocket error — Solo still works';ws.onclose=()=>{if(!started)$('status').textContent='Disconnected — press START RACE'}}$('join').addEventListener('click',connect);$('ready').addEventListener('click',()=>{ready=true;ws?.send(JSON.stringify({type:'ready',ready:true}));render()});function bind(id,k){const e=$(id);e.addEventListener('pointerdown',e=>{e.preventDefault();key[k]=1});['pointerup','pointercancel','pointerleave'].forEach(ev=>e.addEventListener(ev,e=>{e.preventDefault();key[k]=0}))}bind('left','l');bind('right','r');bind('nitro','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')key.l=1;if(e.key==='ArrowRight')key.r=1;if(e.code==='Space')key.n=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')key.l=0;if(e.key==='ArrowRight')key.r=0;if(e.code==='Space')key.n=0});function car(a,b,col,s=1){x.fillStyle='#111827';x.beginPath();x.roundRect(a-23*s,b-40*s,46*s,80*s,11*s);x.fill();x.fillStyle=col;x.beginPath();x.roundRect(a-19*s,b-36*s,38*s,72*s,9*s);x.fill();x.fillStyle='#dff8ff';x.fillRect(a-13*s,b-20*s,26*s,16*s);x.fillStyle='#111';x.fillRect(a-25*s,b-27*s,6*s,17*s);x.fillRect(a+19*s,b-27*s,6*s,17*s);x.fillRect(a-25*s,b+12*s,6*s,17*s);x.fillRect(a+19*s,b+12*s,6*s,17*s)}function draw(){x.fillStyle='#1b5b38';x.fillRect(0,0,W,H);let h=H*.2,r=Math.min(W*.76,720);x.fillStyle='#2477a5';x.fillRect(0,0,W,h);x.fillStyle='#2d3038';x.beginPath();x.moveTo(W/2-r*.54,h);x.lineTo(W/2+r*.54,h);x.lineTo(W/2+r*.43,H);x.lineTo(W/2-r*.43,H);x.closePath();x.fill();x.strokeStyle='#f6f0b0';x.lineWidth=4;x.setLineDash([32,30]);x.lineDashOffset=-t*180;for(let q=1;q<3;q++){let xx=W/2-r*.42+r*.28*q;x.beginPath();x.moveTo(xx,h);x.lineTo(xx,H);x.stroke()}x.setLineDash([]);x.fillStyle='#ffd447';x.font='900 18px system-ui';x.fillText('LUMIRA GP',18,H*.2-18);let i=0;for(const p of remote.values()){car(p.x,H*.76-(p.y-prog)*.04,colors[(i++)%colors.length],.82)}car(px,H*.76,'#42e8ff');if(key.n){x.fillStyle='#ff8c24';x.beginPath();x.moveTo(px-14,H*.82);x.lineTo(px,H*.82+60+Math.random()*15);x.lineTo(px+14,H*.82);x.fill()}}function update(dt){if(!started)return;t+=dt;let r=Math.min(W*.76,720),speed=(key.n?1.6:1)*360;px+=((key.r?1:0)-(key.l?1:0))*dt*360;px=Math.max(W/2-r*.4,Math.min(W/2+r*.4,px));prog+=speed*dt;if(prog>2800){prog-=2800;lap++;if(lap>3){lap=3;started=false;$('status').textContent='🏆 FINISH!';ws?.send(JSON.stringify({type:'finish',score:1000}))}}$('lap').textContent=lap+'/3';if(ws?.readyState===1&&Math.floor(t*20)%3===0)ws.send(JSON.stringify({type:'state',x:px,y:prog,lap}))}function loop(n){const dt=Math.min(.033,(n-(last||n))/1000);last=n;for(const p of remote.values()){p.x+=(p.rx-p.x)*Math.min(1,dt*12);p.y+=(p.ry-p.y)*Math.min(1,dt*12)}update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
