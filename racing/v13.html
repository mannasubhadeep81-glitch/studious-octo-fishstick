<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMIRA Racing V13</title><style>body{margin:0;background:#050812;color:#fff;font:16px system-ui;text-align:center}main{max-width:520px;margin:8vh auto;padding:24px;background:#091325;border-radius:24px}input,button{padding:12px;margin:6px;border-radius:12px;border:1px solid #ffffff30;background:#07101d;color:#fff}button{font-weight:800}.players{text-align:left;margin:16px 0}.p{padding:9px;background:#ffffff09;border-radius:9px;margin:5px}</style><main><h1>🏎️ LUMIRA RACING V13</h1><p>Real-time multiplayer foundation</p><input id="name" placeholder="Player name" maxlength="24"><br><input id="room" placeholder="Room code" maxlength="24"><br><button id="join">JOIN ROOM</button><button id="ready" disabled>READY</button><div id="status">Offline</div><div id="players" class="players"></div><p>2–4 players • WebSocket • Render backend</p></main><script>const API='https://studious-octo-fishstick-6.onrender.com',id=localStorage.lumiraPlayerId||('p_'+crypto.randomUUID().replaceAll('-',''));localStorage.lumiraPlayerId=id;let ws,joined=false;const $=x=>document.getElementById(x);function render(ps=[]){$('players').innerHTML=ps.map(p=>`<div class="p">🏎️ ${String(p.name||'PLAYER').replace(/[<>]/g,'')} ${p.ready?'✅':'⏳'}</div>`).join('')}function connect(){const u=new URL(API);u.protocol=u.protocol==='https:'?'wss:':'ws:';u.pathname='/ws/racing';ws=new WebSocket(u);ws.onopen=()=>{joined=true;$('status').textContent='Connected';$('ready').disabled=false;ws.send(JSON.stringify({type:'join',roomId:$('room').value.trim(),playerId:id,name:$('name').value.trim()||'PLAYER'}))};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='players')render(m.players);if(m.type==='joined'){render(m.players);$('status').textContent='Room joined'}if(m.type==='start')$('status').textContent='🏁 RACE STARTING';if(m.type==='error')$('status').textContent='Error: '+m.message};ws.onclose=()=>{$('status').textContent='Disconnected'}}$('join').onclick=()=>{if(!$('room').value.trim())$('room').value='ROOM-'+Math.random().toString(36).slice(2,7).toUpperCase();connect()};$('ready').onclick=()=>ws?.send(JSON.stringify({type:'ready',ready:true}));</script></html>
