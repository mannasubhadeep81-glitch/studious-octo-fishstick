<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V4</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050812;color:#fff;font-family:system-ui}canvas{width:100%;height:100%;display:block}#ui{position:fixed;inset:0;pointer-events:none}.bar{display:flex;justify-content:space-between;padding:14px;font-weight:900;text-shadow:0 2px 8px #000}.pill{background:#07101dcc;border:1px solid #ffffff22;border-radius:12px;padding:7px 10px;margin:2px;font-size:12px}.controls{position:fixed;bottom:24px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}.btn{width:68px;height:60px;border:1px solid #ffffff30;border-radius:18px;background:#07101ddd;color:white;font-size:25px;font-weight:900}.nitro{width:92px;font-size:12px}.menu{position:fixed;inset:0;display:grid;place-items:center;background:#020611d9}.card{width:min(480px,88vw);text-align:center;padding:28px;border:1px solid #ffffff22;border-radius:26px;background:#091325ee;box-shadow:0 25px 90px #000}.card h1{font-size:58px;margin:0;background:linear-gradient(90deg,#fff,#5de0ff,#ce67ff);color:transparent;background-clip:text}.card p{opacity:.7}.start{padding:15px 25px;border:0;border-radius:14px;font-weight:900;background:#fff}.hidden{display:none}</style></head><body><canvas id="c"></canvas><div id="ui"><div class="bar"><span class="pill">LUMIRA // RACING V4</span><span><span class="pill">🏁 <b id="lap">1/3</b></span><span class="pill">⭐ <b id="score">0</b></span></span></div></div><div class="controls"><div><button class="btn" id="l">‹</button><button class="btn" id="r">›</button></div><button class="btn nitro" id="n">NITRO</button></div><div class="menu" id="m"><div class="card"><h1>LUMIRA</h1><h2>RACING V4</h2><p>High-quality 2D arcade racer • 3-lap race • traffic • nitro • checkpoints</p><button class="start" id="s">START RACE</button></div></div><script>const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,d=1;function rs(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();let key={l:0,r:0,n:0},run=0,t=0,sc=0,lap=1,dist=0,px;function road(){return Math.min(W*.72,680)}function reset(){px=W/2;sc=0;lap=1;dist=0;traffic=[]}let traffic=[];function spawn(){traffic.push({x:W/2+(Math.random()-.5)*road()*.75,y:-100-Math.random()*900,v:.7+Math.random()*.6,col:`hsl(${Math.random()*360} 80% 58%)`})}for(let i=0;i<9;i++)spawn();function car(px,py,col,me=false){x.save();x.translate(px,py);x.shadowColor=me?'#42e8ff':'#000';x.shadowBlur=me?25:8;x.fillStyle='#11151f';x.roundRect(-25,-44,50,88,12);x.fill();let g=x.createLinearGradient(-25,0,25,0);g.addColorStop(0,'#101521');g.addColorStop(.22,col);g.addColorStop(.5,'#fff');g.addColorStop(.58,col);g.addColorStop(1,'#0b1019');x.fillStyle=g;x.roundRect(-20,-39,40,78,10);x.fill();x.fillStyle='#071725';x.roundRect(-15,-24,30,25,6);x.fill();x.fillStyle=me?'#5ff6ff':'#ff304d';x.fillRect(-15,-37,30,4);x.fillRect(-15,33,30,4);x.restore()}function draw(){let h=H*.23;x.fillStyle='#061020';x.fillRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#081126');g.addColorStop(1,'#1c5774');x.fillStyle=g;x.fillRect(0,0,W,h);for(let z=0;z<4;z++){x.fillStyle=['#102735','#0d202a','#0a1a23','#07131d'][z];for(let i=-1;i<10;i++){let xx=i*110-(t*(20+z*13)%110);let bh=50+(i*37+z*19)%90;x.fillRect(xx,h+z*32-bh,75,bh)}}x.fillStyle='#183b2c';x.fillRect(0,h,W,H-h);let rw=road();x.fillStyle='#242a32';x.beginPath();x.moveTo(W/2-rw*.52,h);x.lineTo(W/2+rw*.52,h);x.lineTo(W/2+rw*.42,H);x.lineTo(W/2-rw*.42,H);x.closePath();x.fill();x.strokeStyle='#f4d86a';x.lineWidth=5;x.beginPath();x.moveTo(W/2-rw*.52,h);x.lineTo(W/2-rw*.42,H);x.moveTo(W/2+rw*.52,h);x.lineTo(W/2+rw*.42,H);x.stroke();x.strokeStyle='#eee';x.lineWidth=3;x.setLineDash([32,28]);x.lineDashOffset=-(t*2%60);for(let q=1;q<3;q++){let xx=W/2-rw*.42+rw*.28*q;x.beginPath();x.moveTo(xx,h);x.lineTo(xx,H);x.stroke()}x.setLineDash([]);traffic.forEach(q=>car(q.x,q.y,q.col));car(px,H*.78,'#4d82ff',true);x.fillStyle='#ffffff20';for(let i=0;i<12;i++)x.fillRect((i*97)%W,(i*151+t*5)%H,2,18)}function update(dt){if(!run)return;t+=dt;let sp=dt*(410*(key.n?1.65:1));px+=((key.r?1:0)-(key.l?1:0))*dt*360;let rw=road();px=Math.max(W/2-rw*.39,Math.min(W/2+rw*.39,px));traffic.forEach(q=>{q.y+=sp*q.v;if(q.y>H+100){q.y=-100-Math.random()*500;q.x=W/2+(Math.random()-.5)*rw*.75;q.v=.7+Math.random()*.6;sc+=100}if(Math.abs(q.x-px)<42&&Math.abs(q.y-H*.78)<75){sc=Math.max(0,sc-150);q.y=-300}});dist+=sp;if(dist>3200){dist=0;lap++;if(lap>3){run=0;document.querySelector('#m').classList.remove('hidden');document.querySelector('#s').textContent='RACE AGAIN'}}document.querySelector('#score').textContent=Math.floor(sc);document.querySelector('#lap').textContent=Math.min(lap,3)+'/3'}function loop(now){let dt=Math.min(.033,(now-(loop.last||now))/1000);loop.last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);document.querySelector('#s').onclick=()=>{document.querySelector('#m').classList.add('hidden');reset();run=1};function bind(id,k){let e=document.querySelector(id);e.onpointerdown=()=>key[k]=1;e.onpointerup=e.onpointercancel=e.onpointerleave=()=>key[k]=0}bind('#l','l');bind('#r','r');bind('#n','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')key.l=1;if(e.key==='ArrowRight')key.r=1;if(e.code==='Space')key.n=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')key.l=0;if(e.key==='ArrowRight')key.r=0;if(e.code==='Space')key.n=0});</script></body></html>
