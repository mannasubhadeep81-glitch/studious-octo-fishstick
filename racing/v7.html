<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LUMIRA Racing V7</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050812;color:#fff;font-family:system-ui}canvas{display:block;width:100%;height:100%}.ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:14px}.pill,.btn{background:#07101ddd;border:1px solid #ffffff25;border-radius:12px;color:#fff;padding:8px 11px;font-weight:800}.panel{position:fixed;inset:0;background:#020611e8;display:grid;place-items:center;z-index:4}.card{width:min(520px,90vw);padding:25px;border-radius:24px;background:#091325f5;text-align:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.btn{cursor:pointer}.big{padding:13px 20px;margin:5px}.hidden{display:none}.stat{font-size:13px;opacity:.75;margin:5px}.ai{position:fixed;top:58px;left:50%;transform:translateX(-50%);font-size:11px;background:#071426dd;padding:6px 10px;border-radius:99px}.controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:auto}.drive{width:68px;height:58px;font-size:24px}.nitro{width:92px;font-size:12px}</style></head><body><canvas id="c"></canvas><div class="ui"><div class="top"><span class="pill">LUMIRA RACING V7</span><span class="pill">🪙 <b id="coins">0</b> &nbsp;🏁 <b id="lap">1/3</b></span></div></div><div id="ai" class="ai">AI DRIVER: READY</div><div id="controls" class="controls"><div><button class="btn drive" id="l">‹</button><button class="btn drive" id="r">›</button></div><button class="btn nitro" id="n">NITRO</button></div><div id="menu" class="panel"><div class="card"><h1>🏎️ LUMIRA</h1><h2>GARAGE</h2><p class="stat">Coins: <b id="gc">0</b> • Best: <b id="best">0</b></p><div id="cars" class="grid"></div><p class="stat">Upgrade the selected car with coins.</p><button class="btn big" id="upgrade">UPGRADE</button><button class="btn big" id="race">START RACE</button><p id="msg" class="stat"></p></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,d=1;function rs(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();const API='https://studious-octo-fishstick-6.onrender.com';const cars=[{name:'Azure',col:'#4d82ff',cost:0},{name:'Crimson',col:'#ff3d61',cost:300},{name:'Violet',col:'#a66cff',cost:600}];let coins=Number(localStorage.lumiraCoins||0),best=Number(localStorage.lumiraBest||0),selected=Number(localStorage.lumiraCar||0),level=Number(localStorage.lumiraLevel||1),run=false,t=0,px,lap=1,prog=0,score=0,key={l:0,r:0,n:0},ai={action:'STEADY'},opp={x:0,y:0,s:1};const trackNames=['Neon City','Sunset Coast','Midnight Circuit'];let track=Number(localStorage.lumiraTrack||0);function save(){localStorage.lumiraCoins=coins;localStorage.lumiraBest=best;localStorage.lumiraCar=selected;localStorage.lumiraLevel=level;localStorage.lumiraTrack=track}function renderGarage(){document.getElementById('gc').textContent=coins;document.getElementById('best').textContent=best;document.getElementById('cars').innerHTML=cars.map((a,i)=>`<button class="btn" data-i="${i}">${a.name}<br>Lv.${i===selected?level:1}<br>${i===selected?'SELECTED':(i===0?'FREE':'🪙 '+a.cost)}</button>`).join('');document.querySelectorAll('#cars button').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(i!==selected&&coins>=cars[i].cost){coins-=cars[i].cost;selected=i;level=1;save();renderGarage()}})}renderGarage();function road(){return Math.min(W*.72,680)}function reset(){px=W/2;lap=1;prog=0;score=0;opp={x:W*.5,y:H*.42,s:.95};ai={action:'STEADY'}}function car(px,py,col,me=false){x.save();x.translate(px,py);x.shadowColor=me?'#42e8ff':'#000';x.shadowBlur=me?25:8;x.fillStyle='#101521';x.roundRect(-25,-44,50,88,12);x.fill();x.fillStyle=col;x.roundRect(-20,-39,40,78,10);x.fill();x.fillStyle='#061827';x.roundRect(-15,-23,30,24,6);x.fill();x.fillStyle=me?'#5ff6ff':'#ff304d';x.fillRect(-15,-37,30,4);x.restore()}function draw(){let h=H*.23;x.fillStyle=track===0?'#071426':track===1?'#402b21':'#09091b';x.fillRect(0,0,W,H);x.fillStyle=track===1?'#8c6b45':'#183b2c';x.fillRect(0,h,W,H-h);let r=road();x.fillStyle='#252a31';x.beginPath();x.moveTo(W/2-r*.52,h);x.lineTo(W/2+r*.52,h);x.lineTo(W/2+r*.42,H);x.lineTo(W/2-r*.42,H);x.closePath();x.fill();x.strokeStyle='#f4d86a';x.lineWidth=5;x.stroke();x.strokeStyle='#fff';x.lineWidth=3;x.setLineDash([30,28]);x.lineDashOffset=-t*2;for(let q=1;q<3;q++){let xx=W/2-r*.42+r*.28*q;x.beginPath();x.moveTo(xx,h);x.lineTo(xx,H);x.stroke()}x.setLineDash([]);car(opp.x,opp.y,'#ff3d61');car(px,H*.78,cars[selected].col,true)}function update(dt){if(!run)return;t+=dt;let mult=1+(level-1)*.08;let sp=dt*410*mult*(key.n?1.65:1);px+=((key.r?1:0)-(key.l?1:0))*dt*360;let r=road();px=Math.max(W/2-r*.39,Math.min(W/2+r*.39,px));let os=ai.action==='NITRO'?1.45:ai.action==='ACCELERATE'?1.22:.96;opp.s=os;opp.x+=Math.sign(px-opp.x)*dt*(150+os*90);opp.x=Math.max(W/2-r*.36,Math.min(W/2+r*.36,opp.x));opp.y+=dt*260*os;if(opp.y>H+80)opp.y=-80;prog+=sp;if(prog>2800){prog-=2800;lap++;if(lap>3)finish()}document.getElementById('lap').textContent=Math.min(lap,3)+'/3'}function finish(){run=false;let reward=100+level*25;coins+=reward;best=Math.max(best,score);save();document.getElementById('menu').classList.remove('hidden');document.getElementById('msg').textContent=`Race complete! +🪙 ${reward} • Score ${score}`;renderGarage()}async function getAI(){if(!run)return;try{let r=await fetch(API+'/api/race-advice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({speed:key.n?170:105,nitro:key.n?20:75,position:opp.y<H*.78?1:2,lap})});if(r.ok){ai=await r.json();document.getElementById('ai').textContent='AI DRIVER: '+(ai.action||'STEADY')}}catch(e){document.getElementById('ai').textContent='AI DRIVER: OFFLINE'}}setInterval(getAI,3000);document.getElementById('upgrade').onclick=()=>{let cost=200*level;if(coins>=cost){coins-=cost;level++;save();renderGarage();document.getElementById('msg').textContent='Upgrade complete: Level '+level}else document.getElementById('msg').textContent='Need 🪙 '+cost};document.getElementById('race').onclick=()=>{document.getElementById('menu').classList.add('hidden');track=(track+1)%trackNames.length;save();reset();run=true;getAI()};function loop(n){let dt=Math.min(.033,(n-(loop.last||n))/1000);loop.last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);function bind(id,k){let e=document.getElementById(id);e.onpointerdown=()=>key[k]=1;e.onpointerup=e.onpointercancel=e.onpointerleave=()=>key[k]=0}bind('l','l');bind('r','r');bind('n','n');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')key.l=1;if(e.key==='ArrowRight')key.r=1;if(e.code==='Space')key.n=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')key.l=0;if(e.key==='ArrowRight')key.r=0;if(e.code==='Space')key.n=0});</script></body></html>
