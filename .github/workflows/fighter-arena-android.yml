name: Build Fighter Arena APK

on:
  push:
    branches: [main, "feature/fighter-arena-prototype"]
    paths:
      - "FighterArena/**"
      - ".github/workflows/fighter-arena-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export APK
        working-directory: FighterArena
        run: |
          mkdir -p build
          godot --headless --verbose --path . --editor --quit
          godot --headless --path . --export-debug Android build/FighterArena.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FighterArena-debug-apk
          path: FighterArena/build/FighterArena.apk
          if-no-files-found: error
          retention-days: 14
