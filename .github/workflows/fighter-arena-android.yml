name: Build Fighter Arena APK

on:
  push:
    branches: [main, "feature/fighter-arena-prototype", "feature/fighter-arena-campaign"]
    paths:
      - "FighterArena/**"
      - ".github/workflows/fighter-arena-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install download utilities
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v curl >/dev/null 2>&1; then
            apt-get update
            apt-get install -y curl unzip
          fi
          command -v curl
          command -v unzip

      - name: Configure Android export tools
        working-directory: FighterArena
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/templates "$HOME/.config/godot" "$HOME/.android"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o build/export_templates.tpz
          unzip -o build/export_templates.tpz -d build/templates
          TEMPLATE_DIR="$(find "$PWD/build/templates" -type f -name android_debug.apk -printf '%h\n' | head -1)"
          test -n "$TEMPLATE_DIR"
          test -f "$TEMPLATE_DIR/android_release.apk"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp "$TEMPLATE_DIR"/*.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          JAVA_PATH="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")}"
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/lib/android-sdk}}"
          test -x "$JAVA_PATH/bin/java"
          test -d "$SDK_PATH"
          # Install the SDK packages required by Godot Android export.
          SDKMANAGER="$(find "$SDK_PATH" -type f -name sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_PATH/cmdline-tools"
            curl -fL --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o build/android-commandlinetools.zip
            mkdir -p build/android-commandlinetools
            unzip -q -o build/android-commandlinetools.zip -d build/android-commandlinetools
            rm -rf "$SDK_PATH/cmdline-tools/latest"
            mkdir -p "$SDK_PATH/cmdline-tools/latest"
            cp -R build/android-commandlinetools/cmdline-tools/. "$SDK_PATH/cmdline-tools/latest/"
            SDKMANAGER="$SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_PATH" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_PATH" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$SDK_PATH/platform-tools/adb"
          test -x "$SDK_PATH/build-tools/35.0.0/apksigner"
          test -d "$SDK_PATH/platforms/android-35"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/android_sdk_path = "$SDK_PATH"
          EOF
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Export APK
        working-directory: FighterArena
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          TEMPLATE_DIR="$(find "$PWD/build/templates" -type f -name android_debug.apk -printf '%h\n' | head -1)"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"
          # Use Godot's standard APK-template export. Gradle mode requires a separate
          # generated Android project and SDK target settings, which this preset lacks.
          sed -i "s|^custom_template/debug=.*|custom_template/debug=\"$TEMPLATE_DIR/android_debug.apk\"|" export_presets.cfg
          sed -i "s|^custom_template/release=.*|custom_template/release=\"$TEMPLATE_DIR/android_release.apk\"|" export_presets.cfg
          sed -i 's|^gradle_build/use_gradle_build=.*|gradle_build/use_gradle_build=false|' export_presets.cfg
          godot --headless --verbose --path . --editor --quit
          # Run the actual main scene briefly and fail the build if Godot logs script/runtime errors.
          set +e
          godot --headless --verbose --path . --quit-after 5 2>&1 | tee build/smoke-test.log
          SMOKE_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$SMOKE_STATUS" -ne 0 ] || grep -E "SCRIPT ERROR|Parse Error|ERROR:" build/smoke-test.log; then
            echo "Godot runtime smoke test failed; see log above."
            exit 1
          fi
          godot --headless --verbose --path . --export-debug Android "$PWD/build/FighterArena.apk"
          test -s build/FighterArena.apk
          ls -lh build/FighterArena.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FighterArena-debug-apk
          path: FighterArena/build/FighterArena.apk
          if-no-files-found: error
          retention-days: 14
