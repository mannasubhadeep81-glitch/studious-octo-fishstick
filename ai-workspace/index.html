<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>LUMIRA AI</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#fff}main{max-width:920px;margin:auto;padding:20px}header{padding:10px 0 8px}h1{margin:0;font-size:34px}section{background:#151c33;border:1px solid #2b3555;border-radius:18px;padding:18px;margin:14px 0}textarea{width:100%;min-height:130px;resize:vertical;background:#0d1428;color:#fff;border:1px solid #334064;border-radius:12px;padding:14px;font:inherit}button{margin-top:12px;margin-right:8px;padding:12px 18px;border:0;border-radius:10px;background:#fff;color:#111;font-weight:700;cursor:pointer}button.secondary{background:#334064;color:#fff}button:disabled{opacity:.55;cursor:not-allowed}.muted{opacity:.75;font-size:14px}.status{font-weight:700}.status.error{color:#ffb4b4}.status.ok{color:#b8f7c4}#result{white-space:pre-wrap;overflow:auto;line-height:1.55;margin:0}.dot{font-size:38px}.hidden{display:none}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#25304f;font-size:12px}
</style>
</head>
<body><main>
<header><h1>LUMIRA AI</h1><p class="muted">Your AI workspace — ask, analyze, plan and build.</p></header>
<section>
<span class="pill" id="healthPill">Checking backend…</span>
<p class="muted">The API key stays on the server. It is never placed in this page.</p>
</section>
<section>
<h2>Ask LUMIRA</h2>
<textarea id="prompt" placeholder="Ask LUMIRA anything…"></textarea>
<button id="askBtn" onclick="runAI()">Ask LUMIRA AI</button>
<button class="secondary" id="planBtn" onclick="analyze()">Analyze / Plan</button>
<p class="status" id="status">Ready</p>
</section>
<section>
<h2>Result</h2>
<pre id="result">Waiting for your instruction.</pre>
</section>
<script>
const backend=window.location.origin;
const promptEl=document.getElementById('prompt');
const resultEl=document.getElementById('result');
const statusEl=document.getElementById('status');
const askBtn=document.getElementById('askBtn');
const planBtn=document.getElementById('planBtn');
const healthPill=document.getElementById('healthPill');
function setStatus(text,type=''){statusEl.textContent=text;statusEl.className='status '+type}
async function health(){try{const r=await fetch(backend+'/health');const d=await r.json();if(r.ok&&d.status==='ok'){healthPill.textContent='Backend online';}else throw new Error();}catch{healthPill.textContent='Backend unavailable';}}
async function callAI(instruction){
 const input=instruction.trim();
 if(!input){setStatus('Enter a question first.','error');return}
 askBtn.disabled=true;planBtn.disabled=true;resultEl.textContent='LUMIRA is thinking…';setStatus('Connecting to LUMIRA AI…');
 try{
  const r=await fetch(backend+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:input})});
  const data=await r.json().catch(()=>({error:'Server returned an invalid response.'}));
  if(!r.ok||!data.ok)throw new Error(data.error||('Request failed (HTTP '+r.status+').'));
  resultEl.textContent=data.output||'AI returned an empty response.';setStatus('AI response received','ok');
 }catch(e){resultEl.textContent='LUMIRA AI error:\n\n'+e.message;setStatus('AI connection error','error');}
 finally{askBtn.disabled=false;planBtn.disabled=false}
}
function runAI(){callAI(promptEl.value)}
function analyze(){callAI('Analyze the following project request. Give a practical implementation plan, required files/changes, risks, and testing steps. Never claim that a build or deployment was executed unless it actually was.\n\nProject request:\n'+promptEl.value)}
promptEl.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')runAI()});
health();
</script>
</body></html>
