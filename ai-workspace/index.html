<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMIRA AI Workspace</title>
<style>
body{margin:0;font-family:system-ui;background:#0b1020;color:#fff}main{max-width:900px;margin:auto;padding:20px}section{background:#151c33;border:1px solid #2b3555;border-radius:18px;padding:18px;margin:14px 0}textarea,input{width:100%;box-sizing:border-box;background:#0d1428;color:#fff;border:1px solid #334064;border-radius:12px;padding:12px}textarea{min-height:110px}button{margin-top:12px;margin-right:8px;padding:12px 18px;border:0;border-radius:10px;background:#fff;color:#111;font-weight:700}button.secondary{background:#334064;color:#fff}#game{display:none;text-align:center}.dot{font-size:48px}pre{white-space:pre-wrap;overflow:auto}.muted{opacity:.75;font-size:14px}.status{font-weight:700}
</style>
</head>
<body><main>
<h1>LUMIRA AI Workspace</h1>
<p>Instruction → AI → Result</p>
<section>
<h2>Connection</h2>
<input id="backend" value="" placeholder="Using this LUMIRA server">
<p class="muted">This workspace uses the same Render service. Your OpenAI API key stays on the server and is never exposed in the browser.</p>
</section>
<section>
<h2>Instruction</h2>
<textarea id="prompt" placeholder="Tell LUMIRA what you want to build, change, explain, or analyze..."></textarea>
<button onclick="runPlan()">Ask LUMIRA AI</button>
<button class="secondary" onclick="buildAndAnalyze()">Analyze / Plan</button>
<p class="status" id="status">Ready</p>
</section>
<section id="game"><h2>Working</h2><div class="dot">⚙️</div><p>LUMIRA AI is processing…</p></section>
<section><h2>Result</h2><pre id="result">Waiting for an instruction.</pre></section>
</main>
<script>
const backendInput=document.getElementById('backend');
backendInput.value=window.location.origin;
function setStatus(t){document.getElementById('status').textContent=t}
function getConnection(){const p=document.getElementById('prompt').value.trim();const base=(document.getElementById('backend').value.trim()||window.location.origin).replace(/\/$/,'');if(!p){setStatus('Enter an instruction first.');return null}return {p,base}}
async function callAI(instruction){
 const c=getConnection();if(!c)return;
 document.getElementById('game').style.display='block';document.getElementById('result').textContent='Sending instruction to LUMIRA AI…';setStatus('Connecting');
 try{
  const r=await fetch(c.base+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:instruction})});
  const data=await r.json();
  if(!r.ok||!data.ok)throw new Error(data.error||'Backend request failed');
  document.getElementById('result').textContent=data.output||'AI returned an empty response.';
  setStatus('Connected • AI response received');
 }catch(e){document.getElementById('result').textContent='Connection error: '+e.message;setStatus('Connection error')}finally{document.getElementById('game').style.display='none'}
}
function runPlan(){callAI(document.getElementById('prompt').value.trim())}
function buildAndAnalyze(){callAI('Analyze this project request and give a practical implementation plan, required files/changes, build risks, and testing steps. Do not claim that a build was executed unless it actually was.\n\nUser request:\n'+document.getElementById('prompt').value.trim())}
</script>
</body></html>
