<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Developer Workspace</title>
<style>body{margin:0;font-family:system-ui;background:#0b1020;color:#fff}main{max-width:900px;margin:auto;padding:24px}section{background:#151c33;border:1px solid #2b3555;border-radius:18px;padding:18px;margin:14px 0}textarea{width:100%;min-height:110px;box-sizing:border-box;background:#0d1428;color:#fff;border:1px solid #334064;border-radius:12px;padding:12px}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#fff;color:#111;font-weight:700}#game{display:none;text-align:center;font-size:18px}.dot{font-size:48px}pre{white-space:pre-wrap}</style>
</head>
<body><main>
<h1>AI Developer Workspace</h1><p>Instruction → AI → Project → Build/Test → Report</p>
<section><h2>Instruction</h2><textarea id="prompt" placeholder="Tell the AI what to build or change..."></textarea><button onclick="run()">Generate / Run</button></section>
<section id="game"><h2>Mini Game</h2><div class="dot">🚀</div><p>Generation চলছে… Tap the button to score.</p><button onclick="score()">+1</button><p>Score: <b id="score">0</b></p></section>
<section><h2>Result</h2><pre id="result">Waiting for an instruction.</pre></section>
</main><script>let s=0;function score(){document.getElementById('score').textContent=++s}function run(){const p=document.getElementById('prompt').value.trim();if(!p)return;document.getElementById('game').style.display='block';document.getElementById('result').textContent='AI workspace processing your instruction…';setTimeout(()=>{document.getElementById('game').style.display='none';document.getElementById('result').textContent='Workspace demo completed. Backend/OpenAI integration is the next connection layer.'},1800)}</script></body></html>
